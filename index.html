","_m":1789344000000},{"cat":"achat","crit":false,"detail":"Partez avec le strict minimum : une doudoune synthétique compressible, un coupe-vent imperméable, un mérinos manches longues, un legging thermique. Complétez à Tokyo chez Uniqlo (Heattech, Ultra Light Down) ou Montbell si besoin — c'est moins cher et meilleur qu'en France.\n\nPuis, AVANT de partir vers l'Indonésie, renvoyez un colis en France depuis la poste japonaise : vous voyagez ensuite trois mois en configuration tropicale.","done":false,"due":"2026-09-19","id":"b51","order":350,"tags":["sac"],"title":"La couche chaude, et le colis de retour","url":"","when":"avant","_m":1789344000000},{"cat":"achat","crit":false,"detail":"Japon type A en 100 V. Thaïlande, Indonésie, Laos : A/C/F en 220 V.\n\nSingapour, Malaisie, Sri Lanka : type G britannique en 230 V. Un adaptateur universel plus une multiprise légère (un adaptateur pour trois appareils).","done":false,"due":"2026-09-19","id":"b52","order":360,"tags":["sac"],"title":"Adaptateurs — trois standards sur le voyage","url":"","when":"avant","_m":1789344000000},{"cat":"achat","crit":false,"detail":"Crème solaire non éclaircissante (presque toutes celles vendues en Asie du Sud-Est contiennent des agents blanchissants — achetez au Japon, elles y sont excellentes), déodorant anti-transpirant européen, tampons hygiéniques hors Japon-Singapour-Malaisie, chaussures au-delà du 44, chaussures de randonnée de qualité, deuxième paire de lunettes avec l'ordonnance optique.","done":false,"due":"2026-09-19","id":"b53","order":370,"tags":["sac"],"title":"Ce qui ne s'achète PAS sur place","url":"","when":"avant","_m":1789344000000},{"cat":"achat","crit":false,"detail":"Billets récents et non pliés. Le visa laotien à l'arrivée se paie 40 USD en espèces par personne, et le cash dépanne en Indonésie rurale.\n\nAjoutez un peu de yens pour les bus de montagne d'Okuhida, qui ne prennent pas l'IC card.","done":false,"due":"2026-09-19","id":"b54","order":380,"tags":["argent"],"title":"Retirer 200-300 USD en billets neufs","url":"","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Jeudi 24 septembre à l'ouverture, 10 h, à Shiba, Minato-ku (stations Mita, Shiba-koen ou Hamamatsucho). Les deux permis originaux et 10 000 ¥.\n\nDemandez l'émission d'urgence en une heure. Déposez AUSSI la demande JAF en ligne le 21 en arrivant, comme ceinture de sécurité : 12 000 ¥ perdus valent mieux que trois jours de road-trip.","done":false,"due":"2026-09-24","id":"c01","order":390,"tags":["japon","permis"],"title":"Retirer les traductions de permis chez ALADDIN","url":"https://aladdin.or.jp/about/","when":"pendant","_m":1789344000000},{"cat":"achat","crit":false,"detail":"Depuis la poste japonaise, avant le vol pour l'Indonésie. Surface mail : lent (~2 mois) mais très économique.","done":false,"due":"2026-10-14","id":"c02","order":400,"tags":["japon","sac"],"title":"Renvoyer le colis de vêtements chauds","url":"","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"30 jours, prolongeable une fois, ~500 000 IDR. À demander début octobre (validité 90 jours après émission).\n\nUNIQUEMENT sur evisa.imigrasi.go.id.","done":false,"due":"2026-10-05","id":"c03","order":410,"tags":["visa","indonesie"],"title":"e-VOA Indonésie","url":"https://evisa.imigrasi.go.id/","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"La carte d'arrivée est obligatoire et gratuite, dans les 3 jours précédant l'arrivée : elle fusionne immigration, douane et santé. Et la taxe touristique de Bali, 150 000 IDR par personne, sur lovebali.baliprov.go.id — elle s'applique aussi si vous entrez par le ferry de Gilimanuk.","done":false,"due":"2026-10-14","id":"c04","order":420,"tags":["visa","indonesie"],"title":"All Indonesia Arrival Card + taxe de Bali","url":"https://allindonesia.imigrasi.go.id/","when":"pendant","_m":1789344000000},{"cat":"transport","crit":false,"detail":"Le meilleur mode de transport de l'île, très supérieur aux bus de nuit. Ouverture des ventes à J-45, ça part vite le week-end.\n\nApp Access by KAI.","done":false,"due":"2026-09-20","id":"c05","order":430,"tags":["indonesie","trains"],"title":"Trains KAI à Java","url":"","when":"pendant","_m":1789344000000},{"cat":"transport","crit":false,"detail":"Réserver 3 à 6 semaines avant. Et prévoir la nuit tampon à Sanur au retour : aucun vol direct Labuan Bajo → Singapour, un retard de vol intérieur ferait sauter l'international.","done":false,"due":"2026-10-15","id":"c06","order":440,"tags":["indonesie","vols"],"title":"Bateau Komodo et vol DPS → Labuan Bajo","url":"","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"Les deux sont OBLIGATOIRES et GRATUITS, à remplir dans les 3 jours précédant chaque arrivée. Le MDAC reste requis même en entrant par voie terrestre depuis Singapour.\n\nDe faux sites facturent jusqu'à 80 USD ces formulaires gratuits : vérifiez que l'URL est bien en .gov.sg et .imi.gov.my.","done":false,"due":"2026-11-14","id":"c07","order":450,"tags":["visa","malaisie"],"title":"SG Arrival Card et MDAC","url":"https://eservices.ica.gov.sg/sgarrivalcard","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"Le TDAC est obligatoire et gratuit, dans les 3 jours avant l'arrivée, sur tdac.immigration.go.th uniquement. Et prévoyez 20 000 THB par personne justifiables.\n\n!! ⚠️ L'exemption de visa est passée de 60 à 30 jours le 15/09/2026 : vos 28 nuits passent avec deux jours de marge seulement.","done":false,"due":"2026-11-19","id":"c08","order":460,"tags":["visa","thailande"],"title":"TDAC et preuve de fonds","url":"https://tdac.immigration.go.th","when":"pendant","_m":1789344000000},{"cat":"transport","crit":false,"detail":"Krabi ou Phuket → CNX, à réserver 3 à 6 semaines avant : décembre est la pointe annuelle du trafic intérieur thaïlandais.","done":false,"due":"2026-11-01","id":"c09","order":470,"tags":["thailande","vols"],"title":"Vol intérieur vers Chiang Mai","url":"","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"Visa obligatoire pour les Français. 30 jours, délai 3 jours ouvrés, validité 60 jours après approbation — à demander vers le 10 décembre.\n\nUNIQUEMENT sur laoevisa.gov.la : evisagov.la se présente comme officiel et ne l'est pas. Le pont de l'Amitié IV à Huay Xai accepte l'e-Visa.","done":false,"due":"2026-12-10","id":"c10","order":480,"tags":["visa","laos"],"title":"e-Visa Laos","url":"https://laoevisa.gov.la/","when":"pendant","_m":1789344000000},{"cat":"transport","crit":false,"detail":"Les billets ne s'ouvrent que 7 jours avant. Vos trajets du 28 au 31 décembre tombent sur la semaine la plus chargée de l'année : réservez à la minute où ça ouvre.\n\nGares excentrées, 45 min de marge.","done":false,"due":"2026-12-21","id":"c11","order":490,"tags":["laos","trains"],"title":"Train LCR — réserver dès l'ouverture J-7","url":"","when":"pendant","_m":1789344000000},{"cat":"transport","crit":false,"detail":"Les places réservées s'ouvrent exactement 30 jours avant, à 8h30 heure de Colombo, sur seatreservation.slr.lk — et partent en quelques minutes en janvier. Créez le compte à l'avance et mettez une alarme.\n\nPlans B : 3e classe non réservée en montant à Kandy même, ou les wagons privés ExpoRail et Rajadhani.","done":false,"due":"2026-12-16","id":"c12","order":500,"tags":["sri-lanka","trains"],"title":"Train Kandy → Ella — alarme à J-30","url":"https://seatreservation.slr.lk/","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"Le régime de gratuité a été annoncé pour un an avec une revue à six mois qui tombe vers novembre 2026. Votre entrée en janvier devrait être couverte, ce n'est pas garanti.\n\nSi la gratuité tombe, l'ETA repasse à 50 USD.","done":false,"due":"2026-12-15","id":"c13","order":510,"tags":["visa","sri-lanka"],"title":"Revérifier la gratuité de l'ETA","url":"https://www.eta.gov.lk/slvisa/","when":"pendant","_m":1789344000000},{"cat":"admin","crit":false,"detail":"La 3e dose de rage, la 3e d'hépatite B et la 2e d'encéphalite japonaise se font en route. Les cliniques de voyage de Bangkok (Bumrungrad, Bangkok Hospital) et de Singapour sont excellentes et abordables.","done":false,"due":"2026-11-20","id":"c14","order":520,"tags":["sante","vaccins"],"title":"Doses de rappel — rage, hépatite B, EJ","url":"","when":"pendant","_m":1789344000000},{"cat":"achat","crit":false,"detail":"Trois pays où la SIM locale bat nettement le roaming eSIM : Telkomsel en Indonésie (couverture très supérieure hors Bali et Java), AIS ou True en Thaïlande, Dialog ou Mobitel au comptoir de l'aéroport de Colombo. Pas au Japon (les SIM voix imposent une adresse japonaise), pas à Singapour (séjour trop court).","done":false,"due":"2026-10-16","id":"c15","order":530,"tags":["esim"],"title":"SIM locales : Indonésie, Thaïlande, Sri Lanka","url":"","when":"pendant","_m":1789344000000}],"guide":[{"icon":"📱","id":"app","key":true,"order":0,"sections":[{"k":"Tout est modifiable","v":"Il n'y a rien de figé dans cette app. **Chaque étape** se modifie (titre, code, dates, nombre de nuits, statut, mode de transport, et les trois blocs de texte). **Chaque journée** aussi : repère, date, titre, programme ligne par ligne, où manger, où dormir, point de vigilance. Les **fiches À savoir** de chaque pays et les **points du guide** s'éditent et s'ajoutent. Les **actions à réserver** se créent, se datent, se taguent et se suppriment. Les **candidats hébergement** également.\n\nCe que vous écrivez est enregistré immédiatement et visible sur l'autre téléphone dans la seconde.\n\n**Mise en forme du texte** : `**gras**` pour un mot-clé, une ligne commençant par `•` pour une puce, `!!` en début de paragraphe pour un encadré d'alerte orange, `>>` pour un encadré bleu qui met en avant la conclusion, et une ligne vide entre les paragraphes."},{"k":"Les tags remplacent les points rouges","v":"Les emoji rouges ont disparu des titres. À la place, chaque action porte des **tags** et un indicateur d'urgence.\n\nUne action est **urgente** si vous l'avez marquée comme telle, ou si son échéance tombe dans les deux jours. Elle reçoit alors un liseré rouge à gauche, et elle remonte en tête de liste.\n\nLe filtre en haut de l'onglet Réserver combine tout : **🔥 Urgent** vous donne d'un coup tout ce qui presse, quelle que soit la catégorie — y compris les histoires de sac à dos si elles sont datées. Ensuite vous pouvez filtrer par moment (avant le départ / en route), par catégorie, ou par tag : `#japon`, `#permis`, `#voiture`, `#sumo`, `#visa`, `#sac`, `#vaccins`, `#trains`, `#vols`…\n\n**Créez vos propres tags** : dans la fiche d'une action, tapez-le dans le champ et validez avec Entrée. Il devient aussitôt disponible comme filtre."},{"k":"Demander une action à Claude","v":"En bas de presque chaque écran, il y a une boîte **Demander à Claude**. Elle n'est pas générique : **elle envoie automatiquement le contexte de l'écran où vous êtes**.\n\n• Depuis une **étape**, elle envoie le programme jour par jour, les hébergements en lice et les contraintes de transport. C'est là qu'on demande « benchmarke les hébergements », « voiture ou transports ici ? », « optimise ces journées ».\n• Depuis un **pays**, elle envoie l'enchaînement complet des étapes. C'est là qu'on demande « challenge cet enchaînement » ou « le rythme est-il tenable ? ».\n• Depuis **Maintenant** ou **Réserver**, elle envoie tout le voyage ou toute la liste d'actions.\n• Depuis une **action précise**, elle envoie cette action et le contexte du voyage : « comment je m'y prends concrètement ? ».\n\nLes boutons gris sous la boîte sont des raccourcis, mais vous pouvez écrire n'importe quoi. **La réponse ne s'enregistre pas** : si elle vous convainc, recopiez la conclusion dans la fiche concernée."},{"k":"Hors ligne : non, et voici la parade","v":"**L'app a besoin de réseau.** Elle s'ouvre depuis claude.ai et ses données vivent dans une base en ligne, partagée entre vos deux téléphones. Sans connexion, elle ne s'ouvre pas. Concrètement, en Asie, ça veut dire : l'eSIM est une dépendance du voyage, pas un confort.\n\n>> **La parade est en bas de l'onglet Guide : « Télécharger le guide pour l'avion ».** Ça fabrique un fichier HTML autonome contenant tout — le jour par jour, les fiches pays, les hébergements, les actions restantes, le guide entier — et ce fichier s'ouvre dans n'importe quel navigateur, sans réseau, sans compte. Refaites-le avant chaque vol long, il reflète les données du moment.\n\nLes cartes, elles, sont dessinées directement dans la page : pas d'images à charger, elles s'affichent même sur une connexion misérable."},{"k":"Les cartes : ce qu'elles sont, et ce qu'elles ne peuvent pas être","v":"Ce sont de **vraies cartes** : les côtes, les îles et les frontières viennent de Natural Earth, projetées aux coordonnées réelles de chaque étape, avec une grille de latitude et une échelle en kilomètres. Le trait plein est une liaison terrestre, le pointillé un vol ou un bateau.\n\n!! **Ce qu'elles ne peuvent pas être : des cartes Google avec les rues.** Une page publiée sur claude.ai ne peut charger aucune image ni aucune tuile depuis un serveur extérieur — c'est une règle de sécurité de la plateforme, pas un choix. Un fond de carte routier est donc techniquement impossible ici.\n\n>> **La parade** : sous chaque carte, le lien **« Ouvrir dans Maps »** lance l'itinéraire complet de l'étape dans Google Maps, avec toutes les escales dans l'ordre. Vous y avez les rues, le trafic, les temps de trajet réels et la navigation. La carte de l'app sert à comprendre la géographie d'un coup d'œil ; Maps sert à s'y rendre."},{"k":"Non, ChatGPT ne pourra pas faire ce travail","v":"Vous m'avez demandé si donner le lien de l'artifact à ChatGPT lui permettrait de faire la même chose. **Non, et pour une raison structurelle.**\n\nLe contenu de cette app n'est pas dans la page. La page est une coquille vide d'une centaine de kilo-octets ; **tout le voyage vit dans une base de données** que seule l'exécution de la page à l'intérieur de Claude peut atteindre, en s'authentifiant avec votre compte. Un outil extérieur qui charge l'URL ne récupérerait que la coquille : aucune étape, aucune journée, aucune action. Et il ne pourrait évidemment rien y écrire.\n\n>> **Ce qui marche, en revanche** : téléchargez le guide hors ligne depuis l'onglet Guide et donnez **ce fichier** à l'outil de votre choix. Il contient tout le contenu en clair. Vous perdez l'écriture directe dans l'app, mais la lecture et l'analyse sont possibles par n'importe qui."},{"k":"Thème clair ou sombre","v":"Par défaut, l'app **suit le réglage de votre téléphone** — sombre le soir si votre système l'est.\n\nLe bouton rond en haut à droite fait tourner trois positions : **automatique** (le réglage du téléphone), **clair**, **sombre**. Votre choix est mémorisé sur cet appareil. Utile quand on lit dans un bus de nuit et qu'on ne veut pas dépendre du réglage système."}],"sub":"ce qu'elle sait faire, et ce qu'elle ne sait pas","title":"Comment marche cette app","_m":1789344000000},{"icon":"⚖️","id":"decisions","key":true,"order":1,"sections":[{"k":"1. Izu : on remet la question sur la table","v":"Vous aviez coupé la péninsule. **Après réexamen : ajoutez-la, mais deux nuits, pas plus.**\n\nVos trois arguments d'origine étaient exacts — le bambou de Shuzenji ne tient pas la comparaison avec Arashiyama, la wasabiraie d'Ikadaba n'est pas visitable (deux places de parking, exploitation en activité), et Hirayu vous donne déjà le village thermal. Mais vous jugiez sur les mauvais critères.\n\n>> Le vrai argument, c'est que **votre voyage japonais ne contient pas un mètre de côte**. Izu apporte trois choses uniques : la Nishi-Izu Skyline (dix kilomètres de route de crête gratuite, la plus belle de votre itinéraire), la côte de Jōgasaki (dix kilomètres de sentier sur falaises de lave avec un pont suspendu à 48 m), et le poisson de côte.\n\n**Format recommandé** : nuit 1 à Toi ou Heda (coucher de soleil sur la baie de Suruga, Fuji au petit matin), nuit 2 à Shuzenji (on sort en yukata le soir, et là le bambou illuminé reprend du sens). Joren Falls et son wasabi-don sur la route de Hakone.\n\n!! Pas plus de deux nuits, et pas le sud : Shimoda et les plages sont hors saison, et la péninsule est la zone la plus exposée aux typhons de tout votre itinéraire japonais. Les deux nuits se prennent sur Tokyo, jamais sur les Alpes ni sur Kyoto."},{"k":"1. Combien de nuits à Tokyo, et quel jour repartir","v":"Le 15 octobre est un JEUDI, pas un samedi — le samedi c'est le 17. Trois options : partir le jeudi 15 comme prévu ; partir le vendredi 16, jour de départ statistiquement le moins cher d'après les données Expedia 2026, environ 8 % sous le dimanche ; ou rester jusqu'au lundi 19 / mardi 20, ce qui vous met en plein sur le Kawagoe Matsuri (fête traditionnelle) des 17 et 18 octobre — patrimoine UNESCO, 29 chars monumentaux, affrontements nocturnes de chars à la lumière des lanternes, à 30 min d'Ikebukuro.\n\n**MON AVIS** : le 19 ou le 20. Ne partez ni le samedi 17 (jour du festival) ni le dimanche 18 (jour le plus cher de la semaine)."},{"k":"3. La voiture du 26 septembre","v":"**Rendre ailleurs qu'à Tokyo ne coûte PAS le double.** Chez Toyota les frais d'aller simple sont forfaitaires par zone : Tokyo → Odawara, c'est environ 2 200 ¥, treize euros. C'est Times qui facture au kilomètre (11 400 ¥ pour le même trajet) — d'où la règle, Toyota en direct.\n\n**Rendre à Tokyo est le mauvais choix** : 80 km à rebours depuis Hakone plus la traversée de la ville, pour reprendre ensuite un Shinkansen vers le sud-ouest. Odawara est déjà sur la ligne : Odawara → Kyoto, 2 h 20 ; Tokyo → Kyoto, 2 h 15.\n\n>> Le vrai problème du samedi 26, c'est le trafic de sortie de Tokyo vers le Fuji, le pire créneau de la semaine. **La parade : prenez le bus Shinjuku → Kawaguchiko (1 h 45, voie réservée) et louez sur place**, Toyota a une agence à la gare de Kawaguchiko. Deux heures de conduite en moins au lendemain du décalage horaire, et une journée de location économisée."},{"k":"2. La voiture 1 : quatre jours, trois jours, ou zéro","v":"Non, la voiture n'est pas indispensable pour Hakone — elle y est un handicap, le Hakone Free Pass couvre tout et le parking d'Owakudani est saturé avant 10 h. Elle est indispensable pour le tour des cinq lacs du Fuji et pour la route Mishima-Turnpike.\n\nDonc : rendez-la à Odawara le soir du J8 et faites Hakone au Free Pass le J9. Et ne la rendez surtout pas à Tokyo — Odawara est déjà sur la ligne du Shinkansen (train à grande vitesse), remonter à Tokyo ajouterait 80 km à rebours pour gagner cinq minutes de train.\n\nVariante pour économiser encore un jour : bus Shinjuku → Kawaguchiko le matin du J6 (1 h 45) et location sur place à la gare de Kawaguchiko."},{"k":"3. Le samedi 10 octobre : festival ou sumo","v":"Le jungyo (tournée régionale de sumo) s'arrête à Matsumoto ce jour-là, 8h30-14h30, avec deux heures d'entraînement public — et vous dormez à Matsumoto le soir. C'est incompatible avec la matinée du deuxième jour du festival de Takayama.\n\nMon avis : le moment irremplaçable du festival est le yomatsuri (défilé nocturne aux lanternes) du vendredi soir ; le samedi n'est que la reprise, plus calme. Si le sumo vous tient, prenez le jungyo et gardez Narai-juku pour l'après-midi."},{"k":"4. La nuit du 07/10 à Takayama","v":"Ryokan à 170-200 € ou business hotel à 70 € ? Coupez le ryokan : vous sortez d'une minshuku gassho-zukuri et vous entrez dans deux nuits de bain chaud à Hirayu.\n\nL'argument inverse, à connaître : le 07 est la dernière nuit à tarif normal dans Takayama même, les 08 et 09 étant hors de prix à cause du festival."},{"k":"5. Le vol vers l'Indonésie","v":"Il reste ouvert et dépend des décisions ci-dessus. Un seul direct vers Bali : Garuda, Narita 11 h, quotidien.\n\nJakarta est bien mieux desservi, et « Jakarta + vol intérieur » est souvent moins cher et plus souple. Aucun jour n'est à proscrire mi-octobre.\n\nMais ce billet est aussi votre preuve de sortie du Japon, exigée à l'embarquement à Roissy : il doit exister avant le 20 septembre, quitte à en prendre un modifiable."}],"sub":"six arbitrages ouverts, et mon avis sur chacun","title":"Les décisions ouvertes","_m":1789344000000},{"icon":"🚗","id":"conduire","key":true,"order":2,"sections":[{"k":"Le permis international français ne sert à RIEN","url":"https://jp.diplomatie.gouv.fr/fr/identite/permis","v":"L'ambassade de France au Japon l'écrit noir sur blanc : le permis international délivré par la France n'est pas reconnu. La France délivre des permis conformes à la Convention de Vienne 1968, que le Japon n'a jamais ratifiée — il ne reconnaît que Genève 1949.\n\nNe dépensez ni un euro ni une minute là-dessus."},{"k":"Où la voiture sert vraiment, et où elle nuit","v":"Elle est indispensable sur deux zones et deux seulement. Le TOUR DES CINQ LACS DU FUJI — Saiko, Motosu, Shoji, la Subaru Line jusqu'à la 5e station, Oshino Hakkai — desservi par des bus rares, lents et saturés.\n\nEt la BOUCLE DES ALPES — Gokayama, Togakushi, et surtout la possibilité de dormir à Hirayu Onsen pendant le festival de Takayama, quand la ville est complète depuis un an. Là, en transports, c'est 5 à 6 h de correspondances pour 3 h de route directe, avec quelques départs par jour.\n\nElle NUIT en revanche à Hakone : le Hakone Free Pass couvre train, funiculaire, téléphérique, bateau et bus, toute la boucle est conçue autour, et le parking d'Owakudani est saturé avant 10 h. Elle nuit aussi à Kyoto (quartiers piétons, stationnement rare et cher) et à Tokyo (absurde).\n\nConséquence pratique : rendez la voiture 1 à Odawara le soir du J8 plutôt que le J9, et faites Hakone au Free Pass."},{"k":"Où rendre la voiture : Odawara, jamais Tokyo","v":"Odawara est SUR la ligne du Tokaido Shinkansen (le train à grande vitesse de la côte pacifique) et au pied de Hakone. Odawara → Kyoto met 2 h 20, Tokyo → Kyoto met 2 h 15 : quinze minutes de différence, contre 80 km de route à rebours et la traversée de Tokyo si vous remontiez rendre le véhicule.\n\nLe frais d'aller simple Tokyo → Kanagawa chez Toyota est de 2 200 ¥, une misère. Et garder la voiture jusqu'à Kyoto n'a aucun sens : 430 km, 6 h de conduite et 55 à 67 € de péage, soit presque le prix du billet de train."},{"k":"Ce qui est légalement valable","v":"Trois documents à porter EN PERMANENCE, ensemble : le permis français original (pas une copie), la traduction officielle en japonais, et le passeport — la police peut le demander pour vérifier votre date d'entrée. La traduction est valable un an à compter de la date d'entrée au Japon."},{"k":"Qui peut émettre la traduction","v":"Seuls les organismes désignés par la Commission nationale de sécurité publique : le JAF, et ALADDIN depuis 2025. L'ambassade de France déclare explicitement ne PAS être habilitée à le faire."},{"k":"Pourquoi le JAF est un piège pour vous","url":"https://translation.jaf.or.jp/","v":"Depuis avril 2025, le JAF a supprimé guichets et courrier : tout est en ligne, et il est impossible de déposer une demande depuis l'étranger. Aucun retrait à Haneda ni Narita, aucune délivrance par PDF (seul le papier a valeur légale, à imprimer en konbini (supérette ouverte 24 h)).\n\n6 000 ¥. Le site anglais annonce 2-3 jours ouvrés, la notice officielle d'avril 2026 annonce 1 à 2 semaines — la contradiction n'est pas levée.\n\nOr vous n'aurez que DEUX jours ouvrés à Tokyo, les 24 et 25 septembre, la Silver Week (pont férié de cinq jours) bloquant les 21, 22 et 23."},{"k":"La solution : ALADDIN","url":"https://aladdin.or.jp/en/","v":"Organisme également agréé, à Shiba, Minato-ku (stations Mita, Shiba-koen, Hamamatsucho). Ouvert du lundi au vendredi de 10 h à 15 h.\n\n5 000 ¥, moins cher que le JAF. Délivrance le lendemain ouvré en principe, et émission d'urgence en UNE HEURE possible selon l'affluence.\n\nGuichet uniquement, mais leur page ouvre explicitement une voie e-mail pour les urgences : écrivez à info@aladdin.or.jp en précisant pour quand et où vous voulez le document. Ils sont fermés du 18 au 23 septembre, réouverture le jeudi 24."},{"k":"La carte ETC — à demander À LA RÉSERVATION","v":"Les cartes de télépéage sont émises par des sociétés de crédit japonaises et réservées aux résidents : un touriste ne peut pas en obtenir une. La seule solution est de la LOUER avec la voiture, ~330 ¥ pour toute la location — et il faut la demander au moment de réserver, pas au comptoir.\n\nLes péages sont cumulés et réglés à la restitution. Pensez à retirer la carte du boîtier à chaque arrêt."},{"k":"L'option NOC — non négociable","v":"La CDW de base est incluse d'office au Japon. Ce qui ne l'est pas, c'est la NOC (Non-Operation Charge) : une pénalité d'immobilisation de 20 000 ¥ (véhicule roulant) à 50 000 ¥ (non roulant) en cas de sinistre, MÊME SANS FAUTE.\n\nPrenez systématiquement l'option Anshin / Safety Plan, ~550-1 100 ¥/jour. Sur les routes de montagne de Hakone, Shirakawa-gō et Norikura, c'est le premier réflexe."},{"k":"Chez qui louer, et pourquoi","url":"https://rent.toyota.co.jp/eng/service/oneway/simulation.aspx","v":"Toyota en direct : leurs frais d'aller simple sont forfaitaires (Tokyo → Kanagawa ≈ 2 200 ¥) alors que Times facture au kilomètre (≈ 11 400 ¥ pour le même trajet). Nissan est souvent moins cher sur le tarif de base.\n\nORIX impose une restitution entre 8 h et 20 h sur les allers simples — contrainte réelle si vous arrivez tard à Nagano. Pour Kanazawa → Nagano, faites tourner le simulateur officiel Toyota : estimation 15 000 à 25 000 ¥, et au-delà de 20 000 ¥, deux locations aller-retour avec jonction en Shinkansen (1 h) reviennent moins cher."},{"k":"Boîte automatique","v":"Non-sujet : au Japon la quasi-totalité du parc de location est automatique par défaut. Les boîtes manuelles sont introuvables sauf demande spéciale."},{"k":"Les routes interdites aux voitures","v":"Kamikochi et Norikura Tatamidaira sont fermés aux véhicules particuliers. Parking-relais à Sawando (~700 ¥/jour) puis navette (~1 300 ¥ A/R, 30 min).\n\nCe n'est pas une option, c'est le seul accès."}],"sub":"le sujet le plus mal compris du dossier","title":"Conduire au Japon","_m":1789344000000},{"icon":"🥋","id":"sumo","key":true,"order":3,"sections":[{"k":"Le problème de vos dates","v":"Vos deux fenêtres tokyoïtes tombent chacune sur une période où l'on ne peut PAS assister à un entraînement en écurie. Du 13 au 27 septembre se tient l'Aki Basho (le tournoi officiel d'automne) : les lutteurs combattent au Kokugikan (l'arène nationale de sumo) et les écuries ferment aux visiteurs.\n\nDu 6 au 25 octobre, c'est le jungyo (la tournée régionale) : sekitori (lutteurs de division supérieure) et une large part des effectifs sont sur les routes du Chubu et du Kansai. La seule vraie fenêtre d'asa-geiko (entraînement du matin) serait entre le 28 septembre et le 5 octobre — précisément quand vous êtes à Kyoto et Kanazawa."},{"k":"⭐ La meilleure réponse : une journée de jungyo","url":"https://www.sumo.or.jp/Jungyo/schedule_2026/","v":"Une journée de tournée régionale, c'est 8h30-14h30 et c'est PLUS complet qu'une journée de tournoi : deux heures d'entraînement public de 9 h à 11 h avec tous les lutteurs à quelques mètres, puis les divisions inférieures, le shokkiri (sumo comique), les chants jinku, une démonstration de coiffure oicho-mage (le chignon en feuille de ginkgo), les combats de makuuchi (la division reine) et le dohyo-iri (l'entrée cérémonielle) des yokozuna (le rang suprême). Gradins de 4 000 à 8 000 ¥, sièges au bord de l'arène de 15 000 à 18 000 ¥."},{"k":"Les étapes qui vous concernent","v":"Sur votre route : MATSUMOTO le samedi 10 octobre (vous y dormez ce soir-là), Imizu le 11, KANAZAWA le lundi 12, Takayama le 14. Depuis Tokyo, quatre étapes en excursion à la journée mais elles tombent du 6 au 9 octobre, quand vous êtes dans les Alpes : Tsukuba, Ebina, Sayama, Chichibu.\n\nConcrètement, la seule qui s'insère sans casser le plan est MATSUMOTO LE 10 — au prix de la matinée du deuxième jour du festival de Takayama. Billets sur e+ ou Lawson Ticket, sites en japonais, ou en konbini (supérette 24 h) sur borne Loppi une fois sur place.\n\nLes ventes ont ouvert en mai-juillet : réservez maintenant."},{"k":"Le billet du jour à 2 500 ¥","url":"https://md.pia.jp/sumo/vacant/va09.jsp","v":"Pendant votre séjour de septembre, le guichet du Kokugikan vend des sièges D à 2 500 ¥ par adulte LE MATIN MÊME, uniquement si la journée n'est pas complète. C'est le seul canal de vente sur place, il n'y a pas de prévente au guichet.\n\nL'état des stocks jour par jour est publié en ligne, mis à jour à 11 h et 17 h. À 2 500 ¥, ça vaut largement une tentative un matin — présentez-vous tôt."},{"k":"Gratuit : Arashio-beya","url":"https://www.arashio.net/tour_e.html","v":"L'écurie Arashio, à Nihonbashi-Hamacho, laisse observer l'entraînement DEPUIS LA RUE, à travers une grande baie vitrée, entre 7h30 et 9 h, sans réservation et sans payer. Leur calendrier est en ligne mais l'écurie précise elle-même qu'il n'est pas garanti — donc on passe, on regarde s'il y a quelqu'un, et on ne téléphone pas.\n\nZéro risque, zéro coût."},{"k":"Les rendez-vous ratés, pour information","v":"Le Zen-Nihon Rikishi Senshuken (le championnat toutes divisions du sanctuaire Meiji) a lieu le lundi 5 octobre au Kokugikan, 3 000 ¥ sans réservation — c'était le meilleur rapport qualité/prix de toute la recherche, mais vous êtes à Kanazawa ce jour-là. Le danpatsu-shiki (cérémonie de retraite) de Hidenoumi est le samedi 3 octobre, avec la coupe du chignon par 300 personnes : vous êtes à Kyoto.\n\nLes grands hana-zumo (tournois d'exhibition caritatifs) annuels tombent tous en février. Et le championnat universitaire national est les 31 octobre et 1er novembre, après votre départ."},{"k":"À défaut : Ryogoku","v":"Le quartier du sumo se visite très bien sans combat. Le musée du sumo, au rez-de-chaussée du Kokugikan, est en ENTRÉE LIBRE du mardi 13 au jeudi 15 octobre, de 10 h à 16h30 (pendant un tournoi, il faut un billet).\n\nLe quartier est plein de restaurants de chanko nabe (le ragoût des lutteurs) tenus par d'anciens rikishi (lutteurs) : Chanko Kirishima, Tomoegata, et Kappo Yoshiba qui a conservé un dohyo (arène) au milieu de sa salle. Et Ryogoku Edo NOREN, dans l'ancienne gare, expose un dohyo grandeur nature en accès libre."}],"sub":"trois portes d'entrée, dont deux gratuites ou presque","title":"Voir du sumo","_m":1789344000000},{"icon":"🛏️","id":"heberg","key":true,"order":4,"sections":[{"k":"Le profil que j'ai retenu","v":"Vous m'avez demandé si j'avais bien saisi votre profil. Voici ce sur quoi je raisonne, dites-moi ce qui est faux.\n\nVous êtes deux, routards, hébergements économiques par défaut — business hotels au Japon, guesthouses en Asie du Sud-Est — avec quelques nuits d'exception assumées et volontairement rares. Rythme dense : 1 à 3 nuits par lieu, 5 à 7 dans une grande ville.\n\nVous voulez un équilibre entre nature et randonnée, snorkeling sans certification de plongée, temples et culture, et food. Vous gérez le budget vous-mêmes et ne voulez pas le saisir dans l'app : je ne construis donc pas mes recommandations autour du prix, mais je signale quand une nuit chère n'apporte rien.\n\nEt vous préférez qu'on vous dise « celle-là ne sert à rien » plutôt qu'on vous liste six options équivalentes."},{"k":"Les six critères, dans l'ordre","v":"1) LA POSITION PAR RAPPORT AU PROGRAMME DU LENDEMAIN — c'est le critère numéro un et celui qu'on oublie. Dormir à Hirayu plutôt qu'à Takayama, dormir en haut à Okunikko plutôt qu'en ville, dormir dans la vallée à Kamikochi : à chaque fois ce n'est pas le confort qui décide, c'est ce que ça permet de faire le lendemain à 6 h du matin.\n\n• LE NOMBRE DE DÉMÉNAGEMENTS — une nuit d'exception qui vous oblige à refaire les sacs au milieu d'un bloc coûte plus qu'elle n'apporte.\n• LA RARETÉ — une minshuku (chambre chez l'habitant) dans une maison classée à Shirakawa-gō n'existe nulle part ailleurs ; un ryokan (auberge traditionnelle) avec bain extérieur, il y en a des milliers.\n• LA NON-REDONDANCE — trois nuits d'exception consécutives s'annulent entre elles.\n• LE RISQUE DE COMPLET — ce qui a vingt lits et tombe un jour de festival passe avant ce qui en a deux cents.\n• LE RAPPORT EXPÉRIENCE/PRIX, en dernier, et seulement pour dire quand une nuit chère ne se justifie pas."},{"k":"Ce que ça donne sur le Japon","v":"À garder sans discuter : la minshuku gassho-zukuri (maison à toit de chaume pentu) de Shirakawa-gō le 06/10, unique au monde et vingt maisons en tout. Les deux nuits de Hirayu les 08 et 09/10, qui ne sont pas un luxe mais votre seule solution d'hébergement pendant le festival.\n\nLe shukubo (nuit dans un temple) de Togakushi le 11/10, seule expérience bouddhique du lot. À couper : le ryokan de Takayama du 07/10, coincé entre la minshuku de la veille et deux nuits de bain chaud le lendemain.\n\nÀ arbitrer : les deux nuits de Kawaguchiko, où la formule sudomari (nuit sans repas) dans le même établissement bat le duo ryokan + business hotel."},{"k":"Le verdict sur les sept adresses reçues","v":"Quatre des sept sont dans la péninsule d'Izu, à 1 h 30 à 3 h de route de votre itinéraire — la personne qui vous les a données a mélangé Hakone et Izu. Aucune des sept n'a de bain extérieur face au Fuji.\n\nIl ne reste donc que trois candidats réels : Tōnosawa Ichinoyu Honkan et Yoshiike pour la nuit de Hakone, et le Fuji Kimien de Yamanakako, le seul avec vue sur la montagne mais dont le bain n'est probablement pas une vraie source thermale et qui se loue sans repas. Si vous voulez vraiment un bain extérieur face au Fuji, il faut chercher ailleurs, côté Kawaguchiko nord ou Fujiyoshida — dites-le-moi et je m'en occupe."}],"sub":"la grille que j'applique, à corriger si elle est fausse","title":"Choisir un hébergement","_m":1789344000000},{"icon":"💊","id":"sante","key":true,"order":5,"sections":[{"k":"Ce qui est encore faisable à J-7","v":"Hépatite A et typhoïde : une injection, efficaces en 15 jours, donc couvertes avant l'Indonésie puisque le Japon est à risque nul. Rage : deux doses à J0 et J7, la seconde se faisant à Tokyo.\n\nEncéphalite japonaise : schéma accéléré J0 + J7, co-administrable avec la rage sans perte d'efficacité. Hépatite B : schéma accéléré J0/J7/J21, la troisième dose à Bangkok.\n\nRappels DTP et ROR au passage."},{"k":"Pourquoi la rage compte vraiment ici","v":"Quatre mois de voyage, Bali où la rage est endémique chez les chiens ET les singes, plus la Thaïlande, le Laos et le Sri Lanka. L'intérêt majeur de la pré-exposition n'est pas d'éviter la maladie mais d'éviter les immunoglobulines après morsure — souvent introuvables sur place.\n\nRéflexe à connaître par cœur : toute morsure, griffure ou léchage de plaie impose un lavage de 15 minutes à l'eau savonneuse puis deux doses de rappel dans un centre antirabique, même vacciné."},{"k":"⚠️ Le Japon et les médicaments","v":"Le pays le plus strict au monde, et c'est votre première escale. Sans formalité : un mois maximum de médicaments sur ordonnance.\n\nLe certificat Yakkan Shoumei (certificat d'importation de médicaments) pour aller au-delà demande 2 à 3 semaines — infaisable. Et surtout : pseudoéphédrine (Actifed, Humex Rhume), codéine et dérivés sont INTERDITS même avec ordonnance.\n\nC'est la molécule qui compte, pas la marque. Saisie en douane et procédure pénale possible.\n\nSi l'un de vous a un traitement au long cours, n'emportez qu'un mois et rachetez en Thaïlande ou à Singapour, où les pharmacies sont excellentes."},{"k":"Paludisme — ce qui vous concerne vraiment","v":"Risque nul au Japon, à Singapour, au Sri Lanka (éradiqué depuis 2016), à Bali et Jakarta. Résiduel en Thaïlande hors zones frontalières forestières.\n\nLe seul pays réellement concerné est le LAOS : transmission toute l'année sauf Vientiane, risque maximal dans le tiers sud. Pas de chimioprophylaxie pour un circuit conventionnel selon l'Institut Pasteur, mais protection anti-moustique impérative."},{"k":"Dengue","v":"Présente dans six de vos sept pays, tout sauf le Japon. Pic en Indonésie de novembre à avril, pile votre passage ; pic post-mousson au Sri Lanka en janvier.\n\nPas de vaccin utilisable dans votre calendrier. Le moustique Aedes pique LE JOUR : répulsif en journée, pas seulement le soir.\n\nEn cas de fièvre : paracétamol uniquement, JAMAIS d'aspirine ni d'ibuprofène, puis consultation."},{"k":"La trousse","v":"Paracétamol, SRO (l'enjeu d'une turista, c'est la déshydratation), azithromycine sur ordonnance (les quinolones sont peu efficaces en Asie du Sud-Est), lopéramide, antinauséeux pour les bateaux et minivans, cétirizine, crème corticoïde, ANTIFONGIQUE (mycose quasi certaine sur quatre mois d'humidité), antiseptique en unidoses, Steri-Strip, répulsif DEET 30-50 %, crème solaire 50+ européenne, collyre, thermomètre, Micropur. Ordonnances en DCI et traduites en anglais, en bagage cabine."},{"k":"Ce qui se trouve sur place, et bien","v":"Paracétamol, ibuprofène, SRO, pansements, antiseptique et antibiotiques (souvent sans ordonnance en Thaïlande, Indonésie et Sri Lanka). Les pharmacies Boots et Fascino à Bangkok, Guardian et Watsons à Singapour et KL sont de qualité occidentale à prix bas — c'est là qu'on se réapprovisionne, pas au Laos où le taux de contrefaçons est élevé."}],"sub":"ce qui se joue cette semaine et ce qui se joue en route","title":"Santé","_m":1789344000000},{"icon":"📶","id":"connect","key":false,"order":6,"sections":[{"k":"L'architecture recommandée","v":"Airalo Asialink, 100 Go / 180 jours, couvre les sept pays — la validité de six mois est ce qui compte, pas le volume, parce qu'elle couvre aussi les transitions de frontière. Mettez une marque DIFFÉRENTE sur le second téléphone (Ubigi ou Saily) : si un opérateur partenaire tombe dans un pays, l'autre téléphone fait hotspot.\n\nC'est la vraie assurance connectivité, et elle coûte le prix d'un second forfait."},{"k":"Le piège Nomad","v":"Attention si vous comparez : le plan APAC 14 pays de Nomad ne couvre ni le Laos ni le Sri Lanka, et le plan 21 pays ne couvre pas Singapour. Aucun de leurs plans ne couvre vos sept destinations."},{"k":"Installer AVANT de partir","v":"Trois raisons bloquantes : télécharger un profil eSIM exige une connexion Internet (à l'atterrissage sans data, c'est le serpent qui se mord la queue) ; un QR code eSIM ne se scanne QU'UNE FOIS et un échec d'installation demande le SAV du fournisseur ; et installer n'est pas activer — laissez la ligne désactivée, le compteur de validité ne démarre qu'à la première connexion réseau."},{"k":"Le déverrouillage opérateur","v":"Obligatoire, gratuit en France après 3 mois d'abonnement, mais avec un délai légal de 10 jours ouvrés. C'est le seul point de tout le dossier qui peut littéralement faire rater le départ.\n\nVérifiez avec *#06# : la présence d'un EID confirme l'eSIM."},{"k":"Ne PAS résilier la ligne française","v":"Les banques envoient les codes 3D Secure par SMS au numéro français. Sans lui, une carte bloquée reste bloquée.\n\nGardez la nano-SIM avec données mobiles et itinérance data désactivées — les SMS entrants restent gratuits — et basculez sur un forfait à 2 €/mois."},{"k":"Où la SIM locale bat le roaming","v":"Trois pays : Indonésie (Telkomsel, couverture bien supérieure hors Bali et Java — attention à la règle IMEI qui impose d'enregistrer un téléphone étranger, ce que l'eSIM roaming évite), Thaïlande (AIS ou True, rentable dès trois semaines), Sri Lanka (Dialog ou Mobitel au comptoir de l'aéroport). Pas au Japon : les SIM voix imposent une adresse japonaise et les comptoirs de Haneda ferment entre 21 h et 22h30."}],"sub":"deux marques différentes, deux téléphones","title":"Connectivité","_m":1789344000000},{"icon":"💳","id":"argent","key":false,"order":7,"sections":[{"k":"La configuration minimale","v":"Une Visa ET une Mastercard par personne, jamais moins. Les distributeurs thaïlandais facturent 250 THB pour une Visa mais 350 THB pour une Mastercard, et certaines machines refusent purement et simplement l'un ou l'autre réseau.\n\nUne carte socle gratuite à l'étranger (BoursoBank Ultim, Fortuneo Fosfo) pour les retraits, une Wise ou Revolut pour les paiements multi-devises, et gardez la Visa Premier ou Gold Mastercard pour sa RC de 2 M€ et les cautions."},{"k":"Refuser la conversion dynamique — partout, toujours","v":"À chaque paiement et chaque retrait, la machine proposera de débiter en euros. Refusez : payez toujours en devise locale.\n\nLe surcoût de la DCC est de 5 à 10 %. Piège de vocabulaire sur les distributeurs thaïlandais : « decline conversion » n'est pas « cancel transaction »."},{"k":"Japon","v":"Le cash reste roi hors des grandes chaînes. Les ATM Mizuho, SMBC et MUFG REFUSENT les cartes étrangères.\n\nSeuls Seven Bank (7-Eleven, 24/7, 21 000 points, interface en français, ~110 ¥ par retrait) et Japan Post fonctionnent. Suica (carte de transport rechargeable) dans Apple Wallet est à installer depuis la France : pas de dépôt, pas de frais, mais les Visa étrangères sont souvent refusées pour la recharge — ayez une Mastercard ou une Amex dans le Wallet.\n\nSur Android hors Japon, l'installation est impossible : carte physique."},{"k":"Le reste du parcours","v":"Thaïlande : 250-350 THB de frais FIXES par retrait, retirez 20-30 000 THB d'un coup. Laos : le cash est roi, la carte quasi inutilisable hors hôtels, prévoyez 80-100 USD par personne en billets neufs et retirez à Luang Prabang avant Muang Ngoi.\n\nIndonésie hors Bali et Jakarta : plafonds bas, faites le plein avant Flores. Sri Lanka hors Colombo : Commercial Bank et Sampath sont les plus fiables.\n\nSingapour est entièrement cashless, le MRT se paie directement par carte sans contact."},{"k":"Le 3-D Secure","v":"Indispensable pour réserver sur eki-net, smartEX et JR West. Une même carte Visa peut passer chez l'un et échouer chez l'autre.\n\nActivez-le auprès de votre banque avant de partir, et assurez-vous de recevoir les SMS de validation à l'étranger. Filet de sécurité : les automates multilingues en gare acceptent les cartes étrangères sans 3DS."}],"sub":"deux réseaux, jamais au même endroit","title":"Argent","_m":1789344000000},{"icon":"🎒","id":"bagage","key":false,"order":8,"sections":[{"k":"La stratégie couche chaude jetable","v":"C'est le vrai problème de ce voyage : nuits à 5-10 °C à Kamikochi et Togakushi, puis trois mois et demi à 30 °C. Partez avec le strict minimum de chaud — doudoune synthétique compressible, coupe-vent imperméable, mérinos manches longues, legging thermique — le tout tient dans 2-3 L compressé.\n\nComplétez à Tokyo chez Uniqlo (Heattech, Ultra Light Down) ou Montbell, moins cher et meilleur qu'en France. Puis renvoyez un colis en France depuis la poste japonaise avant l'Indonésie."},{"k":"Le sac","v":"40-45 L à ouverture panneau, type valise, pas ouverture par le haut. Un 40 L passe en cabine sur la plupart des compagnies asiatiques, ce qui économise la soute payante sur AirAsia, Lion Air et Scoot.\n\nPlus un sac de jour de 15-20 L porté devant dans les transports. Pas de valise à roulettes : trottoirs indonésiens et sri-lankais, bateaux, scooters.\n\nObjectif 8-10 kg."},{"k":"Les trois standards électriques","v":"Japon type A en 100 V. Thaïlande, Indonésie, Laos : A/C/F en 220 V.\n\nSingapour, Malaisie, Sri Lanka : type G britannique en 230 V. Adaptateur universel plus une multiprise légère."},{"k":"Batterie externe","v":"En cabine, et VISIBLE. Depuis 2025, de nombreuses compagnies asiatiques (Korean Air, EVA, Thai, AirAsia, Singapore Airlines) interdisent de l'utiliser, de la charger ou de la ranger dans les coffres pendant le vol."},{"k":"Ce qui ne s'achète PAS sur place","v":"Crème solaire non éclaircissante (presque toutes celles vendues en Asie du Sud-Est contiennent des agents blanchissants — achetez au Japon), déodorant anti-transpirant européen, tampons hygiéniques hors Japon-Singapour-Malaisie (la coupe menstruelle est la vraie solution pour quatre mois), chaussures au-delà du 44, vêtements taille L+, chaussures de randonnée de qualité, lentilles à correction spécifique. Emportez une DEUXIÈME PAIRE DE LUNETTES avec l'ordonnance optique."},{"k":"Ce qu'il ne faut PAS emporter","v":"Lessive (blanchisserie au kilo à 1-2 € partout en Asie du Sud-Est), serviette de bain, shampooing et gel douche, parapluie, masque de snorkeling (correct et bon marché en Thaïlande et en Indonésie), moustiquaire sauf guesthouses rurales."},{"k":"Le détail japonais","v":"On se déchausse partout : ryokan (auberge traditionnelle), temples, château de Himeji, château de Matsumoto. Prévoyez des chaussures qui s'enlèvent sans s'asseoir, et des chaussettes sans trous.\n\nTrois paires de chaussures au maximum."}],"sub":"un mois de montagne japonaise, puis trois mois de tropiques","title":"Bagage","_m":1789344000000},{"icon":"🛡️","id":"securite","key":false,"order":9,"sections":[{"k":"🇯🇵 Japon — vigilance normale","v":"Zone d'exclusion autour de Fukushima-1 uniquement. Point qui vous concerne directement : les attaques d'ours sont en forte hausse, 216 attaques et 13 morts entre avril 2025 et mars 2026, principalement à Hokkaido et dans le nord-ouest de Honshu.\n\nCela vaut pour vos randonnées en montagne : clochette à ours, pas de sortie seul à l'aube ou au crépuscule, et suivez les avis affichés aux départs de sentier. Signalés aussi : des cas de GHB dans les bars de Tokyo."},{"k":"🇮🇩 Indonésie","v":"Alcool frelaté : l'arak au méthanol cause cécité et décès. Ne buvez jamais de spiritueux servis en carafe, en particulier dans les hostels de Bali et des Gili.\n\nRage endémique chez les chiens ET les singes. Papouasie déconseillée (enlèvements documentés).\n\nVérifiez le niveau d'alerte volcanique avant tout trek. Sécurité des centres de plongée très variable."},{"k":"🇹🇭 Thaïlande","v":"Formellement déconseillés : Narathiwat, Pattani, Yala, Songkhla ; toute la frontière birmane sauf Mae Sot ; une bande de 50 km le long de la frontière cambodgienne. Koh Lipe est en province de Satun, déconseillée par voie terrestre : y accéder PAR LA MER depuis Koh Lanta ou Krabi.\n\nLes deux-roues représentent 90 % des morts sur la route. La cigarette électronique est totalement interdite, jusqu'à 10 ans de prison."},{"k":"🇱🇦 Laos","v":"UXO : ne sortez jamais des sentiers sans guide. Les activités de Vang Vieng (tubing, tyrolienne, montgolfière) n'ont aucun contrôle de sécurité, accidents graves réguliers.\n\nEmpoisonnements collectifs mortels au méthanol documentés à Vang Vieng. Vols à l'arraché à moto à Vientiane et Luang Prabang.\n\nCouvre-feu théorique à 23 h."},{"k":"🇱🇰 Sri Lanka","v":"Vigilance renforcée sur tout le pays. Mines et UXO dans le Nord et l'Est : restez sur les axes.\n\nHarcèlement de rue et agressions sexuelles documentés, évitez les déplacements nocturnes isolés. Noyades : la côte sud a de vrais courants d'arrachement à Unawatuna et Mirissa même par mer calme."},{"k":"🇲🇾🇸🇬 Malaisie & Singapour","v":"Nord et est du Sabah formellement déconseillés (hors de votre route). Vols à l'arraché à moto à KL.\n\nPeine de mort pour trafic de drogue dans les deux pays, appliquée."},{"k":"Le réflexe de base","v":"Inscrivez-vous sur Ariane, activez la localisation partagée entre vos deux téléphones et avec un proche en France, chiffrez les téléphones, et laissez à quelqu'un en France l'accès à un dossier contenant tous vos documents."}],"sub":"ce que dit le Quai d'Orsay, pays par pays","title":"Sécurité","_m":1789344000000},{"icon":"📖","id":"lexique","key":false,"order":10,"sections":[{"k":"Dormir","v":"**RYOKAN**, auberge traditionnelle avec tatami (natte de paille tressée) et futon.\n\n**MINSHUKU**, l'équivalent familial et modeste, souvent chez l'habitant.\n\n**SHUKUBO**, une nuit dans un temple, avec office du matin.\n\n**BUSINESS HOTEL**, la chambre fonctionnelle et compacte des chaînes japonaises, le meilleur rapport qualité/prix du pays.\n\n**SUDOMARI**, la formule sans repas — souvent moitié moins chère et très sous-utilisée par les étrangers."},{"k":"Se baigner","v":"ONSEN, source chaude d'origine volcanique, légalement définie par sa composition minérale. SENTO, bain public de quartier en eau chauffée, pas thermale.\n\n**ROTENBURO**, le bain en plein air.\n\n**KASHIKIRI**, un bain qu'on privatise pour trente ou quarante minutes.\n\n**ASHIYU**, le bain de pieds, souvent gratuit dans les villages thermaux. On se lave ENTIÈREMENT avant d'entrer dans le bain ; la serviette ne touche jamais l'eau."},{"k":"Manger","v":"**KAISEKI**, le dîner gastronomique en série de petits plats, servi dans les ryokan.\n\n**IZAKAYA**, le bistrot où l'on picore en buvant.\n\n**YOKOCHO**, une ruelle de minuscules bars à six places.\n\n**KONBINI**, la supérette ouverte 24 h — au Japon on y mange étonnamment bien. YATAI, selon le contexte : l'échoppe de rue, ou le char de festival.\n\n**CHANKO NABE**, le ragoût des lutteurs de sumo."},{"k":"Se déplacer","v":"**SHINKANSEN**, le train à grande vitesse. Trois vitesses sur une même ligne : NOZOMI et KAGAYAKI sont les plus rapides, HIKARI et HAKUTAKA s'arrêtent un peu plus, KODAMA partout.\n\nAttention : le Kagayaki est à 100 % places réservées, sans voiture libre.\n\n**LTD EXP**, le train express classique, plus lent et moins cher. IC CARD (Suica, Pasmo, ICOCA), la carte sans contact qui paie métro, bus, casiers et konbini partout dans le pays.\n\nETC, le badge de télépéage — à louer avec la voiture."},{"k":"Culture","v":"**MATSURI**, la fête traditionnelle d'un quartier ou d'une ville.\n\n**YOMATSURI**, sa version nocturne. YATAI ou DASHI, les chars qu'on y tire.\n\n**KARAKURI**, les marionnettes mécaniques du XVIIIe siècle. TORII, le portique rouge qui marque l'entrée d'un sanctuaire shinto.\n\n-JINJA ou -GU, un sanctuaire shinto ; -JI, -DERA ou -IN, un temple bouddhiste. KOYO, les couleurs d'automne, qu'on va « chasser » comme les cerisiers au printemps."},{"k":"Sumo","v":"BASHO, un des six tournois officiels de l'année.\n\n**JUNGYO**, la tournée régionale entre deux tournois.\n\n**HANA-ZUMO**, un tournoi d'exhibition hors classement. DOHYO, l'arène de terre battue.\n\n**DOHYO-IRI**, l'entrée cérémonielle.\n\n**RIKISHI**, un lutteur ; SEKITORI, un lutteur des deux divisions supérieures ; YOKOZUNA, le rang suprême. HEYA, l'écurie où ils vivent et s'entraînent.\n\n**ASA-GEIKO**, l'entraînement du matin.\n\n**DANPATSU-SHIKI**, la cérémonie où l'on coupe le chignon d'un lutteur qui prend sa retraite."}],"sub":"les mots qu'on va croiser tous les jours","title":"Lexique","_m":1789344000000}],"stays":[{"bloc":"jpA","country":"jp","id":"s01","kind":"appartement entier","name":"Airbnb — le vôtre, à caler sur les dates","note":"Le lien que vous m'avez envoyé. Je n'ai pas pu ouvrir la page (Airbnb bloque la lecture automatique), donc je ne peux ni vérifier le quartier, ni la capacité, ni les dates disponibles.\n\nDeux choses à contrôler vous-mêmes avant de valider : le QUARTIER — avec un atterrissage à Haneda en fin d'après-midi et cinq nuits de décalage horaire, Asakusa, Kuramae, Ueno ou Nihonbashi sont les bons choix, Shinjuku et Shibuya vous feraient perdre une correspondance de métro chaque soir ; et la SILVER WEEK, du 19 au 23 septembre, qui sature tout et fait grimper les tarifs. Si le logement est bien placé et disponible sur les cinq nuits, c'est le plus simple : un seul lieu, pas de déménagement, une cuisine pour les petits-déjeuners à 5 h du matin quand le décalage vous réveille.","order":0,"place":"Tokyo","status":"short","url":"https://www.airbnb.com/properties/1715243366420197541","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s02","kind":"chambre en ryokan · Airbnb","name":"Fuji Kimien 樹美縁 (chambre 208)","note":">> ★ LE SEUL DES SEPT AVEC VUE SUR LE FUJI. Au lac Yamanaka, pas Kawaguchiko : 25-30 min de route du lac Kawaguchiko, 1 h 30 à 1 h 45 d'Odawara.\n\nC'est une CHAMBRE, pas un logement entier, avec salle de bain privative, 2 lits, tatami, parking gratuit. 4,79/5 sur 70 avis.\n\nL'établissement annonce un grand bain commun et un bain extérieur avec vue Fuji, et affirme que toutes les chambres voient la montagne.\n\n!! ⚠️ DEUX RÉSERVES : l'eau est décrite comme « eau souterraine profonde du piémont du Fuji », ce qui n'est probablement PAS une source thermale au sens légal — à faire confirmer par l'hôte, parce que c'est toute la différence entre un onsen et une grande baignoire ; et l'annonce Airbnb est vendue sans repas, donc pas de kaiseki. Verdict : c'est la seule adresse de la liste qui répond à l'envie « se réveiller face au Fuji », mais ce n'est pas une nuit d'exception au sens ryokan du terme.","order":10,"place":"Yamanakako","status":"short","url":"https://www.airbnb.com/rooms/1309741732264221024","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s03","kind":"ryokan historique (1630)","name":"Tōnosawa Ichinoyu Honkan 塔ノ沢 一の湯","note":">> ★ LE MEILLEUR CHOIX POUR LA NUIT DE HAKONE. Fondé en 1630, bâtiment en bois de quatre étages classé bien culturel enregistré, dans la gorge de la Hayakawa, un arrêt après Hakone-Yumoto — donc 15-20 min d'Odawara et parfaitement desservi sans voiture, ce qui colle exactement au plan « rendre la voiture le soir du J8 ».\n\nUne partie des chambres a un bain extérieur privatif donnant sur la rivière, et il y a un bain privatisable. Chaîne Ichinoyu, positionnement économique : c'est du cachet réel à prix raisonnable.\n\n**LES AVIS** : on loue le rapport qualité/prix, le bruit de la rivière depuis le bain, le service. On reproche un bâtiment vieillissant, des chambres datées, des odeurs d'humidité, une douche à faible pression, des plafonds très bas et un check-in rigide à 15 h.\n\n!! ⚠️ Bains communs interdits aux personnes tatouées. Aucune vue Fuji — c'est un fond de gorge boisée.","order":20,"place":"Hakone · Tonosawa","status":"short","url":"https://www.ichinoyu.co.jp/","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s04","kind":"grand ryokan-hôtel, 65 chambres","name":"Yoshiike Ryokan 吉池旅館","note":"L'autre adresse exploitable pour la nuit de Hakone. À 5 min à pied de la gare de Hakone-Yumoto, donc idéale sans voiture.\n\nAncienne villa avec un jardin japonais historique — cascades, bassins à carpes, allées — qui est le point fort unanime des avis. Bains intérieurs et bains extérieurs donnant sur le jardin.\n\n**CE QU'ON LUI REPROCHE** : une ambiance d'hôtel plutôt que de ryokan intimiste (65 chambres, ça se sent), une cuisine très axée poisson et coquillages qui bloque si on n'aime pas, et peu d'anglais. Nettement plus cher qu'Ichinoyu.\n\nPas de vue Fuji. À retenir seulement si le jardin vous parle plus que le cachet du vieux bois.","order":30,"place":"Hakone-Yumoto","status":"idee","url":"https://www.yoshiike-group.co.jp/","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s05","kind":"ryokan patrimonial classé","name":"Arai Ryokan 新井旅館","note":"!! ⚠️ HORS ITINÉRAIRE. À Shuzenji, dans la péninsule d'Izu : 1 h 15 à 1 h 30 d'Odawara mais 2 h 30 du lac Kawaguchiko.\n\nMagnifique — quinze bâtiments classés biens culturels nationaux, bain extérieur et bain privatisable en eau de source pure non diluée, 4,3/5 sur 439 avis — mais il faudrait refaire tout le bloc autour. Et très haut de gamme.\n\nÀ garder pour un autre voyage, ou si vous décidez d'ajouter Izu au programme, ce que je ne recommande pas : vous avez déjà coupé Izu pour de bonnes raisons.","order":40,"place":"Shuzenji, Izu","status":"idee","url":"https://www.arairyokan.net/","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s06","kind":"8 villas de luxe","name":"Musouan Biwa 無雙庵 枇杷","note":"!! ⚠️ HORS ITINÉRAIRE, et le plus loin de tous : 2 h 15 à 2 h 30 d'Odawara, environ 3 h de Kawaguchiko, sur la côte ouest d'Izu. C'est objectivement le plus beau produit onsen des sept — huit villas indépendantes, chacune avec son bain extérieur privatif en eau courante accessible 24 h/24, 4,7/5 sur 706 avis, la meilleure note du lot.\n\nMais la vue est sur la baie de Suruga, pas sur le Fuji, et le prix est celui d'un établissement de grand luxe. Incompatible avec votre bloc.","order":50,"place":"Toi, Izu ouest","status":"idee","url":"https://www.izu-biwa.jp/","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s07","kind":"ryokan-resort, 400 ans","name":"Tofuya Resort & Spa Izu 東府や","note":"!! ⚠️ HORS ITINÉRAIRE. Près de Shuzenji, 1 h 20 à 1 h 30 d'Odawara, 2 h 30 de Kawaguchiko.\n\nTrès vaste domaine au bord d'une rivière, deux bains extérieurs publics en rotation, deux bains privatisables, une boulangerie-café avec bain de pieds. Les avis louent les jardins, la cuisine de saison et le service ; ils reprochent le peu d'anglais, des repas servis en salle et non en chambre, et une température irrégulière du bain privatif par temps froid.\n\nBelle adresse, mauvais endroit pour ce voyage.","order":60,"place":"Yoshina, Izu","status":"idee","url":"https://www.tfyjapan.com/","_m":1789344000000},{"bloc":"jpB","country":"jp","id":"s08","kind":"micro-ryokan, 7 chambres","name":"Izu no Hana 伊豆の花","note":"!! ⚠️ HORS ITINÉRAIRE. Izu-Kōgen, 1 h 10 d'Odawara mais 3 h de Kawaguchiko.\n\nOuvert en 2023, sept chambres seulement, un bain extérieur privatif avec vue mer dans CHAQUE chambre, cuisine de la mer servie en salon privé. Séduisant, mais : la vue est sur la baie de Sagami et l'île d'Izu-Ōshima, pas sur le Fuji ; il n'y a que 18 avis, échantillon trop faible pour juger ; couvre-feu à 22 h ; annulation payante dès J-8.\n\nEt surtout, ce n'est pas sur votre route.","order":70,"place":"Futo, Itō (Izu est)","status":"idee","url":"https://izunohana.jp/","_m":1789344000000}],"inbox":[{"country":"jp","created":"2026-09-14","done":true,"order":-1789344182826,"text":"Hôtels de ta soeur pr région Hokane","url":"https://maps.app.goo.gl/ukm7e7kiW7rQ2n7b7","id":"mu0hbrqihxzxg","_m":1789344000000},{"country":"jp","created":"2026-09-14","done":true,"order":-1789344172926,"text":"Hôtels de ta soeur pr région Hokane","url":"https://maps.app.goo.gl/JKBbFxyZHDTd2hPi6","id":"mu0hbk3iovd0p","_m":1789344000000},{"country":"jp","created":"2026-09-14","done":true,"order":-1789344162909,"text":"Hôtels de ta soeur pr région Hokane","url":"https://maps.app.goo.gl/7F1yAqruLWRXeS9MA","id":"mu0hbcd91ii0z","_m":1789344000000},{"country":"jp","created":"2026-09-14","done":true,"order":-1789344151260,"text":"Hôtels de ta soeur pr région Hokane","url":"https://maps.app.goo.gl/iGxgUVvVxMV5CBwR8?g_st=ac","id":"mu0hb3dnsds4f","_m":1789344000000},{"country":"jp","created":"2026-09-14","done":true,"order":-1789344133393,"text":"Hôtels de ta soeur pr région Hokane","url":"https://maps.app.goo.gl/7w55aQCdAz43Kw4g9","id":"mu0hapld3mnbp","_m":1789344000000},{"country":"jp","created":"2026-09-14","done":true,"order":-1789344118643,"text":"Hôtels de ta soeur pr région Hokane","url":"https://maps.app.goo.gl/VXoJs6rYBgC7j46t9","id":"mu0hae7npzgx4","_m":1789344000000},{"country":"jp","created":"2026-09-14","done":true,"order":-1789344103960,"text":"Hôtels de ta soeur pr région Hokane","url":"https://www.airbnb.com/rooms/1309741732264221024?unique_share_id=f91008a0-d286-40fc-9863-1e73b3733f88&viralityEntryPoint=1&s=76","id":"mu0ha2vsfy6ey","_m":1789344000000}]},"tomb":[]};

function el(h){var t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
function d(x){if(!x)return"";var p=String(x).split("-");if(p.length<3)return x;return (+p[2])+" "+MONTHS[(+p[1])-1];}
function dy(x){if(!x)return"";var p=String(x).split("-");if(p.length<3)return x;return (+p[2])+" "+MONTHS[(+p[1])-1]+" "+p[0];}
function dw(x){if(!x)return"";var t=new Date(x+"T12:00:00Z");return WD[t.getUTCDay()]+" "+d(x);}
function today(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");}
function dbet(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function by(f){return function(a,b){return (a[f]||0)-(b[f]||0);};}
function chipFor(st){var s=STATUS[st]||STATUS.idee;return '<span class="chip '+s.c+'">'+esc(s.l)+"</span>";}

/* ============ texte riche ============ */
function inline(t){
  t=esc(t);
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/__([^_]+)__/g,"<em>$1</em>");
  t=t.replace(/(https?:\/\/[^\s)<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return t;
}
function rich(txt){
  if(!txt) return el('<div class="rt"></div>');
  var box=el('<div class="rt"></div>');
  String(txt).split(/\n{2,}/).forEach(function(par){
    par=par.trim(); if(!par) return;
    var lines=par.split("\n").map(function(l){return l.trim();});
    if(lines.every(function(l){return /^[•\-–]\s/.test(l);})){
      var ul=el("<ul></ul>");
      lines.forEach(function(l){ul.appendChild(el("<li>"+inline(l.replace(/^[•\-–]\s*/,""))+"</li>"));});
      box.appendChild(ul); return;
    }
    if(/^!!/.test(par)){ box.appendChild(el('<div class="cal">'+inline(par.replace(/^!!\s*/,""))+"</div>")); return; }
    if(/^>>/.test(par)){ box.appendChild(el('<div class="key">'+inline(par.replace(/^>>\s*/,""))+"</div>")); return; }
    box.appendChild(el("<p>"+inline(par.replace(/\n/g," "))+"</p>"));
  });
  return box;
}
function plain(txt,n){
  var s=String(txt||"").replace(/\*\*/g,"").replace(/^[!>]{2}\s*/gm,"").replace(/\n+/g," ").trim();
  return n&&s.length>n ? s.slice(0,n).replace(/\s\S*$/,"")+"…" : s;
}

var COLS=["countries","bookings","guide","stays","inbox"];
var GH={owner:"Clemarch",repo:"asian-roadtrip-data",branch:"main",path:"data/trip.json",
  patches:"data/patches",digest:"data/voyage.md",token:""};

function ghSave(){try{localStorage.setItem("ar-gh",JSON.stringify(
  {owner:GH.owner,repo:GH.repo,branch:GH.branch,path:GH.path,token:GH.token}));}catch(e){}}
function readLink(str){
  var h=String(str==null?(location.hash||""):str).trim();
  if(!h)return false;
  var m=h.match(/#(.+)$/); if(m)h=m[1];
  h=h.replace(/^#/,"").trim();
  if(!h)return false;
  if(/^(ghp_|github_pat_)/.test(h)&&h.indexOf("=")<0){GH.token=h;ghSave();return true;}
  var p={},ok=false;
  h.split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  if(p.t){GH.token=p.t;ok=true;}
  if(p.o)GH.owner=p.o; if(p.r)GH.repo=p.r; if(p.b)GH.branch=p.b;
  if(ok)ghSave();
  return ok;
}
function loadCfg(){
  try{var c=JSON.parse(localStorage.getItem("ar-gh")||"null");if(c&&c.token)GH=Object.assign(GH,c);}catch(e){}
  if(readLink()){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
  try{ST.me=localStorage.getItem("ar-me")||"";}catch(e){}
}
function b64e(str){var b=new TextEncoder().encode(str),o="",C=0x8000,i;
  for(i=0;i<b.length;i+=C){o+=String.fromCharCode.apply(null,b.subarray(i,i+C));}
  return btoa(o);}
function b64d(t){var z=atob(String(t).replace(/\s/g,"")),a=new Uint8Array(z.length),i;
  for(i=0;i<z.length;i++)a[i]=z.charCodeAt(i);
  return new TextDecoder().decode(a);}
function api(path,opt){
  opt=opt||{};
  var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(GH.token)h.Authorization="Bearer "+GH.token;
  if(opt.body)h["Content-Type"]="application/json";
  return fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+path,
    {method:opt.method||"GET",headers:h,body:opt.body||undefined,cache:"no-store"});
}
function snapshot(){
  var o={};COLS.forEach(function(c){o[c]=S[c];});
  return {v:1,updated:new Date().toISOString(),by:ST.me||"",data:o,tomb:S.tomb||[]};
}
/* Fusion document par document : le plus recemment modifie gagne. Une suppression
   laisse une pierre tombale, sinon l'autre telephone la ferait revenir. */
function mergeTrip(t,keepLocal){
  var d=(t&&t.data)||{}, rt=(t&&t.tomb)||[], tomb={}, k;
  (keepLocal?(S.tomb||[]).concat(rt):rt).forEach(function(x){
    if(!x||!x.c||!x.i)return;
    var key=x.c+"|"+x.i; if(!tomb[key]||tomb[key]<x.m)tomb[key]=x.m;});
  COLS.forEach(function(c){
    var map={},out=[],i;
    (d[c]||[]).forEach(function(x){if(x&&x.id)map[x.id]=x;});
    if(keepLocal)S[c].forEach(function(l){var r=map[l.id];if(!r||(l._m||0)>(r._m||0))map[l.id]=l;});
    for(i in map){var td=tomb[c+"|"+i];if(td&&td>=(map[i]._m||0))continue;out.push(map[i]);}
    S[c]=out.sort(by("order"));
  });
  S.tomb=[];var cut=Date.now()-90*864e5;
  for(k in tomb){if(tomb[k]>cut){var q=k.split("|");S.tomb.push({c:q[0],i:q.slice(1).join("|"),m:tomb[k]});}}
}
function touch(o){o._m=Date.now();if(ST.me)o._b=ST.me;return o;}
function saveDoc(col,o){
  touch(o);
  var a=S[col],f=false,i;
  for(i=0;i<a.length;i++){if(a[i].id===o.id){a[i]=o;f=true;break;}}
  if(!f)a.push(o);
  a.sort(by("order"));
  schedulePush();
  return Promise.resolve();
}
function delDoc(col,id){
  S[col]=S[col].filter(function(x){return x.id!==id;});
  S.tomb=(S.tomb||[]).concat([{c:col,i:id,m:Date.now()}]);
  schedulePush();
  return Promise.resolve();
}
function cacheSave(){try{localStorage.setItem("ar-cache",JSON.stringify({sha:ST.sha,t:snapshot()}));}catch(e){}}
function cacheLoad(){try{var c=JSON.parse(localStorage.getItem("ar-cache")||"null");
  if(c&&c.t){ST.sha=c.sha||null;mergeTrip(c.t,false);return true;}}catch(e){}return false;}
function setState(k,msg){ST.state=k;ST.err=msg||"";syncUI();}
function schedulePush(){
  cacheSave();
  if(!GH.token){setState("local");return;}
  setState("dirty");
  clearTimeout(ST.timer);ST.timer=setTimeout(push,1200);
}
function push(after){
  if(after)ST.after=(ST.after||[]).concat([after]);
  if(!GH.token){setState("local");return;}
  if(ST.pushing){ST.again=true;return;}
  ST.pushing=true;setState("push");
  var msg="maj "+new Date().toISOString().slice(0,16).replace("T"," ")+(ST.me?(" - "+ST.me):"");
  var body={message:msg,content:b64e(JSON.stringify(snapshot())),branch:GH.branch};
  if(ST.sha)body.sha=ST.sha;
  function retry(){clearTimeout(ST.timer);ST.timer=setTimeout(push,15000);}
  function rebase(){
    return api("/contents/"+GH.path+"?ref="+encodeURIComponent(GH.branch)).then(function(r){
      if(!r.ok)throw 0;return r.json();
    }).then(function(j){
      ST.sha=j.sha;
      try{mergeTrip(JSON.parse(b64d(j.content)),true);}catch(e){}
      render();
      clearTimeout(ST.timer);ST.timer=setTimeout(push,500);
    }).catch(function(){setState("offline");retry();});
  }
  api("/contents/"+GH.path,{method:"PUT",body:JSON.stringify(body)}).then(function(r){
    if(r.status===409||r.status===422){ST.pushing=false;return rebase();}
    if(r.status===401||r.status===403){ST.pushing=false;
      setState("auth","GitHub refuse le jeton : expire, revoque, ou sans droit d'ecriture sur le depot.");return;}
    if(!r.ok){ST.pushing=false;setState("offline");retry();return;}
    return r.json().then(function(j){
      ST.pushing=false;ST.sha=(j.content&&j.content.sha)||ST.sha;ST.last=Date.now();
      cacheSave();
      var cbs=ST.after||[];ST.after=[];
      cbs.forEach(function(fn){try{fn();}catch(e){}});
      if(ST.again){ST.again=false;push();}else {setState("ok");writeDigest();}
    });
  }).catch(function(){ST.pushing=false;setState("offline");retry();});
}
function pull(force){
  if(!GH.token)return Promise.resolve();
  if(ST.pushing||ST.state==="dirty"||ST.state==="push")return Promise.resolve();
  return api("/contents/"+GH.path+"?ref="+encodeURIComponent(GH.branch)).then(function(r){
    if(r.status===404)return seedRepo();
    if(r.status===401||r.status===403){
      setState("auth","GitHub refuse le jeton : expire, revoque, ou sans droit sur le depot.");return;}
    if(!r.ok){setState("offline");return;}
    return r.json().then(function(j){
      if(j.sha===ST.sha&&!force){ST.last=Date.now();setState("ok");ensureDigest();readMailbox();return;}
      ST.sha=j.sha;
      mergeTrip(JSON.parse(b64d(j.content)),false);
      cacheSave();ST.last=Date.now();S.ready=true;setState("ok");render();
      ensureDigest();readMailbox();
    });
  }).catch(function(){setState("offline");});
}
function seedRepo(){
  var body={message:"init du voyage",content:b64e(JSON.stringify(snapshot())),branch:GH.branch};
  return api("/contents/"+GH.path,{method:"PUT",body:JSON.stringify(body)}).then(function(r){
    if(r.status===401||r.status===403){setState("auth","GitHub refuse le jeton.");return;}
    if(!r.ok){setState("offline");return;}
    return r.json().then(function(j){
      ST.sha=j.content&&j.content.sha;ST.last=Date.now();cacheSave();setState("ok");
      writeDigest();
      toast("Voyage publi\u00e9 dans le carnet partag\u00e9.");});
  }).catch(function(){setState("offline");});
}
/* ---- boite aux lettres : fichiers deposes dans data/patches par une IA ----
   Claude (ou ChatGPT) relie au depot GitHub ecrit un petit fichier JSON la-dedans ;
   l'app le ramasse, l'applique au voyage, puis le supprime. ---- */
var MAILBUSY=false;
function readMailbox(){
  if(MAILBUSY||!GH.token)return;
  MAILBUSY=true;
  api("/contents/"+GH.patches+"?ref="+encodeURIComponent(GH.branch)).then(function(r){
    if(!r.ok){MAILBUSY=false;return null;}
    return r.json();
  }).then(function(list){
    if(!list||!list.length){MAILBUSY=false;return;}
    var files=list.filter(function(f){return f.type==="file"&&/\.json$/i.test(f.name);})
                  .sort(function(a,b){return a.name<b.name?-1:1;}).slice(0,10);
    if(!files.length){MAILBUSY=false;return;}
    var applied=0,seen=0,done=[];
    function finish(){
      MAILBUSY=false;
      if(!applied){
        if(seen)toast("Message re\u00e7u mais illisible \u2014 voir Synchronisation.");
        return;
      }
      render();
      /* on ne supprime les messages qu'une fois le voyage renvoye au depot,
         sinon une fermeture de l'app entre les deux perdrait la modification */
      clearTimeout(ST.timer);
      push(function(){
        done.forEach(function(f){
          api("/contents/"+encodeURIComponent(f.path),{method:"DELETE",body:JSON.stringify(
            {message:"patch appliqu\u00e9 : "+f.name,sha:f.sha,branch:GH.branch})}).catch(function(){});
        });
      });
      toast(applied+(applied>1?" mises \u00e0 jour re\u00e7ues.":" mise \u00e0 jour re\u00e7ue."));
    }
    function next(i){
      if(i>=files.length){finish();return;}
      var f=files[i];
      fetch(f.download_url?f.download_url:("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+
        "/contents/"+encodeURIComponent(f.path)+"?ref="+encodeURIComponent(GH.branch)),
        {headers:GH.token?{Authorization:"Bearer "+GH.token,Accept:"application/vnd.github.raw"}:{},cache:"no-store"})
      .then(function(r){return r.text();})
      .then(function(txt){
        seen++;
        var res=applyPatch(txt);
        if(res&&res.err)ST.mailerr="Fichier "+f.name+" : "+res.err;
        else {applied+=(res&&res.n)||0;done.push(f);}
      }).catch(function(){}).then(function(){next(i+1);});
    }
    next(0);
  }).catch(function(){MAILBUSY=false;});
}
/* ---- miroir lisible du voyage, pour que n'importe quelle IA puisse le lire ---- */
var DIGSHA=null,DIGLAST="",DIGCHECKED=false;
function ensureDigest(){
  if(DIGCHECKED||!GH.token)return;
  DIGCHECKED=true;
  api("/contents/"+GH.digest+"?ref="+encodeURIComponent(GH.branch)).then(function(r){
    if(r.status===404){writeDigest();return;}
    if(!r.ok)return;
    return r.json().then(function(j){DIGSHA=j.sha;});
  }).catch(function(){});
}
function writeDigest(){
  if(!GH.token)return;
  var md=makeDigest();
  if(md===DIGLAST)return;
  function put(sha){
    var b={message:"miroir du voyage",content:b64e(md),branch:GH.branch};
    if(sha)b.sha=sha;
    return api("/contents/"+GH.digest,{method:"PUT",body:JSON.stringify(b)}).then(function(r){
      if(r.status===409||r.status===422){
        return api("/contents/"+GH.digest+"?ref="+encodeURIComponent(GH.branch))
          .then(function(x){return x.ok?x.json():null;})
          .then(function(j){return j?put(j.sha):null;});
      }
      if(!r.ok)return null;
      return r.json().then(function(j){DIGSHA=j.content&&j.content.sha;DIGLAST=md;});
    });
  }
  put(DIGSHA).catch(function(){});
}
function makeDigest(){

    "",

    "",
    "L'app ramasse ton fichier à la prochaine ouverture, l'applique, le supprime, et propage la",

    "",
    "Rédaction : **gras** sur les mots-clés, puces « • », `!!` en début de paragraphe pour un",
    "avertissement, `>>` pour un point clé, deux ou trois mots entre parenthèses après chaque",
    "terme japonais ou local, et jamais de prix.",
    "",
    "---",
    ""];
  out.push("## Vue d'ensemble","");
  S.countries.slice().sort(by("order")).forEach(function(c){
    out.push("- **"+c.name+"** — "+dy(c.d1)+" → "+dy(c.d2)+", "+(c.nights||0)+" nuits, "+
      ((c.blocs||[]).length)+" étapes");

  S.bookings.slice().sort(by("order")).forEach(function(b){
    out.push("- ["+(b.done?"x":" ")+"] `"+b.id+"` "+b.title+
      (b.due?(" — échéance "+dy(b.due)):"")+(b.crit?" — CRITIQUE":"")+
      (b.detail?("  \n      "+plain(b.detail,300)):""));
  });

  S.countries.slice().sort(by("order")).forEach(function(c){
    out.push("## "+c.name+" — "+dy(c.d1)+" → "+dy(c.d2)+" ("+(c.nights||0)+" nuits)");
    if(c.tagline)out.push("",plain(c.tagline));
    (c.blocs||[]).slice().sort(by("order")).forEach(function(b){
      out.push("","### ["+(b.code||"")+"] "+b.title+"  ·  id `"+b.id+"`");
      out.push("- "+dy(b.d1)+" → "+dy(b.d2)+", "+(b.nights||0)+" nuits, base "+(b.base||"?")+
        ", y aller en "+(b.transport||"?")+(b.via?(" ("+plain(b.via)+")"):"")+
        ", statut "+((STATUS[b.status]||STATUS.idee).l));
      if(b.why)out.push("- Pourquoi : "+plain(b.why));
      if(b.sleep)out.push("- Dormir : "+plain(b.sleep));
      if(b.alert)out.push("- Vigilance : "+plain(b.alert));
      (b.days||[]).forEach(function(x){
        out.push("  - "+(x.n||"")+" "+(x.date?dw(x.date)+" ":"")+(x.title||"")+
          ((x.program||[]).length?" — "+x.program.map(function(z){return plain(z);}).join(" ; "):""));
      });

  out.push("","## Candidats hébergement","");
  S.stays.slice().sort(by("order")).forEach(function(x){
    out.push("- `"+x.id+"` "+(x.name||"")+(x.place?(" — "+x.place):"")+

/* ---- mise a jour preparee par Claude ou ChatGPT ---- */
function applyPatch(txt){
  var raw=String(txt||"").trim();
  raw=raw.replace(/^```[a-zA-Z]*\s*/,"").replace(/```\s*$/,"").trim();
  var j=null;
  try{j=JSON.parse(raw);}catch(e){
    var a=raw.indexOf("{"),b=raw.lastIndexOf("}");
    if(a<0||b<a)return {err:"Ce n'est pas du JSON."};
    try{j=JSON.parse(raw.slice(a,b+1));}catch(e2){return {err:"JSON illisible : "+e2.message};}
  }
  var list=Array.isArray(j)?j:(j&&j.patch);
  if(!Array.isArray(list))return {err:"Il manque la liste « patch »."};
  var n=0,skipped=[];
  list.forEach(function(op){
    if(!op||!op.col||!op.id||COLS.indexOf(op.col)<0){skipped.push(String(op&&op.col)+"/"+String(op&&op.id));return;}
    if(op.del){delDoc(op.col,op.id);n++;return;}
    if(!op.set||typeof op.set!=="object"){skipped.push(op.col+"/"+op.id);return;}
    var cur=S[op.col].filter(function(x){return x.id===op.id;})[0];
    var o=cur?Object.assign({},cur):{id:op.id};
    Object.keys(op.set).forEach(function(k){o[k]=op.set[k];});
    o.id=op.id;
    saveDoc(op.col,o);n++;
  });
  return {n:n,skipped:skipped};
}
function toast(m){var t=el('<div style="position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:70;'+
  'background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-size:13px;max-width:88vw;'+

/* ============ cartes ============ */
function drawMap(m,activeId,cap){
  if(!m) return null;
  var uidc="mc"+Math.random().toString(36).slice(2,7);
  var o=['<svg viewBox="0 0 '+m.w+' '+m.h+'" role="img" aria-label="Carte de l\'itinéraire">'];
  o.push('<defs><clipPath id="'+uidc+'"><rect x="'+m.pad+'" y="'+m.pad+'" width="'+m.iw+'" height="'+m.ih+'" rx="8"/></clipPath></defs>');
  o.push('<g clip-path="url(#'+uidc+')">');
  o.push('<rect x="'+m.pad+'" y="'+m.pad+'" width="'+m.iw+'" height="'+m.ih+'" fill="var(--sea)"/>');
  (m.land||[]).forEach(function(p){
    o.push('<path d="'+p+'" fill="var(--land)" stroke="var(--line)" stroke-width="0.5"/>');});
  (m.grat||[]).forEach(function(g){
    if(g.o==="v") o.push('<line x1="'+g.p+'" y1="'+m.pad+'" x2="'+g.p+'" y2="'+(m.pad+m.ih)+'" stroke="var(--line)" stroke-width=".5" opacity=".5"/>');
    else o.push('<line x1="'+m.pad+'" y1="'+g.p+'" x2="'+(m.pad+m.iw)+'" y2="'+g.p+'" stroke="var(--line)" stroke-width=".5" opacity=".5"/>');});
  var pts=m.pts||[];
  for(var i=1;i<pts.length;i++){
    var a=pts[i-1],b=pts[i];
    o.push('<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="var(--c)" stroke-width="2.4" '+
      'stroke-linecap="round"'+(b.air?' stroke-dasharray="5 4" opacity=".6"':"")+'/>');
  }
  pts.forEach(function(p){
    var on=activeId&&p.bid===activeId, r=p.major?7.5:3.5;
    o.push('<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(on?r+1.5:r)+'" fill="'+(p.major?"var(--c)":"var(--paper)")+
      '" stroke="var(--c)" stroke-width="'+(on?3:2)+'"/>');
    if(p.major&&p.code) o.push('<text x="'+p.x+'" y="'+(p.y+2.7)+'" fill="#fff" font-family="var(--f-mono)" '+
      'font-size="7.5" font-weight="700" text-anchor="middle">'+esc(p.code)+"</text>");
    if(p.lab_on||on){
      var right=p.x<m.w*0.56, lx=right?p.x+(r+5):p.x-(r+5);
      o.push('<text x="'+lx+'" y="'+(p.y+3.3)+'" fill="var(--ink)" font-family="var(--f-body)" font-size="10" '+
        'font-weight="600" text-anchor="'+(right?"start":"end")+'" stroke="var(--paper)" stroke-width="2.8" '+
        'paint-order="stroke">'+esc(p.lab)+"</text>");
    }
  });
  o.push('</g>');
  o.push('<rect x="'+m.pad+'" y="'+m.pad+'" width="'+m.iw+'" height="'+m.ih+'" rx="8" fill="none" stroke="var(--line)"/>');
  var sy=m.pad+m.ih+15;
  o.push('<line x1="'+m.pad+'" y1="'+sy+'" x2="'+(m.pad+m.scalePx)+'" y2="'+sy+'" stroke="var(--mute)"/>');
  o.push('<line x1="'+m.pad+'" y1="'+(sy-3)+'" x2="'+m.pad+'" y2="'+(sy+3)+'" stroke="var(--mute)"/>');
  o.push('<line x1="'+(m.pad+m.scalePx)+'" y1="'+(sy-3)+'" x2="'+(m.pad+m.scalePx)+'" y2="'+(sy+3)+'" stroke="var(--mute)"/>');
  o.push('<text x="'+(m.pad+m.scalePx+6)+'" y="'+(sy+3)+'" fill="var(--mute)" font-family="var(--f-mono)" font-size="8">'+
    m.scaleKm+' km</text>');
  o.push('</svg>');
  var gm="https://www.google.com/maps/dir/"+pts.filter(function(p){return p.major;})
    .map(function(p){return p.lat+","+p.lon;}).join("/");
  var w=el('<div class="mapwrap">'+o.join("")+'<div class="mapcap"><span>'+esc(cap||"")+
    '</span><a href="'+esc(gm)+'" target="_blank" rel="noopener">Ouvrir dans Maps ↗</a></div></div>');
  return w;
}
function rhythmStrip(c){
  var bl=(c.blocs||[]).slice().sort(by("order"));
  if(!bl.length) return null;
  var tot=bl.reduce(function(a,b){return a+(b.nights||0);},0)||1;
  var w=el('<div><div class="rhythm"></div><div class="rhythm-l"></div></div>');
  var r=w.querySelector(".rhythm");
  bl.forEach(function(b){
    var n=b.nights||0;
    r.appendChild(el('<div class="rseg'+(n>=4?" hot":"")+'" style="flex:'+Math.max(n,0.6)+
      '" title="'+esc(b.title)+" · "+n+' nuits"><b>'+esc(b.code||"")+"</b></div>"));});
  w.querySelector(".rhythm-l").innerHTML="<span>"+tot+" nuits · "+bl.length+" étapes</span><span>largeur = nuits</span>";
  return w;
}

  var filters=[["tout","Tout"],["urgent","🔥 Urgent"],["avant","Avant le départ"],["pendant","En route"]]
    .concat(Object.keys(CATS).map(function(k){return [k,CATS[k]];}))

     "Aide-moi à répartir ça sur la semaine"],"Les réservations"));
