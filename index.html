<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Le carnet de route partage du voyage en Asie.">
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Asian Roadtrip">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F4F3F0'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F4F3F0'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<title>Asian Roadtrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#F4F3F0; --surf:#FFFFFF; --surf2:#EAE8E3; --line:#DAD7D0; --sea:#DCE6EE; --land:#E6E2DA;
  --ink:#191C1F; --ink2:#41474D; --mute:#787E85;
  --ok:#2F7D57; --warn:#B07813; --crit:#BE3E2A;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 6px 18px -8px rgba(20,22,26,.14);
  --c:#5A79B8;
  --f-disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:11px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1216; --surf:#171B21; --surf2:#1F242B; --line:#2B313A; --sea:#151E27; --land:#232830;
    --ink:#E8E6E1; --ink2:#BFC4CA; --mute:#868D96;
    --ok:#4FAE7C; --warn:#D8A33C; --crit:#E2705B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1216; --surf:#171B21; --surf2:#1F242B; --line:#2B313A; --sea:#151E27; --land:#232830;
  --ink:#E8E6E1; --ink2:#BFC4CA; --mute:#868D96;
  --ok:#4FAE7C; --warn:#D8A33C; --crit:#E2705B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%;height:auto}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{max-width:580px;margin:0 auto;padding:0 16px;padding-block:0 110px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px 12px;
  position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid transparent}
.topbar.stuck{border-bottom-color:var(--line)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;flex:1;white-space:nowrap;min-width:0}
.thread{width:24px;height:5px;border-radius:3px;background:linear-gradient(90deg,
  #C2415A 0 17%,#C96A28 17% 34%,#2E8B72 34% 50%,#C08A1E 50% 67%,#5A79B8 67% 84%,#1F87A0 84%)}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;
  place-items:center;color:var(--mute);flex:none;background:var(--surf)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs ul{display:flex;width:100%;max-width:580px;margin:0;padding:0;list-style:none;pointer-events:auto;
  background:color-mix(in srgb,var(--surf) 93%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line)}
@media (min-width:612px){
  nav.tabs{padding-bottom:calc(env(safe-area-inset-bottom) + 0px)}
  nav.tabs ul{border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
    box-shadow:0 -2px 24px rgba(0,0,0,.06)}
}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;
  color:var(--mute);font-size:10px;font-weight:500;position:relative}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.1}
.badge{position:absolute;top:5px;right:calc(50% - 21px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--crit);color:#fff;font-family:var(--f-mono);font-size:9.5px;
  font-weight:700;display:grid;place-items:center;line-height:1}

.sec{margin-block:24px}
.sec:first-of-type{margin-top:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:12px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--mute)}
h1.page{font-family:var(--f-disp);font-weight:800;font-size:27px;letter-spacing:-.025em;margin:2px 0 5px;text-wrap:balance}
.lede{color:var(--ink2);margin:0 0 4px;font-size:14.5px;line-height:1.55}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:9px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.empty{color:var(--mute);font-size:13.5px;padding:16px 2px;text-align:center;font-style:italic}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);
  color:var(--ink2);white-space:nowrap}
.chip.s-short{border-color:color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.chip.s-book{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.s-ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip.s-fait{opacity:.5}
.chip.hot{border-color:color-mix(in srgb,var(--crit) 50%,transparent);color:var(--crit);
  background:color-mix(in srgb,var(--crit) 10%,transparent);font-weight:700}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--surf2);
  color:var(--ink2);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--surf);border-radius:9px;padding:9px 13px;font-size:13.5px;font-weight:500;color:var(--ink);
  transition:background .15s}
.btn:active{background:var(--surf2)}
.btn.wide{width:100%}
.btn.ask{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);
  color:var(--c);font-weight:600}
.btn.ask svg{width:15px;height:15px;fill:currentColor;stroke:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.prim{background:var(--ink);color:var(--paper);border-color:var(--ink)}

input[type=text],input[type=url],input[type=date],input[type=number],textarea,select{
  width:100%;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:15px}
textarea{resize:vertical;min-height:74px;line-height:1.45}
label.fl{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--mute);margin:0 0 5px 2px}
.field{margin-bottom:11px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}

/* ---------- texte riche ---------- */
.rt{font-size:14.5px;line-height:1.62;color:var(--ink2)}
.rt p{margin:0 0 11px}
.rt p:last-child{margin-bottom:0}
.rt strong{color:var(--ink);font-weight:700}
.rt em{font-style:normal;color:var(--c);font-weight:600}
.rt ul{margin:0 0 11px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.rt li{position:relative;padding-left:17px}
.rt li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;
  background:color-mix(in srgb,var(--c) 70%,transparent)}
.rt .cal{margin:0 0 11px;padding:10px 12px;border-radius:9px;font-size:13.5px;line-height:1.55;
  background:color-mix(in srgb,var(--warn) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.rt .key{margin:0 0 11px;padding:10px 12px;border-radius:9px;font-size:14px;line-height:1.55;
  background:color-mix(in srgb,var(--c) 9%,transparent);border-left:3px solid var(--c);color:var(--ink)}
.rt a{color:var(--c);word-break:break-word}

/* ---------- carte ---------- */
.mapwrap{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px 4px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.mapcap{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 7px 3px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.mapcap a{color:var(--c);text-decoration:none}

/* ---------- rythme ---------- */
.rhythm{display:flex;gap:2px}
.rseg{border-radius:4px;min-width:15px;background:color-mix(in srgb,var(--c) 22%,transparent);height:36px;
  display:grid;place-items:center}
.rseg b{font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:var(--c)}
.rseg.hot{background:color-mix(in srgb,var(--c) 58%,transparent)}
.rseg.hot b{color:var(--surf)}
.rhythm-l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--mute);margin-top:6px}

/* ---------- listes cliquables ---------- */
.ctry{display:block;width:100%;position:relative;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px 13px 18px;overflow:hidden}
.ctry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ctry .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ctry .nm{font-family:var(--f-disp);font-weight:700;font-size:17.5px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.ctry .dates{font-family:var(--f-mono);font-size:11px;color:var(--mute);white-space:nowrap}
.ctry .tl{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.45}
.ctry .foot{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.nights{font-family:var(--f-mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.linkto{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.connector{display:flex;align-items:center;gap:9px;padding:6px 0 6px 18px;font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.05em;color:var(--mute)}
.connector .bar{width:2px;height:20px;margin-left:1px;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px)}

.rail{position:relative;padding-left:28px;margin-top:2px}
.rail::before{content:"";position:absolute;left:8px;top:12px;bottom:20px;width:2px;background:color-mix(in srgb,var(--c) 36%,transparent)}
.stop{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;width:100%;display:block}
.stop::before{content:"";position:absolute;left:-25px;top:15px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--c);z-index:1}
.stop[data-st="ok"]::before{background:var(--c)}
.stop .sh{display:flex;align-items:baseline;gap:9px;justify-content:space-between}
.stop .st{font-family:var(--f-disp);font-weight:700;font-size:15.5px;letter-spacing:-.012em;line-height:1.25;
  display:flex;align-items:center;gap:8px}
.stop .sd{font-family:var(--f-mono);font-size:10.5px;color:var(--mute);white-space:nowrap;flex:none}
.stop .sp{font-family:var(--f-mono);font-size:10.5px;color:var(--c);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.stop .sw{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.48;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stop .sf{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:9px}
.blocode{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;background:var(--c);
  color:#fff;font-family:var(--f-mono);font-size:10px;font-weight:700;flex:none}
.hop{position:relative;display:flex;align-items:center;gap:8px;padding:9px 0 9px 2px;min-height:34px}
.hop::before{content:"";position:absolute;left:-20px;top:50%;width:7px;height:7px;margin-top:-3.5px;
  transform:rotate(45deg);background:var(--paper);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.hop .mode{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.11em;color:var(--c);text-transform:uppercase}
.hop .det{font-family:var(--f-mono);font-size:10.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chead{position:relative;border-radius:14px;overflow:hidden;background:var(--surf);border:1px solid var(--line);padding:16px 15px;margin-top:6px}
.chead::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c)}
.chead h1{font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.03em;margin:8px 0 4px;
  display:flex;align-items:center;gap:9px;text-wrap:balance;line-height:1.15}
.chead .cd{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2)}
.chead .ct{font-size:13.5px;color:var(--ink2);margin-top:9px;line-height:1.5}
.backb{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mute);padding:14px 0 4px}
.backb svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.subtabs{display:flex;gap:4px;margin:16px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);
  border:1px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--surf);border-color:var(--line);color:var(--ink)}

.info-b{padding:13px 14px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.info-b h3{margin:0 0 8px;font-family:var(--f-disp);font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.info-b.clk{width:100%;display:block;text-align:left}
.info-b .teaser{font-size:13.5px;color:var(--ink2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info-b .moreline{display:flex;align-items:center;gap:5px;margin-top:8px;font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}

.day{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.day .dh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.day .jn{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;
  border-radius:5px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.day .dt{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:-.012em;line-height:1.25;flex:1}
.day .dd{font-family:var(--f-mono);font-size:10.5px;color:var(--mute);white-space:nowrap}
.line{display:flex;gap:9px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px;
  color:var(--ink2);line-height:1.5}
.line .lk{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);flex:0 0 48px;padding-top:3px}

/* ---------- réserver ---------- */
.bk{display:flex;align-items:center;gap:10px;padding:0 0 0 12px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);width:100%;overflow:hidden}
.bk .tick{flex:0 0 21px;width:21px;height:21px;border-radius:6px;border:1.8px solid var(--line);display:grid;place-items:center}
.bk .tick svg{width:12px;height:12px;stroke:var(--surf);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.bk[data-done="1"] .tick{background:var(--ok);border-color:var(--ok)}
.bk[data-done="1"] .tick svg{opacity:1}
.bk[data-done="1"] .bkt{text-decoration:line-through;color:var(--mute)}
.bk .bkbody{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:12px 12px 12px 0}
.bk .bkt{font-size:14px;font-weight:500;line-height:1.32;flex:1;min-width:0}
.bk .bkm{display:flex;gap:5px;align-items:center;flex:none}
.bk .bkc{color:var(--mute);flex:none}
.bk .bkc svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
.bkstripe{width:5px;align-self:stretch;margin:0 0 0 -12px;flex:none;border-radius:0}
.due{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;
  border-radius:5px;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.due.hot{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit);font-weight:700}
.due.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-weight:700}
.kv{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv b{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
  font-weight:700;flex:0 0 78px;padding-top:3px}
.kv a{color:var(--c);word-break:break-all;font-family:var(--f-mono);font-size:12.5px}

/* ---------- guide ---------- */
.gcard{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px}
.gico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:var(--surf2)}
.gcard .gt{display:block;font-family:var(--f-disp);font-weight:700;font-size:15.5px;letter-spacing:-.012em;line-height:1.25}
.gcard .gs{display:block;font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45}
.gcard .gm{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.gcard.key{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.gcard.key .gico{background:color-mix(in srgb,var(--c) 14%,transparent)}

/* ---------- feuille ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.55);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;
  border-radius:17px 17px 0 0;border:1px solid var(--line);border-bottom:0;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 11px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:16.5px;letter-spacing:-.015em;flex:1;line-height:1.25}
.sheet .body{overflow-y:auto;padding:15px 16px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.x{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);flex:none}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.answer{white-space:pre-wrap;font-size:14.5px;line-height:1.62;color:var(--ink2)}
.thinking{display:flex;align-items:center;gap:9px;color:var(--mute);font-size:13.5px;font-style:italic}
.dot3{width:6px;height:6px;border-radius:50%;background:var(--c);animation:pulse 1.1s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.askbox{background:var(--surf);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:var(--r);padding:12px}
.askbox .ah{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:9px}
.askbox .ah svg{width:13px;height:13px;fill:currentColor;stroke:none}
.askrow{display:flex;gap:8px;align-items:flex-end}
.askrow textarea{min-height:44px;max-height:150px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.sugg button{font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);
  color:var(--ink2);background:var(--paper)}
.banner{padding:11px 13px;border-radius:var(--r);font-size:13px;line-height:1.5;
  background:color-mix(in srgb,var(--warn) 11%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink2)}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.countdown{position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:18px 16px 16px}
.countdown .thread6{position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,
  #C2415A 0 17%,#C96A28 17% 34%,#2E8B72 34% 50%,#C08A1E 50% 67%,#5A79B8 67% 84%,#1F87A0 84%)}
.cd-big{font-family:var(--f-disp);font-weight:800;font-size:52px;line-height:.92;letter-spacing:-.045em;
  margin:8px 0 2px;font-variant-numeric:tabular-nums}
.cd-sub{font-size:14px;color:var(--ink2)}
.cd-route{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line);
  font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.cd-route b{font-weight:700;color:var(--ink)}
.alertrow{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);border-left:3px solid var(--sev,var(--mute))}
.alertrow .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--sev);
  font-weight:700;margin-bottom:3px}
.alertrow p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.45}
.alertrow strong{color:var(--ink);font-weight:600}

/* --- synchronisation --- */
.syncpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);border-radius:999px;padding:5px 10px 5px 8px;font-size:11.5px;font-family:var(--f-mono);
  letter-spacing:.02em;cursor:pointer;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.syncpill .sd{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.syncpill.s-ok .sd{background:#3E8E5A}
.syncpill.s-dirty .sd,.syncpill.s-push .sd{background:#C98A2B;animation:pulse 1.1s ease-in-out infinite}
.syncpill.s-offline .sd{background:var(--mute)}
.syncpill.s-local .sd{background:#C98A2B}
.syncpill.s-auth{border-color:var(--crit);color:var(--crit)}
.syncpill.s-auth .sd{background:var(--crit)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.promptbox{width:100%;min-height:180px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;
  border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper2);color:var(--ink2);
  resize:vertical;-webkit-text-size-adjust:100%}
.setrow{display:flex;flex-direction:column;gap:5px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .sk{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.setrow .sv{font-size:13.5px;color:var(--ink);line-height:1.45}
</style>

(function(){
"use strict";

var DEPART="2026-09-20";

/* ---- voyage embarque : sert de depart et de secours hors ligne ---- */
var SEED={"v":1,"updated":"2026-09-14T00:00:00Z","by":"","data":{"countries":[{"arriveBy":"Vol Paris → Tokyo HND","blocs":[{"alert":"Trois soirées à caler dans ce bloc, elles ne coûtent pas une journée.\n\n• LE SUMO : l'Aki Basho (le tournoi d'automne) se tient à Ryogoku (le quartier du sumo à Tokyo) pendant tout votre séjour. La vente anticipée est complète, MAIS le guichet vend des sièges D à 2 500 ¥ le matin même quand la journée n'est pas complète — vérifiez les stocks sur md.pia.jp/sumo/vacant (mis à jour 11 h et 17 h) et présentez-vous tôt.\n\nEt le matin, l'écurie Arashio-beya de Nihonbashi laisse observer l'entraînement gratuitement depuis la rue à travers sa baie vitrée, 7h30-9 h, sans réservation.\n\n• LE KABUKI À L'ACTE au Kabuki-za (le grand théâtre kabuki de Ginza) de Ginza : le hitomaku-mi (billet pour un seul acte), un billet pour UN SEUL acte, 4e étage, 1 000 à 3 000 ¥, sans réservation des mois à l'avance, audioguide anglais en location. Le meilleur rapport culture/prix/temps du voyage.\n• LE BASEBALL : fin de saison régulière, le moment le plus chaud. Yakult Swallows au Jingu Stadium de préférence, en plein air, avec les petits parapluies des supporters.","base":"Asakusa / Kuramae","code":"A","d1":"2026-09-21","d2":"2026-09-26","days":[{"date":"2026-09-21","food":"Ramen ou gyoza de quartier, puis egg sando et onigiri de 7-Eleven pour le réveil inévitable à l'aube.","n":"J1","program":["Atterrissage HND en fin d'après-midi. Monorail + Asakusa Line jusqu'à l'hôtel, ~45 min, ~600 ¥.","Objectif : ne rien faire d'ambitieux.","Balade nocturne autour du Senso-ji illuminé — magnifique et vide après 20 h.","Premier konbini (supérette ouverte 24 h), celui qui vous sauvera à 4 h du matin."],"sleep":"Asakusa / Kuramae","tip":"Vous arrivez le premier jour d'un pont national de cinq jours. Les sites majeurs seront saturés jusqu'au 23 : profitez du réveil à 5 h pour être partout avant 8 h.","title":"Arrivée, et rien d'autre"},{"date":"2026-09-22","food":"Yakitori au charbon à Omoide Yokocho, tonkatsu (porc pané) chez Maisen à Omotesando.","n":"J2","program":["Meiji Jingu au réveil : vous serez debout à 5 h, autant en profiter, la forêt est vide.","Takeshita-dori et Harajuku, puis Omotesando pour l'architecture.","Shibuya Crossing et Shibuya Sky au coucher du soleil.","Soirée Shinjuku : Kabukicho, Omoide Yokocho (la ruelle de yakitori (brochettes de poulet grillées) enfumée), Golden Gai."],"sleep":"Asakusa / Kuramae","tip":"Shibuya Sky ne se réserve que 14 jours à l'avance. Pour le 22/09, la vente est ouverte depuis le 8.\n\nLes créneaux coucher de soleil partent en quelques heures et s'il n'y a rien en ligne, il n'y a rien au guichet.","title":"Tokyo ouest — Shibuya, Harajuku, Shinjuku"},{"date":"2026-09-23","food":"Unagi (anguille grillée) à Asakusa, la spécialité historique du quartier. Melonpan de Kagetsudo.","n":"J3","program":["Senso-ji à 7 h, avant les cars. Nakamise-dori.","Kappabashi, la rue des ustensiles de cuisine : c'est là qu'on achète les couteaux japonais, bien mieux qu'ailleurs.","Yanaka Ginza : le Tokyo d'avant-guerre, ruelles basses et chats. Très sous-coté.","Ueno : le parc, et le Tokyo National Museum si vous voulez du fond.","Fin de journée à Akihabara : Super Potato, Yodobashi, salles d'arcade."],"sleep":"Asakusa / Kuramae","title":"Tokyo est — Asakusa, Ueno, Yanaka, Akihabara"},{"date":"2026-09-24","food":"Kaisendon à Toyosu, tamagoyaki (omelette roulée sucrée) sur bâtonnet à Tsukiji, et le soir monjayaki (pâte à poêler, spécialité de Tokyo) à Tsukishima — la rue Monja, une spécialité tokyoïte introuvable ailleurs.","n":"J4","program":["Marché de Toyosu tôt le matin : galeries d'observation des criées au thon, puis petit-déjeuner sushi sur place.","teamLab Planets ou Borderless — réservation obligatoire.","Tsukiji Outer Market pour le déjeuner : le marché extérieur est resté, seule la criée a déménagé.","Fin d'après-midi Ginza (Itoya, Uniqlo flagship) ou Odaiba."],"sleep":"Asakusa / Kuramae","tip":"Premier jour ouvré après Silver Week (pont férié de cinq jours) : c'est CE MATIN qu'il faut aller chercher les traductions de permis chez ALADDIN, à Minato-ku, ouverture 10 h. Prévoyez 10 000 ¥ et les deux permis originaux, et demandez l'émission d'urgence en une heure.","title":"Marché, art numérique, baie"},{"date":"2026-09-25","food":"Shirasu-don (petites anchois crues), la spécialité d'Enoshima.","n":"J5","program":["Train JR Yokosuka depuis Tokyo Station, ~1 h, 940 ¥.","Grand Bouddha de Kotoku-in, Hase-dera (jardins et vue mer), Tsurugaoka Hachimangu, rue Komachi-dori.","Ligne Enoden, le petit train côtier, jusqu'à Enoshima : île-sanctuaire, grottes marines, coucher de soleil avec le Fuji en arrière-plan par temps clair.","Retour Tokyo le soir. Préparer les sacs : la voiture arrive demain."],"sleep":"Asakusa / Kuramae","tip":"Dernier jour ouvré avant la voiture. Si ALADDIN n'a pas livré hier, c'est aujourd'hui ou jamais — et décalez la prise du véhicule de demain à 11 h ou 12 h plutôt que 9 h.","title":"Kamakura & Enoshima"}],"geo":[[35.681,139.767,"Tokyo"]],"id":"jpA","nights":5,"order":10,"sleep":"Asakusa / Kuramae : le meilleur rapport prix-charme de Tokyo, ambiance vieux quartier, calme le soir — exactement ce qu'il faut pour encaisser le décalage. Cibler 55-75 € la double : Toyoko Inn Asakusa, Super Hotel Asakusa, ou Dormy Inn Asakusa (~80 €, grand bain onsen (source chaude) sur le toit et ramen offert le soir — à ce prix, c'est le meilleur choix des trois).","status":"book","title":"Tokyo, l'arrivée","transport":"Métro + IC card","transportNote":"IC card (carte de transport sans contact) Suica (carte de transport rechargeable) ou Pasmo (équivalent de la Suica) sur le téléphone dès l'aéroport, installée depuis la France. Aucun pass touristique nécessaire, le paiement à l'unité suffit largement.\n\nDepuis HND : monorail + Asakusa Line, ~45 min, ~600 ¥, et les dernières rotations tournent jusqu'à minuit passé — aucun stress avec une arrivée en fin d'après-midi.","via":"Atterrissage HND en fin d'après-midi","viaMode":"arrivee","why":"Cinq nuits pour digérer les sept heures de décalage en ville plutôt qu'au volant à gauche. Jour 1 sacrifié, puis Tokyo ouest, Tokyo est, la baie, et une excursion à Kamakura."},{"alert":"Si le permis n'est pas prêt le 26 au matin, ne perdez pas la journée : Shinjuku → Hakone en Odakyu Romancecar (le train panoramique, 1 h 30) avec le Hakone Free Pass fonctionne parfaitement, et c'est justement le bloc où la voiture est le moins indispensable. Le tronçon où elle est vitale, c'est le bloc E — et d'ici là la traduction sera acquise depuis dix jours.","base":"Kawaguchiko ×2, Hakone ×1","code":"B","d1":"2026-09-26","d2":"2026-09-29","days":[{"date":"2026-09-26","food":"Hoto — l'épaisse soupe de nouilles plates au miso et potiron du Yamanashi. Hoto Fudo, l'établissement à l'architecture blanche futuriste, est l'adresse iconique.","n":"J6","program":["Récupération de la voiture vers 9 h (ou 11 h si le permis a traîné). Chuo Expressway, ~2 h, péage ~2 500 ¥.","Arrêt Oshino Hakkai : le village aux huit bassins d'eau de source translucide alimentés par le Fuji. Très touristique à midi, parfait en fin d'après-midi.","Parc Oishi, rive nord du lac : le meilleur point de vue Fuji avec les fleurs, sans la foule de Chureito.","Nishiura Street : la rue résidentielle avec le Fuji en perspective."],"sleep":"⭐ Ryokan onsen (source chaude) avec vue Fuji. La nuit signature du voyage : rotenburo (bain extérieur) face à la montagne.\n\nChercher sur Rakuten Travel ou Jalan, filtre « vue Mont Fuji + onsen », et comparer la formule avec dîner (~180-220 €) à la formule sudomari (nuit sans repas) sur deux nuits.","title":"Tokyo → Lac Kawaguchiko"},{"date":"2026-09-27","food":"Yoshida udon, les nouilles ultra-fermes de Fujiyoshida. Un bol de ramen à la 5e station.","n":"J7","program":["Lever à l'aube. Le Fuji est dégagé le matin et se couvre l'après-midi : c'est LA règle du coin, tout le reste s'y plie.","Fuji Subaru Line jusqu'à la 5e station, 2 300 m — route payante ~2 100 ¥, ouverte jusqu'à fin octobre. Vue sur la mer de nuages.","Lac Saiko, puis grottes de glace de Narusawa et grotte du vent de Fugaku, en lisière de la forêt d'Aokigahara.","Lac Motosu : le point de vue du billet de 1 000 yens. Lac Shoji, le plus sauvage des cinq.","Chureito seulement si vous y tenez — vous avez déjà mieux."],"sleep":"2e nuit à Kawaguchiko (voir la recommandation du bloc : idéalement le même établissement)","title":"Tour des cinq lacs et flancs du Fuji"},{"date":"2026-09-28","food":"Unagi de Mishima — la ville en a fait sa spécialité, l'anguille y est affinée dans l'eau de source du Fuji.","n":"J8","program":["Dernière matinée côté Fuji : le sommet est dégagé jusqu'à ~10 h, c'est votre dernière chance pour un point de vue manqué la veille.","Route sud, ~1 h 15. Arrêt au Mishima Skywalk : le plus long pont suspendu piéton du Japon, 400 m, le Fuji d'un côté et la baie de Suruga de l'autre. C'est ce qu'on garde d'Izu, et ça suffit.","Remontée sur Hakone par l'Izu Skyline ou la Hakone Turnpike, l'une des plus belles routes de montagne du pays.","Owakudani (la vallée volcanique fumante) en fin d'après-midi : le parking est saturé avant 10 h le matin, la fin de journée est bien plus sereine. Puis descente sur Odawara et RESTITUTION DE LA VOITURE le soir."],"sleep":"Hakone / Gora, business hotel avec onsen (source chaude) ou petit ryokan (auberge traditionnelle) — ou Hakone-Yumoto, plus pratique sans voiture","title":"Kawaguchiko → Mishima → Hakone"},{"date":"2026-09-29","food":"Œufs noirs kuro-tamago (œufs noirs cuits au soufre) d'Owakudani, cuits dans les sources sulfureuses — un œuf vaut sept ans de vie en plus, dit la légende. Soba de Hakone.","n":"J9","program":["Restitution de la voiture à Odawara la veille au soir : aujourd'hui, Hakone se fait au Hakone Free Pass (forfait train + funiculaire + téléphérique + bateau + bus).","Musée en plein air de Hakone : sculptures et pavillon Picasso avec les montagnes en fond. Un des meilleurs musées du Japon.","Lac Ashi : le torii (portique rouge de sanctuaire) flottant (le portique rouge du sanctuaire) du Hakone-jinja, et le Narukawa Art Museum et sa baie vitrée panoramique sur le lac et le Fuji.","Shinkansen (train à grande vitesse) Kodama (Shinkansen omnibus) ou Hikari (les Shinkansen omnibus) Odawara → Kyoto, 2 h 20. Côté D/E à l'aller pour le Fuji."],"sleep":"Kyoto","tip":"Pourquoi ne pas garder la voiture jusqu'à Kyoto : 430 km, 6 h de conduite et 55 à 67 € de péage, soit presque le prix du billet. Le Shinkansen (train à grande vitesse) fait 2 h 20.\n\nEt pourquoi rendre à Odawara plutôt qu'à Tokyo : Odawara est déjà sur la ligne, remonter à Tokyo ajouterait 80 km à rebours pour gagner cinq minutes de train.","title":"Hakone, puis Shinkansen (train à grande vitesse) pour Kyoto"}],"geo":[[35.512,138.757,"Kawaguchiko"],[35.121,138.919,"Mishima"],[35.233,139.028,"Hakone"]],"id":"jpB","nights":3,"order":20,"sleep":"**RÉPONSE À VOTRE QUESTION** : trois nuits, DEUX lieux, et surtout pas trois. Deux nuits à Kawaguchiko sont nécessaires, pas confortables : le Fuji est dégagé le matin et se couvre presque systématiquement l'après-midi, donc une seule matinée sur place est un pile ou face.\n\nPuis une nuit à Hakone, qui justifie son déplacement — le musée en plein air et le lac Ashi valent une vraie demi-journée, et c'est là que vous prenez le Shinkansen (train à grande vitesse). Trois lieux en trois nuits, ce serait passer le bloc à faire et défaire les sacs.\n\nLe vrai arbitrage est ailleurs : si vous prenez un ryokan (auberge traditionnelle) cher la nuit 1 puis un business hotel la nuit 2, vous déménagez au milieu de Kawaguchiko, au moment précis où vous voulez être dehors à l'aube. Cherchez plutôt DEUX nuits dans le même ryokan (auberge traditionnelle) en formule sudomari (nuit sans repas, nettement moins chère) et payez un seul kaiseki (dîner gastronomique en petits plats) à part.\n\n!! ⚠️ ET UN AVERTISSEMENT SUR LES SEPT ADRESSES REÇUES : quatre d'entre elles sont dans la péninsule d'Izu, à 1 h 30 à 3 h de route de votre itinéraire, et AUCUNE des sept n'a de bain extérieur face au Fuji. Seules deux sont exploitables, toutes deux pour la nuit de Hakone.\n\nDétail dans l'onglet Dormir.","status":"book","title":"Fuji & Hakone","transport":"Voiture 1 (4 j)","transportNote":"RÉPONSE À VOS DEUX QUESTIONS. Non, la voiture n'est PAS indispensable pour Hakone — elle y est même plutôt un handicap.\n\nHakone possède l'un des meilleurs réseaux touristiques du Japon : le Hakone Free Pass (un forfait unique) couvre le train Odakyu, le petit train de montagne Tozan, le funiculaire, le téléphérique, le bateau du lac Ashi et les bus. Toute la boucle est conçue autour de lui, et le parking d'Owakudani est saturé avant 10 h.\n\nLa voiture est indispensable ailleurs : pour le tour des cinq lacs du Fuji (Saiko, Motosu, Shoji, la Subaru Line), desservis par des bus rares, et pour la route Mishima Skywalk → Izu Skyline → Hakone Turnpike. DONC : rendez la voiture à Odawara le soir du J8, en arrivant, et faites Hakone le J9 au Free Pass.\n\nVous économisez une journée de location et le problème du stationnement.\n\n**SUR LE POINT DE RESTITUTION** : ne remontez surtout pas la rendre à Tokyo. Odawara est SUR la ligne du Tokaido Shinkansen (le train à grande vitesse de la côte pacifique) et au pied de Hakone.\n\nOdawara → Kyoto met 2 h 20, Tokyo → Kyoto met 2 h 15 : quinze minutes de différence, contre 80 km de route à rebours et la traversée de Tokyo. Le frais d'aller simple Tokyo → Kanagawa est de 2 200 ¥, une misère.\n\nRendre à Odawara est nettement mieux.\n\n**IDÉE POUR ALLÉGER ENCORE** : plutôt que de prendre la voiture à Shinjuku et de subir deux heures de sortie de Tokyo, prenez le bus direct Shinjuku → Kawaguchiko (1 h 45, environ 2 000 ¥) le matin du J6 et louez sur place — Toyota a une agence à la gare de Kawaguchiko. Vous arrivez au lac vers 10 h au lieu de midi, et vous ne payez que trois jours de location au lieu de quatre.","via":"Prise à Shinjuku le 26/09 au matin","viaMode":"voiture","why":"Les points de vue du Fuji — Parc Oishi, Nishiura Street, lacs Saiko et Motosu — sont desservis par des bus rares, lents et saturés. Sans voiture, vous vous limitez à Kawaguchiko-ville et Hakone."},{"base":"Kyoto Karasuma","code":"C","d1":"2026-09-29","d2":"2026-10-04","days":[{"date":"2026-09-30","food":"Yudofu (tofu mijoté) dans le quartier des temples, obanzai (cuisine familiale de Kyoto) — la cuisine domestique kyotoïte — le soir, dango (boulettes de riz grillées) grillé sur Ninenzaka.","n":"J10","program":["Fushimi Inari à 6h30. Non négociable : à 9 h c'est un couloir de foule, à 6h30 vous êtes seuls dans les torii (portique rouge de sanctuaire). Monter jusqu'au Yotsutsuji (30 min) pour la vue, voire au sommet (2 h A/R).","Tofuku-ji en redescendant : jardins zen, pont Tsutenkyo.","Kiyomizu-dera, puis descente par Sannenzaka et Ninenzaka, Kodai-ji, Yasaka-jinja.","Gion au crépuscule : Hanamikoji, et la ruelle Shirakawa, la plus photogénique et la moins fréquentée.","Soirée Pontocho, la ruelle de restaurants le long de la Kamo."],"sleep":"Kyoto","title":"Fushimi Inari & Higashiyama"},{"date":"2026-10-01","food":"Yuba (peau de tofu) à Arashiyama, glace au matcha, et Nishiki Market en fin de journée pour picorer.","n":"J11","program":["Bambouseraie d'Arashiyama à 7 h — ou, mieux, la remplacer par celle de Kodai-ji ou du temple Jizo-in, bien moins connues et bien plus belles à vivre.","Tenryu-ji et son jardin de promenade classé UNESCO, puis Okochi Sanso : la villa d'un acteur du muet, jardin sublime, quasi vide, thé inclus.","Monkey Park Iwatayama : 20 min de montée, macaques en liberté et panorama sur Kyoto.","Après-midi : Kinkaku-ji, Ryoan-ji et son jardin sec, Ninna-ji."],"sleep":"Kyoto","title":"Arashiyama & le nord-ouest"},{"date":"2026-10-02","food":"Kakinoha-zushi, le sushi enveloppé dans une feuille de kaki, et le mochi (pâte de riz pilée) de Nakatanidou — le spectacle du pilonnage à deux, ultra-rapide, vaut le détour à lui seul.","n":"J12","program":["Train Kintetsu depuis Kyoto, ~45 min, 760 ¥.","Todai-ji et son Grand Bouddha, la plus grande structure en bois du monde.","Parc aux daims — ils s'inclinent pour réclamer un biscuit.","Kasuga Taisha et ses 3 000 lanternes, Isuien Garden.","Fin de journée dans Naramachi, le quartier des maisons de marchands."],"sleep":"Kyoto","title":"Nara"},{"date":"2026-10-03","food":"C'est LA journée bouffe du voyage. Takoyaki, okonomiyaki (galette de chou à la poêle) version Osaka (mélangée), kushikatsu (brochettes panées) à Shinsekai, kitsune udon.","n":"J13","program":["Shinkansen (train à grande vitesse) Kyoto → Himeji dès le matin, ~50 min, ~5 500 ¥. Le château ouvre à 9 h, y être à l'ouverture.","Château de Himeji : le château féodal le mieux conservé du Japon, jamais détruit ni bombardé, UNESCO. Donjon blanc de six étages, le « héron blanc », approche en labyrinthe défensif, charpente d'origine. Compter 2 h. Escaliers très raides, on se déchausse.","Jardin Koko-en juste à côté : neuf jardins Edo reconstitués, billet combiné avantageux.","Himeji → Osaka en Shinkansen (~30 min) ou en JR Special Rapid (~1 h, moitié prix).","Kuromon Ichiba pour un déjeuner tardif, Shinsekai et la tour Tsutenkaku, Umeda Sky Building au coucher du soleil.","Soirée Dotonbori : le panneau Glico, les néons, la foule. Retour Kyoto en 30 min."],"sleep":"Kyoto","tip":"Kushikatsu, règle absolue : on ne trempe la brochette qu'UNE SEULE FOIS dans la sauce commune. La retremper est la faute sociale la plus regardée du Japon populaire.","title":"Himeji + Osaka"},{"date":"2026-10-04","food":"Petit-déjeuner au marché de Nishiki si vous n'y êtes pas allés.","n":"J14","program":["Selon l'énergie : Ginkaku-ji + Chemin des philosophes + Nanzen-ji et son aqueduc en brique, ou Ohara et Sanzen-in au nord, dans une atmosphère de montagne.","Départ en début d'après-midi.","Thunderbird → correspondance Tsuruga → Hokuriku Shinkansen (train à grande vitesse) → Kanazawa, ~2 h 30, ~8 500 ¥."],"sleep":"Kanazawa","title":"Matin Kyoto nord, puis Kanazawa"}],"geo":[[35.011,135.768,"Kyoto"],[34.685,135.805,"Nara"],[34.839,134.694,"Himeji"],[34.694,135.502,"Osaka"]],"id":"jpC","nights":5,"order":30,"sleep":"Karasuma / Shijo, central et sur les deux lignes de métro, ou Kyoto Station si vous privilégiez les excursions. Kyoto début octobre est le point dur du budget : 85-110 € la double.\n\nMitsui Garden Hotel Kyoto Sanjo, Daiwa Roynet Shijo Karasuma, Dormy Inn Premium Kyoto Ekimae. Ces cinq nuits représentent le plus gros poste hébergement du séjour après les nuits d'exception — c'est ici qu'une guesthouse ferait la plus grosse économie si le budget dérape.","status":"book","title":"Kyoto & le Kansai","transport":"Train + métro","transportNote":"Métro, bus, marche et vélo. Surtout pas de voiture : circulation dense, stationnement cher et rare, quartiers historiques piétons.\n\nUn pass 1 jour coûte 1 100 à 3 300 ¥ selon la formule, mais le paiement à l'unité suffit souvent.","via":"Shinkansen Odawara → Kyoto, 2 h 20","viaMode":"shink","why":"Base fixe cinq nuits, avec Nara, puis Himeji et Osaka dans la même journée en excursion. Zéro nuit supplémentaire, deux sites UNESCO de plus."},{"base":"Gare de Kanazawa","code":"D","d1":"2026-10-04","d2":"2026-10-06","days":[{"date":"2026-10-04","food":"Jibuni, le canard mijoté à la sauce épaisse, spécialité de la ville. Glace à la feuille d'or à Higashi Chaya — Kanazawa produit 99 % de la feuille d'or du Japon.","n":"J14","program":["Kenroku-en, un des trois plus beaux jardins du Japon, encore plus beau en fin d'après-midi quand les cars sont partis.","Château de Kanazawa juste à côté, et le Gyokusen-inmaru garden.","Higashi Chaya-gai, le quartier des maisons de thé aux façades en lattis de bois. Visiter Shima ou Kaikaro pour voir l'intérieur d'une maison de geishas."],"sleep":"Kanazawa","title":"Arrivée, jardin et quartier des geishas"},{"date":"2026-10-05","food":"Sushi au comptoir — Kanazawa est une des meilleures villes à sushi du Japon. Nodoguro grillé si la saison le permet.","n":"J15","program":["Marché Omicho au petit-déjeuner : c'est ici qu'on mange le meilleur kaisendon (bol de riz aux fruits de mer) du voyage, oursin, crabe des neiges et amaebi compris. Kanazawa est un port de la mer du Japon, la qualité y dépasse Tokyo pour un tiers du prix.","21st Century Museum of Contemporary Art : la piscine de Leandro Erlich, bâtiment circulaire de SANAA. Excellent même si vous n'aimez pas l'art contemporain.","Nagamachi, le quartier des résidences samouraï : murs de terre, canaux. Nomura-ke se visite.","D.T. Suzuki Museum : architecture méditative, bassin miroir. 30 min, mémorable.","Kazue-machi, le petit quartier de geishas au bord de la rivière, quasi désert, au coucher du soleil."],"sleep":"Kanazawa","title":"Art contemporain et quartier samouraï"}],"geo":[[36.578,136.648,"Kanazawa"]],"id":"jpD","nights":2,"order":40,"sleep":"Autour de la gare, ultra-pratique, ou côté Korinbo. Business hotel 60-80 € : Dormy Inn Kanazawa (onsen (source chaude) sur le toit) ou Mitsui Garden Kanazawa.\n\nAucune raison de dépenser plus ici : les nuits d'exception arrivent juste après.","status":"book","title":"Kanazawa","transport":"Bus circulaire / vélo","transportNote":"Kanazawa Loop Bus, 200 ¥ le trajet, ou vélo. Pas de voiture avant le 06 au matin.","via":"Thunderbird + Hokuriku Shinkansen, 2 h 30","viaMode":"train","why":"Deux nuits suffisent, la ville est compacte. Le jardin Kenroku-en, les deux quartiers de geishas, le quartier samouraï et un des meilleurs musées d'art contemporain du pays — et le meilleur poisson du voyage."},{"alert":"En transports en commun, cette boucle coûte ~65 €/pers pour 5 à 6 h de correspondances, avec quelques départs par jour seulement sur les bus Nohi. En voiture, 3 h de route directe.\n\nC'est le bloc qui justifie à lui seul la location — mais réservez-la aujourd'hui : la restitution tombe le lundi 12/10, Sports Day, fin d'un week-end de trois jours, sur l'axe le plus demandé de l'année.","base":"Shirakawa-gō, Takayama, Hirayu ×2, Matsumoto, Togakushi","code":"E","d1":"2026-10-06","d2":"2026-10-12","days":[{"date":"2026-10-06","food":"Le dîner du minshuku (chambre chez l'habitant) : poisson de rivière grillé au sel sur le foyer, légumes de montagne sansai (légumes de montagne), miso local. Une des meilleures tables du voyage, et elle est incluse.","n":"J16","program":["Départ vers 9 h. Autoroute Tokai-Hokuriku, ~1 h 15 jusqu'à Gokayama.","Ainokura et Suganuma, vallée de Gokayama : les MÊMES villages gassho-zukuri (maison à toit de chaume pentu) classés UNESCO que Shirakawa-gō, mais presque sans touristes. C'est le vrai gain de la voiture.","Arrivée à Shirakawa-gō en fin d'après-midi, quand les cars repartent.","Point de vue de Shiroyama au coucher du soleil."],"sleep":"⭐ Minshuku dans une maison gassho-zukuri (maison à toit de chaume pentu) à Shirakawa-gō, ~160-190 € pour deux en demi-pension","tip":"La réservation la plus difficile du voyage. Le système officiel de l'office de tourisme (shirakawa-go.gr.jp) n'ouvre qu'environ 3 mois à l'avance — la fenêtre du 06/10 s'est donc ouverte début juillet.\n\nBonne nouvelle : le 6 est un MARDI ordinaire, hors week-end et hors festival, la meilleure configuration possible. Les paiements échoués remettent des chambres en vente au bout d'une heure, donc du stock réapparaît en continu.\n\nEssayez le site officiel, puis Jalan, puis TÉLÉPHONEZ directement aux maisons (Koemon, Kanjiya, Yosobe). Plan B équivalent et bien plus facile : une minshuku (chambre chez l'habitant) à Ainokura, sur votre route.","title":"Kanazawa → Gokayama → Shirakawa-gō"},{"date":"2026-10-07","food":"Bœuf de Hida sous toutes ses formes. Le hida-gyu (bœuf de la région de Hida) nigiri servi sur un cracker de riz dans la rue est un incontournable. Hoba miso (miso grillé sur une feuille de magnolia), mitarashi dango (boulettes de riz grillées).","n":"J17","program":["Matinée dans le village AVANT l'arrivée des cars, avant 9 h : maison Wada-ke, rizières, ponts suspendus.","Route vers Takayama, ~50 min.","Sanmachi Suji : les rues de l'époque Edo en bois noir, et les brasseries de saké — repérables aux boules de cèdre sugidama (boule de cèdre suspendue) suspendues à l'entrée, dégustations possibles.","Hida no Sato : musée en plein air de maisons traditionnelles déplacées autour d'un étang. Excellent.","Takayama Festival Floats Exhibition Hall : quatre des chars y sont exposés toute l'année, bon échauffement avant de les voir rouler."],"sleep":"Business hotel à Takayama, ~70 €","tip":"C'est ici que je diverge de votre draft. Il prévoit un ryokan (auberge traditionnelle) à 170-200 € : coupez-le.\n\nVous sortez d'une minshuku (chambre chez l'habitant) gassho-zukuri (maison à toit de chaume pentu) hier soir et vous entrez dans deux nuits de ryokan onsen (source chaude) à Hirayu demain. Trois nuits d'exception d'affilée s'annulent entre elles.\n\nUn business hotel ce soir économise 100-130 € sans rien retirer. Argument inverse à connaître : le 07 est la veille du festival, les tarifs sont encore normaux et les nuits du 08 et 09 sont, elles, hors de prix — si vous voulez vraiment dormir dans Takayama même une fois, c'est ce soir ou jamais.","title":"Shirakawa-gō → Takayama"},{"date":"2026-10-08","food":"Kaiseki de montagne du ryokan (auberge traditionnelle), truite iwana (truite de rivière) grillée.","n":"J18","program":["Marchés matinaux Miyagawa et Jinya-mae au réveil (7 h-12 h), puis le Takayama Jinya (ancien bureau du gouvernement shogunal), l'ancien bureau du gouvernement shogunal — le seul encore debout au Japon.","Route vers l'est par le tunnel Abo, ~1 h. Se garer à Sawando (~700 ¥/jour) et prendre la navette (~1 300 ¥ A/R, 30 min).","Kamikochi, la plus belle vallée alpine du Japon : pont Kappa-bashi, étang Taisho et les reflets des Hotaka, étang Myojin à ~1 h de marche facile le long de l'Azusa. Début octobre, les mélèzes commencent à dorer.","Option si le ciel est clair : téléphérique de Shin-Hotaka en fin de journée, double étage, 2 156 m."],"sleep":"⭐ Hirayu Onsen, ~120-150 € pour deux — votre base pour les deux nuits du festival","tip":"Kamikochi est INTERDIT aux véhicules particuliers. Le parking de Sawando et la navette ne sont pas une option, c'est le seul accès.","title":"Marchés matinaux, puis Kamikochi"},{"date":"2026-10-09","food":"Yatai (échoppes de rue) toute la journée : mitarashi dango (boulettes de riz grillées), croquettes de hida-gyu (bœuf de la région de Hida), takoyaki (beignets de poulpe), amazake (boisson de riz chaude) chaud.","n":"J19","program":["Route Hirayu → Takayama tôt le matin, ~40 min, avant que les axes ne se bouchent.","Les onze yatai (chars de festival) sont exposés en ville de 9h30 à 17 h.","Marionnettes karakuri (marionnettes mécaniques) à 12 h et 14 h au sanctuaire Sakurayama Hachimangu, ~50 min.","Grande procession goshinko de 13h20 à 15h30.","🌟 YOMATSURI de 18h15 à 20h30 : les chars ressortent, chacun portant une centaine de lanternes de papier, et traversent la vieille ville au son des flûtes. C'est gratuit, et ça n'a lieu QUE ce soir.","Entre deux temps forts : Higashiyama Walking Course, le sentier des temples sur la colline est, désert même pendant le festival."],"sleep":"2e nuit à Hirayu Onsen. Bain brûlant après une journée debout dans le froid — c'est exactement pour ça qu'on a pris la voiture.","tip":"Le yomatsuri (défilé nocturne aux lanternes) du vendredi soir est LE moment, et en cas de pluie il n'y a PAS de report : les chars restent dans leurs remises. La ville est saturée : garez-vous en périphérie et marchez.\n\n8-10 °C le soir, prévoyez de vrais vêtements chauds. La route de montagne de nuit au retour demande de l'attention, mais elle vaut mieux que de chercher un lit à Takayama.","title":"🏮 Festival de Takayama, jour 1"},{"date":"2026-10-10","food":"Soba de Shinshu — la région produit le meilleur sarrasin du Japon. Basashi (sashimi de cheval), spécialité locale assumée. Oyaki, les chaussons vapeur farcis aux légumes de montagne.","n":"J20","program":["Matinée au festival : le 10 est plus calme que le 9, les chars ressortent de 9h30 à 16 h et la lumière du matin est meilleure pour les photos. Karakuri à 11 h et 13 h. Repartir vers 11 h.","Détour Narai-juku sur la route de Matsumoto : le relais de poste le mieux conservé du Nakasendo (ancienne route Edo-Kyoto), 1 km de façades en bois, quasiment aucun touriste étranger. Fortement recommandé.","Château de Matsumoto en fin d'après-midi : donjon noir d'origine (1594), un des cinq trésors nationaux, les Alpes en fond. Bois d'époque, escaliers très raides.","Nawate-dori, la rue aux grenouilles, et Nakamachi et ses entrepôts blancs."],"sleep":"Business hotel à Matsumoto, ~60-75 €","tip":"⚖️ ARBITRAGE À TRANCHER. Le jungyo (la tournée régionale de sumo) s'arrête à MATSUMOTO CE JOUR-LÀ, de 8h30 à 14h30, avec deux heures d'entraînement public de 9 h à 11 h, les combats, et le dohyo-iri (l'entrée cérémonielle) des yokozuna (le rang suprême).\n\nGradins 4 000 à 8 000 ¥, et vous dormez à Matsumoto ce soir. Mais c'est incompatible avec la matinée du festival.\n\nMon avis : le moment irremplaçable du festival est le yomatsuri (le défilé nocturne aux cent lanternes) d'hier soir — le samedi n'est que la reprise, plus calme. Si le sumo vous tient, partez de Hirayu à 6h30, faites le jungyo (tournée régionale), et gardez Narai-juku (le relais de poste du Nakasendo (ancienne route Edo-Kyoto), l'ancienne route Edo-Kyoto) pour l'après-midi.\n\nSinon, gardez le programme actuel. Dans les deux cas, les billets de jungyo se réservent MAINTENANT sur e+ ou Lawson Ticket.","title":"Festival jour 2, Narai-juku & Matsumoto"},{"date":"2026-10-11","food":"Togakushi soba (nouilles de sarrasin), classée parmi les trois meilleures sobas du Japon, servie en petits nids sur un plateau de bambou. C'est LA raison gastronomique de venir ici.","n":"J21","program":["Daio Wasabi Farm au nord de Matsumoto, ~30 min : la plus grande wasabiraie du Japon, canaux d'eau claire, moulins à eau. Wasabi frais râpé sur place — c'est ce qu'on avait perdu en coupant Izu, récupéré ici en mieux.","Route vers Togakushi, ~1 h 30, par la route de montagne Birdline aux virages serrés.","Les cinq sanctuaires de Togakushi. Le clou est l'Okusha, le sanctuaire supérieur : 2 km de marche dont une allée de cryptomères géants vieux de 400 ans, l'une des images les plus saisissantes du Japon. Compter 2 h A/R.","Kagami-ike, l'étang miroir, et le village ninja de Togakure — musée et maison aux illusions, amusant."],"sleep":"⭐ Shukubo à Togakushi : hébergement en temple, dîner shojin ryori (cuisine bouddhique végétarienne), cérémonie du matin, ~130-160 € pour deux. Alternative économique : business hotel à Nagano, ~60 €.","title":"Daio Wasabi Farm, Togakushi"},{"date":"2026-10-12","food":"Oyaki dans la rue commerçante de Zenko-ji, soba (nouilles de sarrasin) de Nagano.","n":"J22","program":["Zenko-ji à Nagano, un des temples les plus importants du Japon. Faire l'O-kaidan (passage souterrain dans le noir) : le passage souterrain plongé dans le noir absolu où l'on cherche à tâtons la « clé du paradis ».","Restitution de la voiture à Nagano en début d'après-midi.","Shinkansen (train à grande vitesse) Hokuriku Nagano → Tokyo, 1 h 20, ~8 300 ¥."],"sleep":"Tokyo, Shinjuku ou Shibuya cette fois, ~70-90 €","tip":"!! ⚠️ C'est Sports Day, dernier jour d'un week-end de trois jours, juste après le festival et au début des couleurs. Les trains Nagano → Tokyo de l'après-midi et du soir sont les plus disputés du mois, et la vente s'est ouverte le 12 septembre.\n\nRéservez-le en priorité absolue sur eki-net. Les singes des neiges de Jigokudani sont écartés à raison : sans neige en octobre, c'est un bassin bétonné avec deux cents photographes autour.\n\nBonus si vous arrivez avant 19 h : l'Oeshiki d'Ikegami Honmon-ji, le plus grand festival nocturne bouddhiste de Tokyo, a lieu ce soir — cortèges de lanternes-pagodes en papier, tambours et flûtes.","title":"Nagano → Tokyo"}],"geo":[[36.257,136.906,"Shirakawa-gō"],[36.142,137.252,"Takayama"],[36.191,137.512,"Hirayu"],[36.238,137.972,"Matsumoto"],[36.758,138.077,"Togakushi"],[36.649,138.194,"Nagano"]],"id":"jpE","nights":6,"order":50,"sleep":"Six nuits, cinq lieux, et un vrai arbitrage à faire. Par ordre d'irremplaçabilité :\n• la MINSHUKU GASSHO-ZUKURI de Shirakawa-gō le 06/10 est non négociable, une vingtaine de maisons seulement, dîner autour du foyer irori (foyer ouvert au centre de la pièce), ça n'existe nulle part ailleurs ;\n• les deux nuits à HIRAYU ONSEN les 08 et 09 ne sont pas un luxe mais votre solution d'hébergement pendant le festival, à réserver EN PREMIER ;\n• le SHUKUBO de Togakushi le 11/10 est une expérience différente des autres — bouddhique, pas thermale — et vaut son prix ;\n• le RYOKAN DE TAKAYAMA du 07/10 est LA NUIT À SACRIFIER : vous avez une minshuku (chambre chez l'habitant) la veille et deux nuits d'onsen (source chaude) les deux jours suivants, trois nuits d'exception consécutives sont redondantes.\n\nUn business hotel à Takayama le 07 économise 100 à 130 € sans rien retirer au voyage.","status":"book","title":"Alpes japonaises & festival de Takayama","transport":"Voiture 2 (6 j)","transportNote":"Toyota en direct, prise à Kanazawa Station East Exit, restitution à Nagano Shop (une seule agence Toyota dans la ville). Le frais d'aller simple Kanazawa → Nagano n'est publié que dans le simulateur en ligne : estimation 15 000 à 25 000 ¥, à faire tourner sur rent.toyota.co.jp.\n\nS'il dépasse 20 000 ¥, deux locations aller-retour avec jonction en Hokuriku Shinkansen (1 h) reviennent moins cher. Routes de montagne, tunnels, virages serrés : prévoyez systématiquement plus de temps que le GPS.\n\n!! ⚠️ Kamikochi et Norikura sont INTERDITS aux véhicules privés : parking-relais à Sawando (~700 ¥/jour) puis navette (~1 300 ¥ A/R, 30 min).","via":"Prise à Kanazawa le 06/10 au matin","viaMode":"voiture","why":"Le cœur du voyage, et le seul bloc où la voiture est indispensable : elle débloque Gokayama et Togakushi, et surtout elle permet de dormir à Hirayu pendant le festival de Takayama, quand la ville est complète depuis un an."},{"alert":"Le soir de votre arrivée, le 12 octobre, l'Oeshiki d'Ikegami Honmon-ji bat son plein : le plus grand festival nocturne bouddhiste de Tokyo, des dizaines de cortèges portant des lanternes-pagodes fleuries de papier, tambours et flûtes, jusque tard dans la nuit. 300 000 personnes, à 20 min de Gotanda par la ligne Tokyu Ikegami.\n\nC'est gratuit et c'est sur votre chemin — si le train de Nagano arrive avant 19 h, allez-y.\n\n!! ⚠️ Et si vous prolongez : le Kawagoe Matsuri du 17-18 octobre est la meilleure raison de le faire.","base":"Shinjuku / Shibuya","code":"F","d1":"2026-10-12","d2":"2026-10-15","days":[{"date":"2026-10-13","food":"Yuba, la peau de tofu, spécialité de Nikko, servie en sashimi ou en ragoût.","n":"J23","program":["Tobu Spacia depuis Asakusa, ~2 h, ~3 000 ¥. Partir tôt.","Tosho-gu : le mausolée baroque de Tokugawa Ieyasu, ultra-sculpté, doré, à l'opposé de la sobriété japonaise habituelle. Les trois singes et le chat endormi.","Rinno-ji et le pont Shinkyo.","Si le temps le permet : montée au lac Chuzenji par les 48 lacets de l'Irohazaka, et la cascade de Kegon, 97 m."],"sleep":"Tokyo","tip":"Mi-octobre est le PIC des couleurs d'automne à l'altitude du lac Chuzenji. C'est votre meilleure journée de koyo (les couleurs d'automne) de tout le séjour — et la seule, puisque Kyoto sera vert et que les Alpes n'étaient qu'en début de pic.\n\nNe restez pas en bas sur les temples : montez au-dessus des lacets d'Irohazaka, c'est là que ça se passe.","title":"Nikko"},{"date":"2026-10-14","food":"Dernier dîner : sushi au comptoir, un bon tonkatsu (porc pané), ou une tournée d'izakaya (bistrot japonais).","n":"J24","program":["Au choix selon ce que vous aurez aimé : Shimokitazawa (fripes et cafés), Nakameguro (le canal), Kagurazaka, Jimbocho (le quartier des libraires), Yokohama (Chinatown, entrepôts rouges, jardin Sankeien), Kawagoe le « petit Edo » à 30 min.","Ryogoku (le quartier du sumo à Tokyo) si le sumo vous a manqué : le musée du sumo est en ENTRÉE LIBRE du mardi 13 au jeudi 15 octobre, 10 h-16h30, et le quartier est plein de restaurants de chanko (le ragoût des lutteurs) nabe (le ragoût des lutteurs) tenus par d'anciens rikishi (lutteurs) — Chanko Kirishima, Tomoegata, Kappo Yoshiba qui a conservé un dohyo (l'arène) dans sa salle.","Alternative nature : Minakami et le plateau de Tenjindaira au Tanigawadake — 1 h 15 de Shinkansen (train à grande vitesse) puis bus et téléphérique. C'est le seul endroit accessible depuis Tokyo où les couleurs d'automne sont au pic mi-octobre, avec des onsen (sources chaudes) sur place.","Shopping de fin de voyage : Kappabashi pour les couteaux, Don Quijote pour les souvenirs et les snacks, Uniqlo et Muji flagship."],"sleep":"Tokyo","tip":"Faites les sacs en pensant à la suite : après le Japon, l'Indonésie. Et c'est le moment de renvoyer un colis de vêtements chauds en France depuis la poste japonaise — vous voyagez ensuite trois mois en configuration tropicale.\n\nLe musée Ghibli est écarté, vous n'en avez pas envie : rien à faire de ce côté.","title":"Journée libre"},{"date":"2026-10-15","food":"Un dernier egg sando.","n":"J25","program":["Si vous partez le 15 : dernier konbini (supérette 24 h), dernier onigiri, trajet vers HND, 45 min depuis Shinjuku, arriver 3 h avant.","Si vous prolongez jusqu'au 19 ou 20 : les journées supplémentaires s'ajoutent ici, avec le Kawagoe Matsuri les 17 et 18 comme point d'orgue.","Décision à prendre avant de réserver le vol : voir la fiche « Combien de nuits à Tokyo » dans les infos du pays."],"sleep":"—","tip":"Le vol Japon → Indonésie doit être réservé avant de partir : c'est aussi votre preuve de sortie du Japon, exigée à l'embarquement à Roissy. Un seul direct vers Bali (Garuda, Narita 11 h).\n\nJakarta est bien mieux desservi.","title":"Départ — ou pas"}],"geo":[[35.681,139.767,"Tokyo"],[36.752,139.599,"Nikko"]],"id":"jpF","nights":3,"order":60,"sleep":"Shinjuku ou Shibuya, ~70-90 €, pour les sorties et la dernière ligne droite. Changer de quartier par rapport au bloc A est justifié : vous connaissez déjà Asakusa, et vous serez en mode fin de voyage.","status":"book","title":"Tokyo, le bloc tampon","transport":"Train + métro","transportNote":"Métro, et Tobu Spacia depuis Asakusa pour Nikko (~2 h, ~3 000 ¥) ou Shinkansen (train à grande vitesse) via Utsunomiya.","via":"Shinkansen Nagano → Tokyo, 1 h 20","viaMode":"shink","why":"Nikko au pic exact des couleurs d'automne, une journée libre, et la marge dont vous aurez besoin. C'est aussi le bloc extensible : si vous décidez de rester jusqu'au 19 ou 20 octobre, les nuits s'ajoutent ici."}],"color":"#C2415A","d1":"2026-09-21","d2":"2026-10-15","flag":"🇯🇵","name":"Japon","nights":24,"order":1,"practical":[{"k":"🌊 Izu — la décision à reprendre, et mon avis a changé","v":"Vous aviez coupé la péninsule d'Izu en gardant le Mishima Skywalk (le long pont suspendu piéton) comme simple arrêt sur la route. J'ai réexaminé, et **votre raisonnement d'origine était juste sur les faits mais posé sur les mauvais critères**.\n\n**CE QUI ÉTAIT JUSTE.** Le bambou de Shuzenji est un sentier de quelques centaines de mètres — Arashiyama à Kyoto l'écrase. La wasabiraie d'Ikadaba est une exploitation agricole en activité avec deux places de parking et un panneau qui demande aux visiteurs d'être brefs : Daio Wasabi Farm près de Matsumoto est infiniment plus praticable. Et Hirayu vous donne déjà le village thermal de montagne. Trois doublons, vous aviez raison.\n\n>> **CE QUE VOUS AVIEZ MANQUÉ.** Votre itinéraire de 25 jours ne contient pas un seul mètre de côte. Tokyo, un lac, Kyoto, Kanazawa, six nuits d'Alpes : c'est un voyage de montagne et de ville. Pas de rando littorale, pas de coucher de soleil sur l'eau, pas de poisson de côte. Izu est la seule fenêtre de mer de tout le séjour japonais — et elle tombe précisément sur le seul bloc où vous avez une voiture.\n\n**LES TROIS CHOSES QU'IZU FAIT ET QUE RIEN D'AUTRE NE FAIT CHEZ VOUS.**\n• La **Nishi-Izu Skyline** : dix kilomètres de route de crête gratuite entre Toi-tōge et Nishina-tōge, herbe rase, la baie de Suruga d'un côté et le Fuji de face. Probablement la plus belle route de tout votre itinéraire, et elle n'existe qu'en voiture.\n• La **côte de Jōgasaki** : neuf à dix kilomètres de sentier sur falaises de lave, deux à trois heures, un pont suspendu à 48 m au-dessus de la mer. Vous n'avez aucune randonnée côtière ailleurs.\n• Le **poisson de côte** : kinmedai (béryx, la spécialité de Shimoda), crabe-araignée géant de Heda. Votre plan est bœuf de Hida, miso grillé et kaiseki de montagne.\n\n**SUR LA VUE DU FUJI, ne vous faites pas d'illusions.** Depuis Toi, le Fuji est à 50 km et fait environ 2,3 fois moins haut dans le champ que depuis Kawaguchiko, qui n'est qu'à 17 km. Ce n'est pas mieux, c'est autre chose : le cône entier posé sur l'horizon marin, sans aucun bâti. Et depuis la côte ouest le Fuji est plein nord, donc le soleil se couche **sur la mer**, pas sur la montagne. La vraie signature de Nishi-Izu, ce sont les couchers de soleil sur Suruga, le Fuji en bonus à droite.\n\n!! **CE QUI PLAIDE CONTRE.** Izu Sud (Shimoda, les plages, Iro-zaki) est hors saison à vos dates : les plages ne sont plus surveillées après août, septembre est le mois le plus pluvieux et la péninsule est structurellement exposée aux typhons — routes côtières étroites, éboulements, bateaux annulés en premier. Une journée de typhon en Izu, c'est une journée enfermé ; à Kyoto on continue de visiter. Et le Fuji n'aura probablement pas de neige : la première coiffe est tombée début novembre en 2024 et fin octobre en 2025.\n\n>> **MA RECOMMANDATION : oui, mais 2 nuits, pas plus, et sur un seul axe — Nishi-Izu puis Shuzenji.** Nuit 1 à Toi ou Heda pour le coucher de soleil sur la baie et le Fuji au petit matin. Nuit 2 à Shuzenji, où l'on sort en yukata le soir faire le bambou illuminé et le pont Katsura — et c'est là que le bambou reprend du sens, parce qu'on y dort déjà. Puis Joren Falls et son wasabi-don en déjeuner sur la route de Hakone. Le tour complet de la péninsule (3-4 nuits, 200 km, 5 h de volant) est un mauvais calcul à cette saison.\n\n**OÙ PRENDRE CES DEUX NUITS : sur Tokyo.** Vous avez 8 nuits de Tokyo sur 24, soit un tiers du voyage dans une ville que vous reverrez. Quatre au début et deux à la fin suffisent. Ne touchez ni à Kyoto (5 nuits, c'est juste, il y a Nara, Himeji et Osaka dedans), ni à Kanazawa (2 nuits est le plancher), ni surtout aux Alpes (6 nuits pour 5 lieux, c'est déjà tendu, et le festival est une date fixe).\n\n**ET LES QUATRE RYOKANS D'IZU DANS TOUT ÇA ?** Ils sont une raison de choisir **où dormir** en Izu, pas une raison d'y aller. Ils sont dans quatre zones différentes, on ne peut pas en enchaîner deux sans traverser la péninsule. Si vous faites Izu : **Musōan Biwa** à Toi pour la nuit paysage, **Arai Ryokan** à Shuzenji pour la nuit patrimoine. Tōfuya est un resort isolé dans un hameau où l'on ne sort pas — magnifique, mais contraire à votre façon de voyager. Izu no Hana est sur la côte est, incompatible avec l'axe ouest."},{"k":"🥋 Voir du sumo — trois portes d'entrée","v":"Vous ne cherchez pas un billet de tournoi cher, et c'est une bonne nouvelle : il existe mieux. Trois pistes, par ordre de qualité.\n\n• LE JUNGYO (tournée régionale d'automne) : du 6 au 25 octobre, la Japan Sumo Association part en tournée. Une journée de jungyo (tournée régionale), c'est 8h30-14h30, avec DEUX HEURES D'ENTRAÎNEMENT PUBLIC de 9 h à 11 h — tous les lutteurs, à quelques mètres — puis les combats, le shokkiri (sumo comique), les chants jinku, une démonstration de coiffure oicho-mage (le chignon en feuille de ginkgo) et le dohyo-iri (l'entrée cérémonielle) des yokozuna (le rang suprême).\n\nGradins de 4 000 à 8 000 ¥. C'est plus complet qu'une journée de tournoi, et bien moins cher.\n\nSur votre route : **MATSUMOTO LE SAMEDI 10 OCTOBRE**, Imizu le 11, Kanazawa le 12, Takayama le 14.\n\n• LES BILLETS DU JOUR AU KOKUGIKAN (l'arène nationale de sumo à Tokyo) pendant votre séjour de septembre : le guichet vend des sièges D à 2 500 ¥ le matin même quand la journée n'est pas complète. Vérifiez l'état des stocks sur md.pia.jp/sumo/vacant, mis à jour à 11 h et 17 h, et présentez-vous tôt.\n• ARASHIO-BEYA (une écurie de sumo de Nihonbashi) : on observe l'entraînement GRATUITEMENT depuis la rue, à travers une grande baie vitrée, sans réservation, entre 7h30 et 9 h. Aucun risque, aucun coût, on passe et on regarde.\n\n!! ⚠️ En revanche l'asa-geiko (l'entraînement du matin à l'intérieur d'une écurie) est impossible sur vos deux fenêtres : en septembre les lutteurs combattent au basho (le tournoi officiel), en octobre ils sont partis en jungyo. C'est précisément pour ça que le jungyo est la bonne réponse."},{"k":"⚠️ Le permis de conduire — à traiter AUJOURD'HUI","v":"Le permis international français N'EST PAS reconnu au Japon (la France délivre des permis Vienne 1968, le Japon ne reconnaît que Genève 1949) — l'ambassade de France le dit noir sur blanc. Il faut une TRADUCTION OFFICIELLE en japonais, à porter avec le permis original et le passeport.\n\nDepuis avril 2025 le JAF est 100 % en ligne, ne peut PAS être saisi depuis l'étranger, et annonce 2-3 jours ouvrés (le PDF officiel dit 1-2 semaines). Or vous atterrissez le 21/09 en pleine Silver Week (pont férié de cinq jours) : les 21, 22 et 23 sont fériés, il ne reste que jeudi 24 et vendredi 25 avant de prendre la voiture le samedi 26.\n\nLe JAF seul est un pari perdant.\n\n**LA SOLUTION** : ALADDIN, organisme également agréé par la Commission nationale de sécurité publique, à Minato-ku — 5 000 ¥, délivrance le lendemain ouvré, et émission d'urgence en 1 heure possible. Écrivez-leur dès aujourd'hui à info@aladdin.or.jp en précisant votre date d'arrivée et le retrait souhaité les 24 ou 25/09."},{"k":"🚗 La voiture du 26 septembre — votre question","v":"Vous demandez s'il faut louer à Tokyo trois jours et rendre à Tokyo, ou rendre plus loin en payant le double. **La prémisse est fausse : rendre ailleurs ne coûte pas le double.**\n\nChez **Toyota**, les frais d'aller simple sont forfaitaires par zone, pas kilométriques. Tokyo → préfecture de Kanagawa, donc **Tokyo → Odawara, c'est environ 2 200 ¥**, soit treize euros. C'est négligeable. Ce qui coûte cher, c'est **Times**, qui facture au kilomètre : le même trajet y revient à 11 400 ¥. D'où la règle : **réservez chez Toyota en direct**, pas via un comparateur.\n\n**RENDRE À TOKYO EST LE MAUVAIS CHOIX.** Depuis Hakone, remonter rendre la voiture à Tokyo, c'est 80 km à rebours plus la traversée de la ville, pour ensuite reprendre le Shinkansen vers le sud-ouest. Or Odawara est **déjà sur la ligne du Tokaido Shinkansen** : Odawara → Kyoto met 2 h 20, Tokyo → Kyoto met 2 h 15. Vous perdriez une demi-journée pour gagner cinq minutes de train et économiser treize euros.\n\n!! **LE VRAI PROBLÈME DU SAMEDI 26, c'est le trafic.** Sortir de Tokyo vers le Fuji un samedi matin, c'est le pire créneau de la semaine : c'est exactement ce que font les Tokyoïtes. La Chuo Expressway se bouche. Deux parades, et la seconde est meilleure.\n\n>> **LA SOLUTION QUE JE RECOMMANDE : ne partez pas de Tokyo en voiture du tout.** Prenez le **bus direct Shinjuku → Kawaguchiko** le samedi matin — 1 h 45, environ 2 000 ¥, voie réservée, il ne subit pas le même embouteillage — et **louez sur place** : Toyota a une agence à la gare de Kawaguchiko. Vous arrivez au lac vers 10 h au lieu de midi, vous supprimez deux heures de conduite éprouvantes au lendemain du décalage horaire, et vous ne payez que deux ou trois jours de location au lieu de quatre. Restitution à Odawara le soir du J8 comme prévu, et Hakone le J9 au Hakone Free Pass.\n\n**L'AUTRE PARADE, si vous tenez à partir de Shinjuku :** récupérez la voiture à 7 h et roulez avant la vague. Mais avec le décalage horaire de la veille, c'est moins confortable que le bus."},{"k":"⚠️ Silver Week, vous arrivez dedans","v":"Du samedi 19 au mercredi 23 septembre : Keiro no Hi, jour de liaison et Équinoxe d'automne, soit cinq jours fériés consécutifs. Administrations fermées (d'où le problème du permis), hébergements et transports saturés.\n\nPoint positif inattendu : Tokyo est plutôt PLUS calme que d'habitude, les Japonais partent en province."},{"k":"⚠️ Sports Day, lundi 12 octobre","v":"Vous rendez la voiture à Nagano et prenez le Shinkansen (train à grande vitesse) pour Tokyo exactement le jour du retour de week-end de trois jours, juste après le festival de Takayama et au début des couleurs d'automne. C'est le pire créneau ferroviaire du mois.\n\nLa vente s'est ouverte le 12 septembre : ce billet est le plus urgent de tout le voyage."},{"k":"🗓️ Combien de nuits à Tokyo, et quel jour repartir","v":"Question ouverte, et il y a maintenant de vrais arguments. D'abord un point de fait : le 15 octobre est un JEUDI, pas un samedi.\n\nLe samedi, c'est le 17 — donc si vous ajoutez deux nuits au plan actuel, vous tombez effectivement sur un départ de samedi, à éviter. Les trois options propres : (A) JEUDI 15, le plan actuel, 8 nuits de Tokyo au total sur 24.\n\n(B) VENDREDI 16, une nuit de plus : d'après les données Expedia 2026, le vendredi est le jour de départ statistiquement le moins cher, environ 8 % sous le dimanche, qui est le plus cher. Une nuit gagnée, un peu de budget économisé, zéro contrainte.\n\n(C) LUNDI 19 OU MARDI 20, quatre à cinq nuits de plus — et c'est l'option qui a le meilleur argument, parce que le KAWAGOE MATSURI (le grand festival d'automne de Kawagoe) tombe le samedi 17 et le dimanche 18 octobre. Patrimoine immatériel UNESCO, 29 chars monumentaux à deux étages surmontés de poupées géantes, et surtout le hikkawase, l'affrontement nocturne des chars face à face à la lumière des lanternes, orchestres qui se défient.\n\nÀ 30 minutes d'Ikebukuro. Un million de visiteurs.\n\nC'est le même registre que le festival de Takayama, et vous seriez à côté sans le voir. Deuxième argument pour cette option : la Climax Series (les play-offs de baseball) se joue du 14 au 20 octobre, et si les Yomiuri Giants finissent premiers de leur ligue, la finale se joue au Tokyo Dome sur exactement ces dates.\n\nMon avis : partir le lundi 19 ou le mardi 20. Ne partez ni le dimanche 18 (le jour le plus cher) ni le samedi 17 (jour du festival).\n\n**ET SI VOUS AJOUTEZ IZU**, l'équation change : les deux nuits d'Izu se prennent sur Tokyo, donc 4 nuits au début et 2 à la fin. Dans ce cas, prolonger jusqu'au 19 ou 20 octobre redevient très tentant, parce que ça vous rend les nuits de fin **et** vous met sur le Kawagoe Matsuri.\n\n**LE KAWAGOE MATSURI, EN DÉTAIL, puisqu'il faut trancher.** Samedi 17 et dimanche 18 octobre. Patrimoine culturel immatériel de l'UNESCO. Vingt-neuf **dashi** (chars monumentaux à deux étages) surmontés de poupées géantes, tirés dans le quartier des **kurazukuri** (entrepôts en terre de l'époque Edo). Le clou est le **hikkawase** : à la nuit tombée, les chars se croisent et s'arrêtent face à face, et les orchestres se défient à la lumière des lanternes jusqu'à ce que l'un cède. Un million de visiteurs, 30 minutes d'Ikebukuro par la Tobu Tojo, trains supplémentaires prévus, et **c'est gratuit**. C'est exactement le même registre que le festival de Takayama — sauf que celui-là, vous seriez à trente minutes sans le voir.\n\n**AUTRE ARGUMENT POUR LA FIN OCTOBRE :** la Climax Series (les demi-finales du championnat de baseball) se joue du 14 au 20 octobre, et si les Yomiuri Giants finissent premiers de leur ligue, la finale se joue au Tokyo Dome sur exactement ces dates."},{"k":"✈️ Le vol vers l'Indonésie","v":"Un seul vol direct vers Bali : Garuda Indonesia GA881, Narita → Denpasar, quotidien, départ 11 h 00, 7 h 30 de vol. Aucun direct depuis Haneda.\n\nJakarta est en revanche très bien desservi — six vols par jour, ANA et Garuda depuis Haneda, JAL et ANA depuis Narita, environ 8 h — et « Jakarta + un vol intérieur vers Denpasar » est souvent moins cher et bien plus souple que le direct. Aucun jour n'est à proscrire entre le 12 et le 25 octobre : la Golden Week chinoise (1er au 7 octobre) est passée, l'Indonésie n'a aucun jour férié en octobre, et il n'y a pas de fête balinaise majeure.\n\nDeux réflexes seulement : éviter le dimanche, et ne pas partir le 12 (jour férié japonais, transferts vers Narita saturés)."},{"k":"Shinkansen — la règle et le piège","v":"Vente ouverte exactement 1 mois avant, à 10h00 JST. Mais eki-net (JR East) et smartEX acceptent un PRÉ-DÉPÔT dès J-37 à 14h00, traité automatiquement à J-30 : c'est la seule façon d'être compétitif sur un train saturé.\n\nVos trajets Hokuriku (Kyoto→Kanazawa, Nagano→Tokyo) sont sur eki-net JR East ; le Kagayaki (le Shinkansen le plus rapide) est à 100 % réservé, sans voiture libre — sans réservation, vous ne montez pas, le Hakutaka (Shinkansen plus lent, avec voitures libres) est votre secours. Piège : les trois plateformes exigent le 3-D Secure 2.0, activez-le auprès de votre banque avant et assurez-vous de recevoir les SMS à l'étranger."},{"k":"JR Pass — écarté, et c'est juste","v":"Cinq trajets longue distance dans le séjour : environ 200 €/pers à l'unité contre 294 €/pers pour le pass 7 jours. Votre arbitrage est bon.\n\nAchetez à l'unité via smartEX (Tokaido) et eki-net (Hokuriku), IC card (carte de transport sans contact) Suica (carte de transport rechargeable) pour tout le reste."},{"k":"Louer la voiture — les trois pièges","v":"1) La carte ETC (télépéage) doit être demandée À LA RÉSERVATION, pas au comptoir : ~330 ¥ pour toute la location, les péages sont cumulés et réglés à la restitution. Un touriste ne peut pas en obtenir une autrement.\n\n• Prenez systématiquement l'option NOC / « Anshin » (~550-1 100 ¥/jour) : sans elle, une pénalité d'immob
