function ctx(){
  return "Tu es le copilote de voyage de deux routards français partis 4 mois en Asie, du 20 septembre 2026 "+
  "à fin janvier 2027. Profil : hébergements économiques par défaut, quelques nuits d'exception assumées, "+
  "rythme dense, 1 à 3 nuits par lieu et 5 à 7 dans une grande ville. Ils veulent un équilibre entre nature, "+
  "snorkeling SANS certification de plongée, temples et food. Ils gèrent le budget eux-mêmes : ne construis "+
  "PAS ton analyse autour des prix, raisonne logistique, saison, rythme et expérience.\n"+
  "RÈGLES DE RÉDACTION, à respecter absolument : (1) chaque fois que tu emploies un mot japonais ou un terme "+
  "local, ajoute immédiatement entre parenthèses deux ou trois mots qui disent ce que c'est ; (2) écris en "+
  "paragraphes courts séparés par une ligne vide, mets en **gras** les mots-clés, et utilise des puces « • » "+
  "quand tu énumères ; (3) sois direct et tranché, pas d'introduction ni de conclusion de politesse.\n"+
  "Nous sommes le "+dy(today())+".\n\n";
}
function blocDigest(b){
  return (b.days||[]).map(function(x){
    return (x.n||"")+" · "+(x.date?dw(x.date)+" · ":"")+(x.title||"")+"\n"+
    (x.program||[]).map(function(p){return "   - "+p;}).join("\n")+
    (x.sleep?"\n   Dormir : "+x.sleep:"")+(x.food?"\n   Manger : "+x.food:"")+
    (x.tip?"\n   ⚠ "+plain(x.tip,400):"");}).join("\n\n").slice(0,9000);
}
function countryDigest(c){
  return (c.blocs||[]).slice().sort(by("order")).map(function(b){
    return "["+(b.code||"")+"] "+b.title+" — "+dy(b.d1)+" → "+dy(b.d2)+", "+(b.nights||0)+
    " nuits, base "+(b.base||"?")+", transport "+(b.transport||"?")+", statut "+(STATUS[b.status]||STATUS.idee).l+
    (b.why?"\n   "+plain(b.why,400):"")+
    ((b.days||[]).length?"\n   Jours : "+b.days.map(function(x){return (x.n||"")+" "+(x.title||"");}).join(" | "):"");
  }).join("\n\n").slice(0,11000);
}
function tripDigest(){
  return S.countries.slice().sort(by("order")).map(function(c){
    return "### "+c.name+" — "+dy(c.d1)+" → "+dy(c.d2)+" ("+(c.nights||0)+" nuits)\n"+
    (c.blocs||[]).slice().sort(by("order")).map(function(b){
      return "- ["+(b.code||"")+"] "+b.title+" : "+(b.nights||0)+"n, "+d(b.d1)+"→"+d(b.d2)+", "+
      (b.transport||"?")+", "+(STATUS[b.status]||STATUS.idee).l;}).join("\n");
  }).join("\n\n").slice(0,13000);
}

/* ============ DEMANDER À CLAUDE ============ */
function askBox(contextFn,suggestions,label){
  var w=el('<div class="askbox"><div class="ah">'+I.spark+"Demander à Claude ou ChatGPT"+(label?" · "+esc(label):"")+"</div>"+
    '<div class="askrow"><textarea placeholder="Posez votre question, ou demandez une action…"></textarea>'+
    '<button type="button" class="btn ask" style="padding:11px 14px">→</button></div>'+
    '<div class="sugg"></div></div>');
  var ta=w.querySelector("textarea"), go=w.querySelector("button");
  function send(q){
    if(!q) return;
    runSample(q.length>48?q.slice(0,46)+"…":q, ctx()+contextFn()+"\n\n---\n\nLa demande : "+q);
  }
  go.onclick=function(){var q=ta.value.trim();if(!q){toast("Écrivez votre demande.");return;}ta.value="";send(q);};
  ta.onkeydown=function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();go.click();} };
  (suggestions||[]).forEach(function(s){
    var b=el("<button type=\"button\">"+esc(s)+"</button>");
    b.onclick=function(){send(s);};
    w.querySelector(".sugg").appendChild(b);});
  return w;
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){toast("Copié.");},
      function(){toast("Copie refusée — sélectionnez le texte à la main.");});
  }
  toast("Copie indisponible — sélectionnez le texte à la main.");
  return Promise.resolve();
}
function runSample(title,prompt){
  var w=el("<div></div>");
  w.appendChild(el('<p class="muted" style="font-size:13px;margin:0 0 12px;line-height:1.5">'+
    "Copiez ce texte, collez-le dans <strong>Claude</strong> ou <strong>ChatGPT</strong> sur votre téléphone. "+
    "Pour que la réponse revienne toute seule dans l'app, terminez votre message par : "+
    "<em>« et donne-moi la mise à jour au format patch JSON de l'app »</em>, puis collez sa réponse dans "+
    "la pastille de synchronisation, en haut.</p>"));
  var pre=el('<textarea class="promptbox" readonly></textarea>');
  pre.value=prompt;
  w.appendChild(pre);
  var cp=el('<button type="button" class="btn wide ask" style="margin-top:12px">Copier la demande</button>');
  cp.onclick=function(){copy(prompt);};
  w.appendChild(cp);
  var pb=el('<button type="button" class="btn wide" style="margin-top:8px">Coller la réponse</button>');
  pb.onclick=function(){patchSheet();};
  w.appendChild(pb);
  openSheet(title,w);
}

  S.guide.slice().sort(by("order")).forEach(function(g){
    h.push("<h3>"+esc((g.icon||"")+" "+g.title)+"</h3>");
    (g.sections||[]).forEach(function(s){h.push("<h4>"+esc(s.k)+"</h4><p>"+esc(plain(s.v))+"</p>"+
      (s.url?"<p class='m'>"+esc(s.url)+"</p>":"")); });});
  h.push("</body></html>");
  try{
    var blob=new Blob([h.join("")],{type:"text/html;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="asian-roadtrip-"+today()+".html";a.rel="noopener";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);
    toast("Téléchargé. Il s'ouvre sans réseau.");
  }catch(e){ toast("Téléchargement impossible sur ce navigateur."); }
}

/* ============ FEUILLE ============ */
function openSheet(title,node,onClose){
  closeSheet();
  var sc=el('<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">'+
    "<header><h3>"+esc(title)+'</h3><button type="button" class="x">'+I.x+"</button></header>"+
    '<div class="body"></div></div></div>');
  sc.querySelector(".body").appendChild(node);
  sc.querySelector(".x").onclick=function(){closeSheet();if(onClose)onClose();};
  sc.onclick=function(e){if(e.target===sc){closeSheet();if(onClose)onClose();}};
  document.getElementById("sheet-root").appendChild(sc);
  S.sheet=sc;document.body.style.overflow="hidden";
}
function closeSheet(){if(S.sheet){S.sheet.remove();S.sheet=null;}document.body.style.overflow="";}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
window.addEventListener("scroll",function(){
  document.getElementById("topbar").classList.toggle("stuck",window.scrollY>6);},{passive:true});

/* ============ PASTILLE DE SYNCHRONISATION ============ */
var SYNCL={boot:"…",ok:"à jour",dirty:"…",push:"envoi…",
  offline:"hors ligne",auth:"refusé",local:"non relié"};
var SYNCLONG={boot:"Connexion…",ok:"À jour",dirty:"Enregistrement…",push:"Envoi en cours…",
  offline:"Hors ligne",auth:"Accès refusé",local:"Ce téléphone seul"};
function syncUI(){
  var b=document.getElementById("syncbtn");
  if(!b)return;
  b.className="syncpill s-"+ST.state;
  b.innerHTML='<span class="sd"></span>'+esc(SYNCL[ST.state]||"");
}
function ago(t){
  if(!t)return "jamais";
  var s=Math.round((Date.now()-t)/1000);
  if(s<60)return "à l'instant";
  if(s<3600)return "il y a "+Math.round(s/60)+" min";
  if(s<86400)return "il y a "+Math.round(s/3600)+" h";
  return "il y a "+Math.round(s/86400)+" j";
}
function row(k,v){
  var r=el('<div class="setrow"><span class="sk">'+esc(k)+'</span><span class="sv"></span></div>');
  var sv=r.querySelector(".sv");
  if(typeof v==="string")sv.textContent=v; else sv.appendChild(v);
  return r;
}
function syncSheet(){
  var w=el("<div></div>");

  if(ST.state==="auth"||ST.state==="local"){
    w.appendChild(el('<div class="banner" style="margin-bottom:14px">'+
      esc(ST.state==="auth"?ST.err:
      "Rien n'est partagé pour l'instant : les modifications restent sur ce téléphone. "+
      "Ouvrez le lien secret du voyage pour relier l'app au carnet partagé.")+"</div>"));
  }

  w.appendChild(row("État", (SYNCLONG[ST.state]||"")+" · dernière synchro "+ago(ST.last)));
  w.appendChild(row("Carnet partagé", GH.token?(GH.owner+"/"+GH.repo):"non relié"));

  var nameIn=el('<input type="text" placeholder="Votre prénom" style="width:100%;padding:9px 10px;'+
    'border:1px solid var(--line);border-radius:9px;background:var(--paper2);color:var(--ink);font-size:14px">');
  nameIn.value=ST.me||"";
  nameIn.onchange=function(){ST.me=nameIn.value.trim();
    try{localStorage.setItem("ar-me",ST.me);}catch(e){}
    toast(ST.me?("Bonjour "+ST.me+"."):"Prénom effacé.");};
  w.appendChild(row("Qui modifie", nameIn));

  var acts=el('<div style="display:flex;flex-direction:column;gap:8px;margin-top:18px"></div>');

  var b1=el('<button type="button" class="btn wide ask">Coller une mise à jour de Claude</button>');
  b1.onclick=function(){patchSheet();};
  acts.appendChild(b1);

  var b2=el('<button type="button" class="btn wide">Synchroniser maintenant</button>');
  b2.onclick=function(){
    if(!GH.token){toast("Aucun carnet partagé relié.");return;}
    clearTimeout(ST.timer);
    if(ST.state==="dirty"||ST.state==="offline"){push();toast("Envoi en cours…");}
    else pull(true).then(function(){toast("Synchronisé.");});
  };
  acts.appendChild(b2);

  var b3=el('<button type="button" class="btn wide">Relier au carnet partagé</button>');
  b3.onclick=function(){linkSheet();};
  acts.appendChild(b3);

  var b4=el('<button type="button" class="btn wide">Télécharger le guide hors ligne</button>');
  b4.onclick=exportAll;
  acts.appendChild(b4);

  w.appendChild(acts);
  w.appendChild(el('<p class="muted" style="font-size:12px;margin-top:16px;line-height:1.5">'+
    "L'app garde tout sur ce téléphone et renvoie les changements au carnet partagé dès qu'il y a du réseau. "+
    "À deux sur la même étape, c'est la modification la plus récente qui gagne.</p>"));
  openSheet("Synchronisation",w);
}
function linkSheet(){
  var w=el("<div></div>");
  w.appendChild(el('<p class="muted" style="font-size:13px;margin:0 0 12px;line-height:1.5">'+
    "Collez ici le <strong>lien secret</strong> du voyage (ou juste sa clé). Il relie ce téléphone au carnet "+
    "partagé : tout ce que l'un modifie apparaît chez l'autre.</p>"));
  var ta=el('<textarea class="promptbox" style="min-height:90px" placeholder="https://…/#t=…"></textarea>');
  w.appendChild(ta);
  var ok=el('<button type="button" class="btn wide ask" style="margin-top:12px">Relier</button>');
  ok.onclick=function(){
    if(!readLink(ta.value.trim())){toast("Lien non reconnu.");return;}
    closeSheet();setState("boot");
    pull(true).then(function(){if(ST.state==="ok")toast("Relié au carnet partagé.");});
  };
  w.appendChild(ok);
  if(GH.token){
    var cp=el('<button type="button" class="btn wide" style="margin-top:8px">Copier le lien secret</button>');
    cp.onclick=function(){copy(location.origin+location.pathname+"#o="+encodeURIComponent(GH.owner)+
      "&r="+encodeURIComponent(GH.repo)+"&t="+encodeURIComponent(GH.token));};
    w.appendChild(cp);
    var out=el('<button type="button" class="btn wide" style="margin-top:8px;color:var(--crit)">Délier ce téléphone</button>');
    out.onclick=function(){GH.token="";ghSave();closeSheet();setState("local");toast("Téléphone délié.");};
    w.appendChild(out);
  }
  w.appendChild(el('<p class="muted" style="font-size:12px;margin-top:14px;line-height:1.5">'+
    "Ce lien est la seule clé : qui l'a peut tout lire et tout modifier. Ne le postez nulle part.</p>"));
  openSheet("Carnet partagé",w);
}
function patchSheet(){
  var w=el("<div></div>");
  w.appendChild(el('<p class="muted" style="font-size:13px;margin:0 0 12px;line-height:1.5">'+
    "Collez ici le bloc <strong>JSON</strong> que Claude ou ChatGPT vous a donné. L'app l'applique au voyage "+
    "et le renvoie à l'autre téléphone.</p>"));
  var ta=el('<textarea class="promptbox" placeholder=\'{"patch":[{"col":"bookings","id":"b57","set":{"title":"…"}}]}\'></textarea>');
  w.appendChild(ta);
  var ok=el('<button type="button" class="btn wide ask" style="margin-top:12px">Appliquer</button>');
  ok.onclick=function(){
    var r=applyPatch(ta.value);
    if(r.err){toast(r.err);return;}
    closeSheet();render();
    toast(r.n+(r.n>1?" modifications appliquées.":" modification appliquée.")+
      (r.skipped&&r.skipped.length?(" "+r.skipped.length+" ignorée(s)."):""));
  };
  w.appendChild(ok);
  var sp=el('<button type="button" class="btn wide" style="margin-top:8px">Copier le mode d\'emploi pour l\'IA</button>');
  sp.onclick=function(){copy(PATCHDOC);};
  w.appendChild(sp);
  openSheet("Mise à jour",w);
}
var PATCHDOC=
"Voici comment renvoyer une modification dans mon app de voyage. Réponds-moi avec UNIQUEMENT un bloc JSON "+
"de cette forme, sans texte autour :\n\n"+
'{"patch":[\n'+
'  {"col":"bookings","id":"b57","set":{"title":"Réserver le ryokan de Hakone","detail":"…","cat":"loge",'+
'"due":"2026-09-18","crit":true,"tags":["Japon"],"order":570}},\n'+
'  {"col":"guide","id":"sumo","set":{"sections":[{"k":"Titre du point","v":"Texte…"}]}},\n'+
'  {"col":"bookings","id":"b30","del":true}\n'+
"]}\n\n"+
"Règles : col vaut countries, bookings, guide, stays ou inbox. id est celui du document existant, ou un "+
"nouvel identifiant court pour en créer un. set remplace les champs cités et laisse les autres intacts. "+
"del:true supprime. Dans les textes, **gras**, puces avec «  • », !! pour un avertissement, >> pour un "+
"point clé, et deux ou trois mots entre parenthèses après chaque terme japonais.";

/* ============ DÉMARRAGE ============ */
function boot(){
  loadCfg();
  S.maps=[];
  try{var mc=JSON.parse(localStorage.getItem("ar-maps")||"null");if(mc&&mc.maps)S.maps=mc.maps;}catch(e){}
  if(!S.maps.length){
    fetch("maps.json",{cache:"force-cache"}).then(function(r){return r.ok?r.json():null;})
     .then(function(j){ if(!j||!j.maps)return;
       S.maps=j.maps;
       try{localStorage.setItem("ar-maps",JSON.stringify({maps:j.maps}));}catch(e){}
       render(); })
     .catch(function(){});
  }
  if(!cacheLoad()){ try{mergeTrip(SEED,false);}catch(e){} }
  S.ready=true;
  setState(GH.token?"boot":"local");
  render();
  document.getElementById("syncbtn").onclick=syncSheet;
  if(GH.token){
    pull(true);
    ST.poll=setInterval(function(){if(!document.hidden)pull();},30000);
    document.addEventListener("visibilitychange",function(){
      if(!document.hidden){ if(ST.state==="dirty"||ST.state==="offline")push(); else pull(); }});
    window.addEventListener("online",function(){ if(ST.state==="offline")push(); else pull(); });
  }
}
boot();
})();
