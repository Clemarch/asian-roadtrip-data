ilisation de 20 000 à 50 000 ¥ s'applique en cas de sinistre, même sans faute. Sur les routes de montagne de Hakone et d'Okuhida, ce n'est pas négociable.\n• Réservez chez Toyota EN DIRECT : leurs frais d'aller simple sont forfaitaires (Tokyo → Kanagawa ≈ 2 200 ¥, dérisoire) alors que Times facture au kilomètre (≈ 11 400 ¥ pour le même trajet). Pour Kanazawa → Nagano, faites tourner le simulateur officiel Toyota : l'estimation est de 15 000 à 25 000 ¥, et si ça dépasse 20 000 ¥, deux locations aller-retour avec jonction en Shinkansen (1 h) reviennent moins cher."},{"k":"Réserver les attractions — les fenêtres","v":"**SHIBUYA SKY** : réservable seulement 14 jours à l'avance, jusqu'à la veille. Les créneaux coucher de soleil partent en quelques heures, et s'il n'y a rien en ligne il n'y a rien au guichet — aucun stock walk-up.\n\nAnnulation gratuite jusqu'à la veille : réservez large dès l'ouverture. teamLab PLANETS : jusqu'à 3 mois à l'avance, tarification dynamique, créneau imposé mais l'entrée reste possible le même jour si vous le ratez.\n\n!! ⚠️ Fermé le jeudi 1er octobre. teamLab BORDERLESS : mise en vente le 1er de chaque mois pour M+2, donc fin septembre est en vente depuis le 1er août."},{"k":"Météo et couleurs","v":"Fin de saison des typhons, en net retrait en octobre. Doux fin septembre, plus frais début octobre.\n\nLe koyo (les couleurs d'automne) ne concerne que l'altitude à vos dates : Kamikochi et Norikura début octobre, et surtout le lac Chuzenji à Nikko le 13/10, qui tombe pile au pic — c'est votre meilleure journée de couleurs. Kyoto sera vert, c'est normal, son koyo est fin novembre.\n\nNuits à 8-10 °C à Takayama et Hirayu."},{"k":"Argent","v":"Le cash reste roi hors des grandes chaînes. Seuls les ATM Seven Bank (7-Eleven, 24/7, 21 000 points, interface en français, ~110 ¥ par retrait) et Japan Post acceptent les cartes étrangères — Mizuho, SMBC et MUFG les refusent.\n\nInstallez Suica (carte de transport rechargeable) dans Apple Wallet depuis la France : les Visa étrangères sont souvent refusées pour la recharge, Mastercard et Amex passent mieux."}],"tagline":"Boucle Tokyo → Fuji → Kyoto → Kanazawa → Alpes → Tokyo, calée pour attraper le festival de Takayama les 9 et 10 octobre.","id":"jp","_m":1789344000000},{"arriveBy":"Vol Tokyo → Jakarta","blocs":[{"alert":"","base":"Java ouest","code":"A","d1":"2026-10-16","d2":"2026-10-17","days":[],"geo":[[-6.208,106.846,"Jakarta"]],"id":"id01","nights":1,"order":10,"sleep":"","status":"idee","title":"Jakarta","transport":"Vol","transportNote":"","via":"vol depuis Naha via Tokyo ou KIX · arrivée CGK","viaMode":"vol","why":"Une nuit, pas plus : Kota Tua et Glodok, le temps d'atterrir et d'attraper le train du lendemain matin."},{"alert":"","base":"Java centre","code":"B","d1":"2026-10-17","d2":"2026-10-22","days":[],"geo":[[-7.797,110.37,"Yogyakarta"]],"id":"id02","nights":5,"order":20,"sleep":"","status":"idee","title":"Yogyakarta","transport":"Train","transportNote":"","via":"~7 h · KAI Argo depuis Gambir","viaMode":"train","why":"Borobudur au lever depuis Punthuk Setumbu, Prambanan, Kotagede et son argenterie. Food : gudeg (le jackfruit mijoté de Yogyakarta), marchés de nuit.\n\nEt la plage de Timang avec son téléphérique artisanal au-dessus des rouleaux."},{"alert":"","base":"Java centre","code":"C","d1":"2026-10-22","d2":"2026-10-23","days":[],"geo":[[-7.204,109.908,"Dieng"]],"id":"id03","nights":1,"order":30,"sleep":"","status":"idee","title":"Plateau de Dieng","transport":"Bus","transportNote":"","via":"~4 h · base Wonosobo","viaMode":"bus","why":"Les temples hindous les plus anciens de Java sur un plateau volcanique à 2 000 m, lacs colorés, fumerolles. Optionnel si vous préférez rallonger Yogya."},{"alert":"","base":"Cemoro Lawang, Java est","code":"D","d1":"2026-10-23","d2":"2026-10-25","days":[],"geo":[[-7.942,112.953,"Bromo"]],"id":"id04","nights":2,"order":40,"sleep":"","status":"idee","title":"Bromo","transport":"Train","transportNote":"","via":"train + jeep · via Malang ou Probolinggo","viaMode":"train","why":"Lever de soleil au King Kong Hill, puis traversée de la mer de sable jusqu'au cratère. Deux nuits pour avoir une seconde chance si le premier matin est bouché."},{"alert":"","base":"Banyuwangi, Java est","code":"E","d1":"2026-10-25","d2":"2026-10-27","days":[],"geo":[[-8.058,114.242,"Ijen"]],"id":"id05","nights":2,"order":50,"sleep":"","status":"idee","title":"Ijen","transport":"Train","transportNote":"","via":"~5 h · depuis Probolinggo","viaMode":"train","why":"Départ à 1 h du matin pour les flammes bleues, puis le lac turquoise au lever. Deuxième nuit possible à Baluran, la savane africaine de Java : buffles sauvages, paons, plage de Bama, quasi aucun étranger."},{"alert":"","base":"Bali nord-ouest","code":"F","d1":"2026-10-27","d2":"2026-10-31","days":[],"geo":[[-8.144,114.657,"Pemuteran"]],"id":"id06","nights":4,"order":60,"sleep":"","status":"idee","title":"Pemuteran / Menjangan","transport":"Ferry","transportNote":"","via":"ferry 1 h + route 1 h · Ketapang → Gilimanuk","viaMode":"ferry","why":"Le snorkeling numéro un du pays et la côte la moins arrosée de Bali. Menjangan : mur de corail qui démarre à 3-5 m sous la surface, côte nord abritée, mer plate et visibilité stable même en début de saison humide.\n\nEt le Biorock Reef de Pemuteran, récif artificiel régénéré accessible depuis la plage."},{"alert":"","base":"Bali est","code":"G","d1":"2026-10-31","d2":"2026-11-03","days":[],"geo":[[-8.338,115.657,"Amed"]],"id":"id07","nights":3,"order":70,"sleep":"","status":"idee","title":"Amed / Tulamben","transport":"Route","transportNote":"","via":"~3 h · route côtière nord","viaMode":"taxi","why":"L'épave de l'USAT Liberty à Tulamben : elle commence à 3-5 m, le pont supérieur se voit parfaitement en apnée de surface depuis la plage de galets. Y aller avant 8 h.\n\nJemeluk Bay et l'épave japonaise à Amed, faciles depuis le bord. Les rizières de Sidemen à 1 h pour respirer."},{"alert":"","base":"Bali sud-est","code":"H","d1":"2026-11-03","d2":"2026-11-06","days":[],"geo":[[-8.727,115.544,"Nusa Penida"]],"id":"id08","nights":3,"order":80,"sleep":"","status":"idee","title":"Nusa Penida","transport":"Bateau","transportNote":"","via":"30-45 min · fast boat depuis Sanur","viaMode":"bateau","why":"Mantas en surface toute l'année à Manta Bay, et les falaises.\n\n**ATTENTION** : Manta Point est exposé à la houle sud, les sorties sont annulées certains jours et c'est plus fréquent en novembre — toujours avec opérateur et gilet. Crystal Bay et Gamat Bay sont très beaux mais ont de vrais courants : n'y allez jamais seuls."},{"alert":"","base":"Bali centre","code":"I","d1":"2026-11-06","d2":"2026-11-08","days":[],"geo":[[-8.507,115.263,"Ubud"]],"id":"id09","nights":2,"order":90,"sleep":"","status":"idee","title":"Ubud","transport":"Bateau","transportNote":"","via":"bateau + route 1 h","viaMode":"bateau","why":"Décompression avant Flores. Marché, Campuhan Ridge au lever, rizières de Tegallalang tôt.\n\nDépart du vol pour Labuan Bajo depuis Denpasar."},{"alert":"","base":"Flores ouest","code":"J","d1":"2026-11-08","d2":"2026-11-09","days":[],"geo":[[-8.487,119.888,"Labuan Bajo"]],"id":"id10","nights":1,"order":100,"sleep":"","status":"idee","title":"Labuan Bajo","transport":"Vol","transportNote":"","via":"1 h 20 · DPS → LBJ, plusieurs vols/jour","viaMode":"vol","why":"Nuit de transition avant d'embarquer. Réservez le bateau Komodo depuis ici ou en amont."},{"alert":"","base":"Parc national de Komodo","code":"K","d1":"2026-11-09","d2":"2026-11-11","days":[],"geo":[[-8.553,119.489,"Komodo"]],"id":"id11","nights":2,"order":110,"sleep":"","status":"idee","title":"Bateau Komodo","transport":"Bateau","transportNote":"","via":"3 jours / 2 nuits · à bord","viaMode":"bateau","why":"Padar, Komodo, Pink Beach, Manta Point à Karang Makassar, Siaba Besar pour les tortues, Taka Makassar, Kanawa. Encore très bon début-mi novembre, et la saison des mantas commence justement en novembre-décembre.\n\nÀ EXCLURE formellement sans certification : Batu Bolong, Castle Rock, Crystal Rock — ce sont des sites de plongée à courant, pas de snorkel."},{"alert":"","base":"Flores centre","code":"L","d1":"2026-11-11","d2":"2026-11-16","days":[],"geo":[[-8.752,120.318,"Wae Rebo"]],"id":"id12","nights":5,"order":120,"sleep":"","status":"idee","title":"Wae Rebo","transport":"Route","transportNote":"","via":"5-6 h de route + 2 h 30 de marche · Labuan Bajo → Denge → Wae Rebo","viaMode":"taxi","why":"Hors des sentiers battus. Village Manggarai de sept maisons coniques à 1 200 m, accessible uniquement à pied, nuit collective chez l'habitant avec cérémonie d'accueil.\n\nEn novembre : vert éclatant, brume du matin, pluie possible l'après-midi. Nuit à Ruteng à l'aller ou au retour.\n\nRoutes sinueuses : comptez 30-40 km/h de moyenne réelle."},{"alert":"","base":"Bali sud","code":"M","d1":"2026-11-16","d2":"2026-11-17","days":[],"geo":[[-8.687,115.262,"Sanur"]],"id":"id13","nights":1,"order":130,"sleep":"","status":"book","title":"Sanur","transport":"Vol","transportNote":"","via":"1 h 20 · LBJ → DPS — nuit tampon obligatoire","viaMode":"vol","why":"Nuit tampon avant l'international. Ne sautez pas cette étape : aucun vol direct Labuan Bajo → Singapour, et un retard de vol intérieur indonésien ferait sauter votre vol pour Singapour."}],"color":"#C96A28","d1":"2026-10-16","d2":"2026-11-17","flag":"🇮🇩","name":"Indonésie","nights":32,"order":2,"practical":[{"k":"Saison — la règle qui commande tout","v":"La saison des pluies démarre à l'ouest en octobre et se généralise en novembre. L'itinéraire doit donc descendre Java → Bali est → Flores, jamais l'inverse.\n\nJava fin octobre : matinées claires, orages d'après-midi croissants — Borobudur, Bromo et Ijen restent jouables au lever. Bali centre et ouest deviennent aléatoires mi-novembre ; la côte est et nord (Amed, Pemuteran) reçoit nettement moins de pluie.\n\nFlores et Komodo restent la zone la plus sèche du pays sur votre fenêtre."},{"k":"Ce qu'on supprime, et pourquoi","v":"Sumatra nord (Bukit Lawang, Toba) : novembre est le pic annuel de pluies, pistes défoncées, orangs-outans planqués. Sulawesi : la mousson arrive.\n\nRinjani : théoriquement ouvert mais statut d'ouverture limitée en 2026 et boue garantie. Raja Ampat serait paradoxalement excellent mais coûte 2 vols et un ferry depuis Bali — non rentable sur 4 semaines."},{"k":"Visa — à faire avant de partir","v":"e-VOA 30 jours, prolongeable une fois de 30 jours, ~500 000 IDR. UNIQUEMENT sur evisa.imigrasi.go.id — tous les autres sites sont des intermédiaires payants.\n\nÀ utiliser dans les 90 jours suivant l'émission. Preuve de billet de sortie EXIGÉE explicitement par la procédure officielle : votre vol Indonésie → Singapour doit être réservé."},{"k":"Carte d'arrivée obligatoire","v":"All Indonesia Arrival Card, gratuite, sur allindonesia.imigrasi.go.id, à remplir dans les 3 jours précédant l'arrivée. Elle fusionne immigration, douane et santé : plus besoin de l'e-CD ni du SATUSEHAT séparément.\n\nEt n'oubliez pas la taxe touristique de Bali, 150 000 IDR par personne et par entrée sur l'île, sur lovebali.baliprov.go.id."},{"k":"Passeport","v":"Validité > 6 mois et pages vierges. L'Indonésie applique strictement le refus d'entrée pour passeport abîmé.\n\nOverstay : 1 000 000 IDR par jour."},{"k":"Transports","v":"Les trains KAI à Java sont le meilleur mode, très supérieurs aux bus de nuit : ouverture des ventes à J-45, ça part vite le week-end. Ferry Ketapang ↔ Gilimanuk toutes les heures, sans réservation.\n\nFast boats Sanur ↔ Nusa Penida : 30-45 min, mais annulations possibles si houle — ne calez JAMAIS un vol le jour du retour de Penida. Vols intérieurs : Lion Air a des retards structurels, ne le mettez jamais en correspondance serrée avec un international."},{"k":"Le piège de la fin","v":"Aucun vol direct Labuan Bajo → Singapour : il faut repasser par Denpasar. Prévoyez une nuit tampon à Sanur le 16/11.\n\nÀ DPS, domestique et international sont dans le même complexe mais il faut récupérer les bagages et changer de terminal à pied : comptez 3 h de battement."},{"k":"Sécurité","v":"Alcool frelaté : l'arak au méthanol cause cécité et décès. Ne buvez jamais de spiritueux servis en carafe, en particulier dans les hostels de Bali et des Gili.\n\nRage endémique chez les chiens ET les singes à Bali : toute morsure, griffure ou léchage de plaie impose lavage 15 min à l'eau savonneuse et consultation immédiate. Vérifiez le niveau d'alerte volcanique avant tout trek."},{"k":"Snorkeling sans certification","v":"• Menjangan Island (Bali Barat NP) — Le meilleur du séjour. Bateau 30 min depuis Pemuteran, mur de corail à 3-5 m sous la surface, côte nord abritée donc mer plate et visibilité stable même en début de saison humide.\n• USAT Liberty, Tulamben (Bali est) — Épave accessible depuis la plage de galets, commence à 3-5 m. Le pont supérieur se voit parfaitement en apnée de surface.\n\nY aller avant 8 h, avant les groupes de plongeurs.\n\n• Biorock Reef, Pemuteran (Bali nord-ouest) — Récif artificiel régénéré, très peu profond, depuis la plage. Idéal en fin de journée.\n• Jemeluk Bay & épave japonaise (Amed) — Depuis la plage, jardins de coraux, épave à 5-10 m. Facile, sans bateau.\n• Manta Bay / Manta Point (Nusa Penida) — Mantas en surface toute l'année, gilet obligatoire. Point exposé à la houle sud : sorties annulées certains jours, plus fréquent en novembre.\n\nToujours avec opérateur.\n\n• Crystal Bay / Gamat Bay (Nusa Penida) — Très beau MAIS courants réels. N'y allez jamais seuls, uniquement avec un opérateur.\n• Pink Beach & Taka Makassar (Komodo) — Inclus dans le boat trip. Fonds peu profonds, sans courant, parfaits en snorkel.\n• Siaba Besar (Komodo) — La baie aux tortues. Peu profond et abrité."},{"k":"Les spots à ne pas rater","v":"• Baluran National Park (Java est) — La savane africaine de Java, entre Ijen et le ferry de Ketapang. Buffles sauvages, paons, plage de Bama.\n\nUne nuit à Bekol, quasi aucun étranger.\n\n• Wae Rebo (Flores) — Sept maisons coniques Manggarai à 1 200 m, 2 h 30 de montée depuis Denge, nuit collective chez l'habitant avec cérémonie d'accueil.\n• Punthuk Setumbu (Yogyakarta) — Le point de vue sur Borobudur au lever, avec le Merapi derrière. Y être avant 5 h.\n• Plage de Timang (Gunungkidul, Java) — Téléphérique artisanal en corde au-dessus des rouleaux vers un îlot rocheux. Une heure et demie de Yogya."}],"tagline":"Java d'abord tant qu'il est sec, Bali par la côte la moins arrosée, Flores en dernier — c'est la seule zone encore sèche en novembre.","id":"id","_m":1789344000000},{"arriveBy":"Vol Denpasar → Singapour","blocs":[{"alert":"","base":"Cité-État","code":"A","d1":"2026-11-17","d2":"2026-11-19","days":[],"geo":[[1.352,103.82,"Singapour"]],"id":"sg01","nights":2,"order":10,"sleep":"","status":"idee","title":"Singapour","transport":"Vol","transportNote":"","via":"2 h 35 · DPS → SIN","viaMode":"vol","why":"Jour 1 : Kampong Glam, Haji Lane, dîner hawker (halle de stands de rue) à Lau Pa Sat ou Maxwell, light show des Gardens by the Bay à 19h45. Jour 2 matin : MacRitchie TreeTop Walk, boucle de 10 km en forêt avec des singes, départ tôt pour éviter la chaleur — c'est votre dose de nature.\n\nAprès-midi : Chinatown, Little India, Tiong Bahru. Soir : Old Airport Road Food Centre."},{"alert":"","base":"Détroit de Malacca","code":"B","d1":"2026-11-19","d2":"2026-11-20","days":[],"geo":[[2.194,102.249,"Melaka"]],"id":"sg02","nights":1,"order":20,"sleep":"","status":"idee","title":"Melaka","transport":"Bus","transportNote":"","via":"4 h 30 - 5 h 30 · depuis Golden Mile / Queen Street","viaMode":"bus","why":"Jonker Street, Cheng Hoon Teng, Kampung Kling Mosque, satay celup (brochettes à la fondue d'arachide) chez Capitol. Le lendemain matin : maison Baba-Nyonya, Kampung Morten (hameau malais en bois au bord de la rivière) et le Chetti Village de Gajah Berang — deux quartiers vivants à 15 min du Jonker bondé.\n\nLe Jonker Walk night market ne tourne que du vendredi au dimanche : le 20 est un vendredi, profitez-en dès 18 h avant de prendre le bus de 21 h."},{"alert":"","base":"Malaisie","code":"C","d1":"2026-11-20","d2":"2026-11-21","days":[],"geo":[[3.139,101.687,"Kuala Lumpur"]],"id":"sg03","nights":1,"order":30,"sleep":"","status":"idee","title":"Kuala Lumpur","transport":"Bus","transportNote":"","via":"2 h · Melaka Sentral → TBS","viaMode":"bus","why":"Batu Caves avant 8 h, Masjid Jamek et Merdeka, puis Bukit Nanas Forest Reserve — de la forêt primaire au pied des Petronas. Déjeuner Jalan Alor ou Kampung Baru, village malais en maisons de bois sur pilotis coincé sous les tours, avec son marché de nuit du samedi soir : le contraste urbain le plus saisissant d'Asie du Sud-Est.\n\nVol du soir vers Krabi ou Phuket."}],"color":"#2E8B72","d1":"2026-11-17","d2":"2026-11-21","flag":"🇸🇬🇲🇾","name":"Singapour & Malaisie","nights":4,"order":3,"practical":[{"k":"Ce qu'il faut accepter d'emblée","v":"Perhentian, Redang, Kapas, Tioman : mousson du nord-est de début novembre à fin février. Resorts fermés, bateaux interrompus, mer démontée.\n\nMi-novembre est décrit comme le pic. Tioman n'est en haute saison qu'avril-septembre.\n\nÀ éliminer totalement — et le snorkeling se reporte sur l'Andaman thaïlandaise 24 h plus tard, où il sera excellent."},{"k":"Ce qui marche","v":"Côte ouest (Penang, Langkawi, Melaka) et Singapour entrent aussi en saison humide, mais sous forme d'averses violentes d'après-midi entre de longues plages ensoleillées. Pleinement praticable.\n\nCameron Highlands : frais (15-22 °C) et brumeux, praticable mais les vues sont souvent bouchées."},{"k":"Formalités","v":"Singapour : exemption 90 jours + SG Arrival Card OBLIGATOIRE et gratuite, dans les 3 jours précédant l'arrivée, sur eservices.ica.gov.sg. Malaisie : exemption 90 jours + MDAC obligatoire et gratuit, dans les 3 jours, sur imigresen-online.imi.gov.my.\n\nAttention : de faux sites facturent jusqu'à 80 USD ces deux formulaires gratuits. Vérifiez que l'URL est bien en .gov.sg et .imi.gov.my.\n\nLe MDAC reste requis même en entrant par voie terrestre depuis Singapour."},{"k":"Frontière","v":"Le RTS Link Woodlands North ↔ Bukit Chagar n'ouvre qu'en 2027 : ne comptez pas dessus. Aux deux postes, on descend du bus avec TOUS ses bagages et le bus peut partir sans les retardataires — gardez votre ticket.\n\nÉvitez le vendredi soir et le dimanche ; mardi et jeudi la frontière est fluide."},{"k":"Argent","v":"Singapour est le pays le plus cashless du parcours : carte sans contact partout, MRT payable directement par carte bancaire, pas besoin d'EZ-Link. Malaisie : carte en ville, cash pour les hawkers et les transports."},{"k":"Sécurité","v":"Nord et est du Sabah (Tawau, Sandakan, Semporna) formellement déconseillés par le Quai d'Orsay — hors de votre route de toute façon. Vols à l'arraché à moto à KL.\n\nPeine de mort pour trafic de drogue dans les deux pays."},{"k":"Snorkeling sans certification","v":"• Aucun snorkeling ici (Malaisie) — Toutes les îles snorkelables sont sous mousson (côte est) ou hors de portée (Bornéo, Semporna). Pulau Payar depuis Langkawi a une visibilité médiocre en novembre et impose 2 jours de détour.\n\nDécision propre : on saute, et on reporte sur l'Andaman."},{"k":"Les spots à ne pas rater","v":"• Pulau Ubin (Singapour est) — Bumboat depuis Changi Point. Île sans voitures, vélos de location, sangliers, calaos, et les Chek Jawa Wetlands sur boardwalk.\n\nDemi-journée, l'exact opposé du Singapour de carte postale.\n\n• MacRitchie TreeTop Walk (Singapour centre) — Boucle de 10 km en forêt primaire avec passerelle suspendue. Singes, varans.\n\nPartir tôt : la chaleur monte vite.\n\n• Kampung Baru (Kuala Lumpur) — Village malais en maisons de bois sur pilotis au pied des Petronas. Marché de nuit du samedi : nasi lemak (riz au lait de coco et sambal), ikan bakar (poisson grillé).\n• Kampung Morten & Chetti Village (Melaka) — Un hameau malais au bord de la rivière et la communauté indo-malaise des Chetti Melaka, à 15 min du Jonker bondé.\n• Cameron Highlands (Pahang) — VARIANTE si vous supprimez Melaka : 4 h de bus depuis KL, Tanah Rata, Mossy Forest, plantations BOH Sungai Palas, trails 9 et 10. Réaliste seulement en réduisant Singapour à une nuit."}],"tagline":"Cinq jours, zéro île. La mousson du nord-est ferme la côte est malaise pile à vos dates — l'axe Singapour-Melaka-KL est le seul plan rationnel.","id":"sgmy","_m":1789344000000},{"arriveBy":"Vol Kuala Lumpur → Krabi","blocs":[{"alert":"","base":"Krabi, Andaman","code":"A","d1":"2026-11-22","d2":"2026-11-25","days":[],"geo":[[8.032,98.822,"Ao Nang"]],"id":"th01","nights":3,"order":10,"sleep":"","status":"idee","title":"Ao Nang / Railay","transport":"Vol","transportNote":"","via":"vol direct · KUL → Krabi","viaMode":"vol","why":"Railay East et West en longtail (barque à moteur déporté), Tonsai, Phra Nang Cave sous les falaises. Escalade débutant sur le calcaire, et les Hong Islands en journée.\n\nAttaque directe de l'Andaman en mer déjà calme, sans passer par Bangkok."},{"alert":"","base":"Andaman","code":"B","d1":"2026-11-25","d2":"2026-11-29","days":[],"geo":[[7.618,99.031,"Koh Lanta"]],"id":"th02","nights":4,"order":20,"sleep":"","status":"idee","title":"Koh Lanta","transport":"Bus","transportNote":"","via":"2 h 30 · bus et ponts depuis Krabi","viaMode":"bus","why":"La base pour Koh Rok et Koh Haa, les deux meilleurs snorkels accessibles de l'Andaman. Old Town chinoise sur pilotis, Mu Ko Lanta NP, couchers de soleil côté ouest.\n\nQuatre nuits pour avoir deux jours de bateau et deux jours de rien."},{"alert":"","base":"Îles de Trang","code":"C","d1":"2026-11-29","d2":"2026-12-02","days":[],"geo":[[7.36,99.297,"Koh Mook"]],"id":"th03","nights":3,"order":30,"sleep":"","status":"idee","title":"Koh Mook / Koh Kradan","transport":"Ferry","transportNote":"","via":"ferry · depuis Koh Lanta","viaMode":"ferry","why":"L'Emerald Cave : on nage 80 m dans un tunnel noir jusqu'à une plage cachée au fond d'un puits de falaise. Aucune certification, gilet fourni — mais y aller à 7-8 h avant les bateaux de Trang.\n\nÀ Kradan, le récif frangeant est à 30 m du sable, sans bateau ni guide. Dormez côté village à Koh Mook plutôt que côté resorts : vie de pêcheurs musulmans."},{"alert":"","base":"Tarutao, Satun","code":"D","d1":"2026-12-02","d2":"2026-12-05","days":[],"geo":[[6.489,99.303,"Koh Lipe"]],"id":"th04","nights":3,"order":40,"sleep":"","status":"idee","title":"Koh Lipe","transport":"Ferry","transportNote":"","via":"ferry haute saison · par la mer, pas par la route","viaMode":"ferry","why":"Tarutao Marine Park, Koh Adang, et Jabang — un pinacle de coraux mous visible depuis la surface. Sunrise Beach snorkelable depuis le bord.\n\nTour des 3 ou 5 îles en longtail (barque à moteur déporté). Accès PAR LA MER depuis Koh Lanta ou Krabi : la province de Satun est déconseillée par voie terrestre."},{"alert":"","base":"Surat Thani","code":"E","d1":"2026-12-05","d2":"2026-12-08","days":[],"geo":[[8.911,98.532,"Khao Sok"]],"id":"th05","nights":3,"order":50,"sleep":"","status":"idee","title":"Khao Sok","transport":"Bus","transportNote":"","via":"remontée Pak Bara → Trang → Surat · longue journée","viaMode":"bus","why":"Jungle primaire, plus vieille forêt tropicale du monde. Bungalows flottants sur le lac Cheow Lan entre les pitons karstiques, kayak à l'aube quand la brume se lève et que les gibbons commencent.\n\n**VARIANTE** : troquer une nuit ici contre Khuraburi et les îles Surin — le meilleur snorkeling de Thaïlande, récifs frangeants à 1-3 m de fond, village Moken visitable, ouvert depuis le 15 octobre."},{"alert":"","base":"Nord","code":"F","d1":"2026-12-08","d2":"2026-12-12","days":[],"geo":[[18.788,98.985,"Chiang Mai"]],"id":"th06","nights":4,"order":60,"sleep":"","status":"idee","title":"Chiang Mai","transport":"Vol","transportNote":"","via":"vol direct · Phuket ou Surat Thani → CNX","viaMode":"vol","why":"Doi Suthep, cours de cuisine, Sunday Walking Street, sanctuaire d'éléphants éthique (Elephant Nature Park, pas de balade à dos). Doi Inthanon en journée, point culminant du pays.\n\nDécembre est la meilleure période de l'année ici : sec, ciel clair, nuits fraîches, et avant le brûlis."},{"alert":"","base":"Mae Hong Son","code":"G","d1":"2026-12-12","d2":"2026-12-15","days":[],"geo":[[19.359,98.44,"Pai"]],"id":"th07","nights":3,"order":70,"sleep":"","status":"idee","title":"Pai","transport":"Bus","transportNote":"","via":"3 h, 762 virages · minivan — asseyez-vous devant","viaMode":"bus","why":"Pam Bok, source chaude de Sai Ngam, canyon au coucher, scooter dans la vallée. Variante ambitieuse : la boucle de Mae Hong Son en scooter sur 4-5 jours — mais vérifiez d'abord que votre assurance couvre le deux-roues et que vous avez le permis adéquat, c'est le piège numéro un de l'Asie du Sud-Est."},{"alert":"","base":"Nord","code":"H","d1":"2026-12-15","d2":"2026-12-17","days":[],"geo":[[19.367,98.968,"Chiang Dao"]],"id":"th08","nights":2,"order":80,"sleep":"","status":"idee","title":"Chiang Dao","transport":"Bus","transportNote":"","via":"~4 h · retour vers l'est","viaMode":"bus","why":"Hors des sentiers battus : à 1 h 30 de Chiang Mai et pourtant vide. La grotte de Chiang Dao qui s'enfonce sur des kilomètres, le Wat Tham Pha Plong, le marché tribal du mardi matin.\n\nEt le Doi Luang Chiang Dao, troisième sommet du pays — permis et guide obligatoires, saison novembre à mi-mai."},{"alert":"","base":"Triangle d'or","code":"I","d1":"2026-12-17","d2":"2026-12-19","days":[],"geo":[[19.91,99.841,"Chiang Rai"]],"id":"th09","nights":2,"order":90,"sleep":"","status":"idee","title":"Chiang Rai","transport":"Bus","transportNote":"","via":"~3 h","viaMode":"bus","why":"Wat Rong Khun (le temple blanc), Wat Rong Suea Ten (le bleu), Doi Mae Salong. Et surtout Phu Chi Fa au lever : une mer de nuages au-dessus de la vallée du Mékong, à la frontière laotienne.\n\nDécembre en est le pic, et le public est presque exclusivement thaï."},{"alert":"","base":"Frontière laotienne","code":"J","d1":"2026-12-19","d2":"2026-12-20","days":[],"geo":[[20.262,100.404,"Chiang Khong"]],"id":"th10","nights":1,"order":100,"sleep":"","status":"idee","title":"Chiang Khong","transport":"Bus","transportNote":"","via":"2 h · bus vert depuis le terminal 1","viaMode":"bus","why":"Nuit au bord du Mékong pour être au pont de l'Amitié IV à la première heure et embarquer sur le slow boat le 20 au matin. Faites votre e-visa Laos AVANT pour éviter la file de Huay Xai."}],"color":"#C08A1E","d1":"2026-11-22","d2":"2026-12-20","flag":"🇹🇭","name":"Thaïlande","nights":28,"order":4,"practical":[{"k":"⚠️ Visa réduit à 30 jours le 15/09/2026","v":"L'exemption de visa est passée de 60 à 30 jours pour les Français, publiée au Journal officiel thaïlandais le 31/08 et entrée en vigueur le 15/09/2026. Votre séjour de 28 nuits passe, mais avec DEUX JOURS de marge seulement.\n\nN'allongez pas l'étape thaïe sans démarche. Si vous voulez de l'air : extension de 30 jours sur place (1 900 THB au bureau d'immigration, à la discrétion de l'officier), ou visa touristique TR 60 jours demandé AVANT le départ sur thaievisa.go.th."},{"k":"Preuve de fonds","v":"Rappel officiel de la TAT : 10 000 THB par personne ou 20 000 par famille. Mais France Diplomatie annonce 20 000 THB par personne.\n\nDivergence non résolue : prévoyez 20 000 THB par personne, en liquide ou en preuve bancaire, pour être couverts."},{"k":"TDAC obligatoire","v":"Thailand Digital Arrival Card, gratuite, à soumettre dans les 3 jours précédant l'arrivée sur tdac.immigration.go.th — et nulle part ailleurs, les sites tdac.in.th et consorts sont payants pour un formulaire gratuit."},{"k":"Saison — pourquoi sud puis nord","v":"Côte Andaman : pleine saison sèche dès novembre, décembre à 28 °C, mer calme, visibilité 20-30 m, tous les opérateurs tournent, Similan et Surin ouverts du 15 octobre au 15 mai. AUCUNE annulation météo à craindre — c'est le grand avantage de ce plan.\n\nGolfe de Thaïlande (Koh Tao, Phangan, Samui) : c'est leur saison des pluies, novembre est le pire mois, ferries annulés, ça ne s'assainit qu'en deuxième quinzaine de décembre. Supprimé du plan.\n\nNord : la meilleure période de l'année, sec, ciel clair, 28 °C le jour et 14-16 °C la nuit — et c'est avant la saison du brûlis (février-avril)."},{"k":"Transports","v":"Ferries Andaman (Tigerline, Satun Pakbara, Bundhaya) : n'existent qu'en haute saison, mi-octobre à mi-mai, donc actifs sur toutes vos dates. Réserver la veille via 12Go suffit.\n\nVols intérieurs Krabi/Phuket → Chiang Mai : réserver 3 à 6 semaines avant, décembre est la pointe de l'année. Minivan Chiang Mai → Pai : 3 h et 762 virages, prenez un cachet et asseyez-vous devant."},{"k":"Pièges","v":"Les bus de nuit VIP vendus par les agences de Khao San Road ont une réputation persistante de vols dans les soutes : passez par Mo Chit ou prenez le train. Les billets combinés bateau + bus se décalent en cascade : n'enchaînez jamais un combiné avec un vol le même jour.\n\nLes minivans Lipe → Hat Yai partent tôt et se remplissent la veille."},{"k":"Sécurité","v":"Formellement déconseillés : Narathiwat, Pattani, Yala, Songkhla ; toute la frontière birmane sauf Mae Sot ; une bande de 50 km le long de la frontière cambodgienne (affrontements armés récents). Pour Koh Lipe (province de Satun, déconseillée sauf raison impérative), y accéder PAR LA MER depuis Koh Lanta ou Krabi.\n\nDeux-roues : 90 % des morts sur la route en Thaïlande. La cigarette électronique est totalement interdite, jusqu'à 10 ans de prison."},{"k":"Retraits","v":"250 THB (Visa) à 350 THB (Mastercard) de frais fixes par retrait, même avec une carte dite sans frais. Retirez le maximum possible d'un coup, 20 à 30 000 THB, pour diluer le frais.\n\nRefusez systématiquement la conversion dynamique : « débiter en THB ». Attention, « decline conversion » n'est pas « cancel transaction »."},{"k":"Snorkeling sans certification","v":"• Koh Rok Nok / Koh Rok Yai (depuis Koh Lanta) — Le meilleur snorkel accessible de l'Andaman. Speedboat 1 h.\n\nCorail dur en pente très douce à 1-4 m, eau turquoise, poissons-clowns, mer plate en décembre.\n\n• Koh Haa (depuis Koh Lanta) — Le lagon central est peu profond et totalement abrité. Les grottes et la cheminée sont réservées aux plongeurs — le lagon, non.\n• Emerald Cave (Tham Morakot) (Koh Mook) — 80 m à la nage dans un tunnel noir jusqu'à une plage cachée dans un puits de falaise. Gilet fourni, aucune certification.\n\nY aller à 7-8 h, avant les bateaux de Trang.\n\n• Récif de Koh Kradan (Trang) — Récif frangeant à 30 m du sable, côté est. Depuis la plage, sans bateau ni guide.\n• Jabang & Koh Hin Ngam (Koh Lipe) — Jabang est un pinacle de coraux mous visible depuis la surface. Tour 3 ou 5 îles en longtail (barque à moteur déporté).\n\nSunrise Beach est snorkelable depuis le bord.\n\n• Îles Surin (depuis Khuraburi) — LE meilleur snorkeling de Thaïlande : les plus vastes récifs frangeants peu profonds du pays, 1 à 3 m de fond. Village Moken visitable.\n\nOuvert depuis le 15 octobre. Nuit en tente ou bungalow du parc.\n\n• À exclure sans certification (Andaman) — Richelieu Rock, Hin Daeng, Hin Muang et les pinacles au large des Similan : sites de plongée à courant. Et tout le golfe, Koh Tao inclus, sur vos dates — mer et visibilité mauvaises jusqu'à mi-décembre."},{"k":"Les spots à ne pas rater","v":"• Lac Cheow Lan (Khao Sok) — Bungalows flottants entre les pitons karstiques. Kayak à l'aube dans la brume, gibbons au réveil.\n• Phu Chi Fa & Doi Pha Tang (Chiang Rai) — Lever de soleil sur une mer de nuages au-dessus de la vallée du Mékong. Décembre est le pic de la saison, public presque exclusivement thaï.\n\nNuit sur place à Ban Rom Fah Thai.\n\n• Doi Luang Chiang Dao (Chiang Dao) — Troisième sommet du pays. Permis et guide obligatoires, saison novembre à mi-mai.\n\nLe versant nord est le plus beau.\n\n• Doi Inthanon (depuis Chiang Mai) — Point culminant de la Thaïlande, en journée depuis Chiang Mai. Sentier Kew Mae Pan, chutes de Wachirathan."}],"tagline":"Andaman d'abord — c'est le meilleur snorkeling du voyage — puis le nord en décembre, sa meilleure saison, et sortie par le Mékong.","id":"th","_m":1789344000000},{"arriveBy":"Slow boat Huay Xai → Pakbeng","blocs":[{"alert":"","base":"Mékong","code":"A","d1":"2026-12-20","d2":"2026-12-21","days":[],"geo":[[19.888,101.131,"Pakbeng"]],"id":"la01","nights":1,"order":10,"sleep":"","status":"idee","title":"Pakbeng","transport":"Bateau","transportNote":"","via":"~7 h · slow boat depuis Huay Xai, embarquement ~11 h","viaMode":"bateau","why":"Étape imposée du slow boat, à mi-parcours. Village au bord du Mékong.\n\nMatinées froides sur le bateau en décembre : prévoyez une polaire, un coussin et des provisions. Évitez le speed boat, dangereux."},{"alert":"","base":"Nord","code":"B","d1":"2026-12-21","d2":"2026-12-25","days":[],"geo":[[19.886,102.135,"Luang Prabang"]],"id":"la02","nights":4,"order":20,"sleep":"","status":"idee","title":"Luang Prabang","transport":"Bateau","transportNote":"","via":"~8 h · arrivée vers 17 h","viaMode":"bateau","why":"Le Tak Bat (l'aumône des moines à l'aube) à 5h30 (l'aumône des moines — à observer de loin et en silence, pas au flash), le mont Phousi au coucher, le Wat Xieng Thong, le marché du matin de Phosi. Le musée UXO, indispensable pour comprendre le pays.\n\nLes chutes de Kuang Si et le centre de sauvetage des ours, les grottes de Pak Ou en bateau. Et en fin d'après-midi, en pirogue : Ban Chan le village de potiers et Ban Xang Hai la distillerie de lao-lao (alcool de riz local), hors du circuit matinal groupé."},{"alert":"","base":"Nam Ou","code":"C","d1":"2026-12-25","d2":"2026-12-27","days":[],"geo":[[20.567,102.617,"Nong Khiaw"]],"id":"la03","nights":2,"order":30,"sleep":"","status":"idee","title":"Nong Khiaw","transport":"Bus","transportNote":"","via":"3-4 h · minivan depuis la gare routière nord","viaMode":"bus","why":"Pitons karstiques au-dessus de la rivière. Pha Daeng Peak et le Nang None viewpoint (visez 9h30, quand la brume perce), grottes-refuges de guerre de Pha Tok, kayak sur la Nam Ou, trek dans les villages Khmu et Hmong.\n\nEt le trek des 100 Waterfalls : on remonte littéralement le lit d'une cascade sur des centaines de mètres, pieds dans l'eau. En décembre le débit est parfait et il n'y a presque personne."},{"alert":"","base":"Nam Ou","code":"D","d1":"2026-12-27","d2":"2026-12-28","days":[],"geo":[[20.703,102.633,"Muang Ngoi"]],"id":"la04","nights":1,"order":40,"sleep":"","status":"idee","title":"Muang Ngoi Neua","transport":"Bateau","transportNote":"","via":"1 h · départs 11 h et 14 h depuis Nong Khiaw","viaMode":"bateau","why":"Hors des sentiers battus. Village sans route, coincé entre les pitons, électricité limitée.\n\nMarche de 2-3 h vers Ban Na puis Huay Bo, avec possibilité de nuit chez l'habitant dans des villages Khmu. Retirez du cash à Luang Prabang : ici c'est liquide uniquement."},{"alert":"","base":"Nam Song","code":"E","d1":"2026-12-28","d2":"2026-12-31","days":[],"geo":[[18.924,102.447,"Vang Vieng"]],"id":"la05","nights":3,"order":50,"sleep":"","status":"book","title":"Vang Vieng","transport":"Train","transportNote":"","via":"1 h · LCR — billets à J-7 seulement, semaine saturée","viaMode":"train","why":"Blue Lagoon 3 et 5, les viewpoints de Pha Ngeun et Nam Xay avec les montgolfières au lever et un ciel parfait en décembre, tubing dans la grotte de Tham Nam à la corde et lampe frontale, boucle scooter rive ouest, kayak sur la Nam Song. Prudence : les activités d'ici n'ont aucun contrôle de sécurité, et l'alcool frelaté a fait des morts."},{"alert":"","base":"Capitale","code":"F","d1":"2026-12-31","d2":"2027-01-02","days":[],"geo":[[17.975,102.63,"Vientiane"]],"id":"la06","nights":2,"order":60,"sleep":"","status":"book","title":"Vientiane","transport":"Train","transportNote":"","via":"1 h · LCR","viaMode":"train","why":"Réveillon sur les quais du Mékong. Pha That Luang, Patuxai, le Buddha Park de Xieng Khuan, et le COPE Visitor Centre — indispensable, sur les séquelles des bombardements et le déminage.\n\nMarché de nuit au bord du fleuve. Départ le 02/01 vers Bangkok puis Colombo."}],"color":"#5A79B8","d1":"2026-12-20","d2":"2027-01-02","flag":"🇱🇦","name":"Laos","nights":13,"order":5,"practical":[{"k":"Saison — rien à arbitrer","v":"Saison sèche et fraîche : ciel dégagé, pluies quasi nulles. Nord (Luang Prabang, Nong Khiaw) : 25-28 °C le jour, 10-15 °C la nuit, et une brume matinale spectaculaire sur le Mékong et la Nam Ou jusqu'à 9-10 h — superbe, mais les points de vue peuvent être bouchés au lever, visez plutôt 9h30.\n\nLa saison du brûlis qui sature l'air du nord démarre fin janvier : vous passez juste avant, visibilité claire garantie."},{"k":"Visa obligatoire","v":"Pas d'exemption pour les Français. e-Visa 30 jours sur laoevisa.gov.la — et UNIQUEMENT ce domaine : evisagov.la se présente comme officiel et ne l'est pas.\n\nDélai 3 jours ouvrés, validité 60 jours après approbation, donc à demander vers début décembre, pas maintenant. Scan couleur de la page biométrique avec les deux lignes MRZ et photo 4×6 fond blanc.\n\nL'e-Visa n'est valable qu'à 9 points d'entrée : aéroports de Vientiane, Luang Prabang et Pakse, les 3 ponts de l'Amitié, 2 gares. Le pont de l'Amitié IV à Huay Xai en fait partie.\n\nSinon, visa à l'arrivée avec 40 USD EN ESPÈCES et une photo."},{"k":"Exigence particulière","v":"France Diplomatie signale que les voyageurs étrangers doivent présenter une attestation d'assurance couvrant les frais d'hospitalisation. Emportez-la en anglais, sur papier ET sur le téléphone.\n\nEt exigez votre tampon d'entrée : sans lui, amende d'au moins 200 USD à la sortie."},{"k":"Train LCR — la révolution du pays","v":"Vientiane ↔ Luang Prabang en 2 h, Luang Prabang ↔ Vang Vieng en 1 h, à 160 km/h. MAIS les billets ne s'ouvrent que 7 jours avant le départ.\n\nRéservez DÈS L'OUVERTURE pour les trajets du 28 au 31 décembre : c'est la semaine la plus chargée de l'année. Via l'app LCR, 12go.asia, ou faites faire par la guesthouse.\n\nGares excentrées : 14 km du centre de Vientiane, 12 km de Luang Prabang, prévoyez 45 min de marge. Le contrôle de sécurité confisque aérosols, déodorants en spray et gel hydroalcoolique."},{"k":"Argent","v":"Le cash est roi, la carte est quasi inutilisable hors hôtels. Prévoyez 80-100 USD en billets neufs et non pliés par personne.\n\nRetirez à Luang Prabang : les guesthouses de Muang Ngoi ne prennent que le liquide et les distributeurs délivrent des sommes limitées."},{"k":"Sécurité","v":"UXO : ne sortez JAMAIS des sentiers sans guide, surtout vers la frontière vietnamienne. Vols à l'arraché à moto à Vientiane et Luang Prabang.\n\nLes activités de Vang Vieng (tubing, tyrolienne, montgolfière) n'ont AUCUN contrôle de sécurité, accidents graves réguliers. Alcool frelaté : empoisonnements collectifs mortels au méthanol à Vang Vieng — pas de cocktails ni de spiritueux non cachetés.\n\nCouvre-feu théorique à 23 h. Bus de nuit VIP sleeper : couchettes doubles partagées avec un inconnu, conduite rapide en montagne — à éviter dès qu'il y a une alternative de jour ou le train."},{"k":"Paludisme","v":"C'est le pays le plus concerné de votre parcours : transmission toute l'année sauf Vientiane, risque maximal dans le tiers sud. Pas de chimioprophylaxie requise pour un tourisme conventionnel selon l'Institut Pasteur, mais protection anti-moustique impérative, et à rediscuter en consultation si vous dormez en zone rurale du sud."},{"k":"Pas de snorkeling","v":"Le Laos est enclavé — c'est assumé, et c'est pour ça que la Thaïlande juste avant est chargée en Andaman. Substituts aquatiques : kayak sur la Nam Ou et la Nam Song, vasques turquoise de Kuang Si, tubing dans la grotte de Tham Nam, Blue Lagoon 3."},{"k":"Les spots à ne pas rater","v":"• Trek des 100 Waterfalls (Nong Khiaw) — On remonte le lit d'une cascade sur plusieurs centaines de mètres, pieds dans l'eau, entre les rochers. Débit parfait en décembre, presque personne.\n\n1 ou 2 jours avec nuit au village.\n\n• Muang Ngoi Neua (Nam Ou) — Village sans route, accessible uniquement en bateau. Grottes-refuges de la guerre secrète.\n\nMarche de 2-3 h vers Ban Na et Huay Bo, nuit chez l'habitant chez les Khmu.\n\n• Chutes de Kuang Si (Luang Prabang) — Vasques turquoise en escalier, la plus haute est la plus calme. Centre de sauvetage des ours à l'entrée.\n• Musée UXO & COPE Centre (Luang Prabang / Vientiane) — Sur les munitions non explosées et le déminage. Les deux lieux les plus importants du pays pour comprendre où vous êtes.\n• Ban Chan & Ban Xang Hai (Luang Prabang) — Village de potiers et village de distillation de lao-lao (alcool de riz local), en pirogue en fin d'après-midi. Hors du circuit matinal groupé de Pak Ou.\n• Pha Daeng Peak (Nong Khiaw) — Le viewpoint sur la boucle de la Nam Ou. Montée raide d'une heure.\n\nVisez 9h30 plutôt que le lever : la brume matinale bouche tout jusqu'à 9-10 h en décembre.\n\n• Plaine des Jarres (Phonsavan) — VARIANTE si vous prenez le vol Chiang Mai → Luang Prabang au lieu du slow boat, ce qui rend 2 nuits. Jarres mégalithiques de 2 000 ans au milieu de cratères de bombes encore visibles, centre MAG sur le déminage.\n\n8 h de route depuis Luang Prabang, ou un vol.\n\n• Boucle de Thakhek & grotte de Kong Lor (Laos centre) — **VARIANTE EXCLUSIVE** : abandonner le nord pour 3 jours de scooter et 7,5 km de rivière souterraine en pirogue. Superbe, mais vous perdez Nong Khiaw — moins pertinent pour votre équilibre."}],"tagline":"La meilleure fenêtre de l'année, sans le moindre arbitrage météo à faire. Sec, frais, et juste avant la saison du brûlis.","id":"la","_m":1789344000000},{"arriveBy":"Vol Vientiane → Bangkok → Colombo","blocs":[{"alert":"","base":"Côte ouest","code":"A","d1":"2027-01-03","d2":"2027-01-04","days":[],"geo":[[7.209,79.838,"Negombo"]],"id":"lk01","nights":1,"order":10,"sleep":"","status":"idee","title":"Negombo","transport":"Vol","transportNote":"","via":"vol via Bangkok · l'aéroport CMB est à Negombo, pas à Colombo","viaMode":"vol","why":"Nuit d'atterrissage. Plage de pêcheurs, marché au poisson à l'aube.\n\nAchetez une SIM Dialog ou Mobitel au comptoir de l'aéroport, la couverture rurale y est bien meilleure que le roaming."},{"alert":"","base":"Triangle culturel","code":"B","d1":"2027-01-04","d2":"2027-01-06","days":[],"geo":[[8.311,80.403,"Anuradhapura"]],"id":"lk02","nights":2,"order":20,"sleep":"","status":"idee","title":"Anuradhapura","transport":"Train","transportNote":"","via":"~4 h · train ou bus direct","viaMode":"train","why":"Les ruines à vélo, c'est la bonne échelle : Sri Maha Bodhi, Jetavanaramaya, Abhayagiri, les bassins jumeaux de Kuttam Pokuna. Excursion à Mihintale, berceau du bouddhisme sri-lankais."},{"alert":"","base":"Triangle culturel","code":"C","d1":"2027-01-06","d2":"2027-01-09","days":[],"geo":[[7.957,80.76,"Sigiriya"]],"id":"lk03","nights":3,"order":30,"sleep":"","status":"idee","title":"Sigiriya / Dambulla","transport":"Bus","transportNote":"","via":"2 h","viaMode":"bus","why":"Pidurangala au lever — la vue sur le rocher de Sigiriya, bien meilleure que l'inverse, et bien moins chère. Puis Sigiriya même, les grottes de Dambulla, et Polonnaruwa à vélo en excursion.\n\nMontez tôt : la chaleur est écrasante après 9 h."},{"alert":"","base":"Hill country","code":"D","d1":"2027-01-09","d2":"2027-01-11","days":[],"geo":[[7.291,80.636,"Kandy"]],"id":"lk04","nights":2,"order":40,"sleep":"","status":"idee","title":"Kandy","transport":"Bus","transportNote":"","via":"3 h","viaMode":"bus","why":"Le Temple de la Dent à la puja de 18h30, le marché central, les jardins de Peradeniya. Base pour les Knuckles.\n\nC'est ici qu'il faut réserver le train pour Ella, 30 jours à l'avance à 8h30 heure locale."},{"alert":"","base":"Knuckles Range","code":"E","d1":"2027-01-11","d2":"2027-01-12","days":[],"geo":[[7.417,80.788,"Meemure"]],"id":"lk05","nights":1,"order":50,"sleep":"","status":"idee","title":"Meemure","transport":"Route","transportNote":"","via":"piste depuis Hunnasgiriya","viaMode":"taxi","why":"Hors des sentiers battus. Village isolé au bout d'une piste, cerné par les parois de Lakegala, sans couverture réseau, homestays chez l'habitant, culture Vedda encore présente.\n\nBase parfaite pour une journée de trek dans les Knuckles (Mini World's End) sans les groupes de Kandy."},{"alert":"","base":"Hill country","code":"F","d1":"2027-01-12","d2":"2027-01-14","days":[],"geo":[[6.767,80.958,"Haputale"]],"id":"lk06","nights":2,"order":60,"sleep":"","status":"idee","title":"Haputale","transport":"Train","transportNote":"","via":"~5 h · le tronçon Nanu Oya-Ella est le plus beau","viaMode":"train","why":"Lipton's Seat : 7 km de montée à travers les plantations Dambatenne, départ à 5h30 à pied, arrivée au promontoire d'où Thomas Lipton contemplait son empire. C'est l'alternative gratuite et vide à Horton Plains, avec la même mer de nuages.\n\nSi vous voulez Horton Plains et World's End, il faut y être avant 9h30 depuis Ohiya : après, les nuages montent."},{"alert":"","base":"Dalhousie","code":"G","d1":"2027-01-14","d2":"2027-01-15","days":[],"geo":[[6.809,80.499,"Adam's Peak"]],"id":"lk07","nights":1,"order":70,"sleep":"","status":"idee","title":"Adam's Peak","transport":"Bus","transportNote":"","via":"via Hatton · détour","viaMode":"bus","why":"Saison de pèlerinage de la pleine lune de décembre à mai : vous êtes en plein dedans. Montée de nuit à partir de 2 h, 5 500 marches, lever de soleil au sommet et l'ombre triangulaire du pic projetée sur la plaine.\n\nLe sommet est glacial : polaire obligatoire. Optionnel mais marquant."},{"alert":"","base":"Hill country","code":"H","d1":"2027-01-15","d2":"2027-01-18","days":[],"geo":[[6.875,81.046,"Ella"]],"id":"lk08","nights":3,"order":80,"sleep":"","status":"idee","title":"Ella","transport":"Train","transportNote":"","via":"~3 h · depuis Haputale ou Nanu Oya","viaMode":"train","why":"Little Adam's Peak au lever, Ella Rock (plus dur, moins fréquenté), le pont des Neuf Arches. Et Diyaluma Falls : montez jusqu'aux vasques du haut, la cascade vue d'en bas ne vaut pas le détour."},{"alert":"","base":"Sud-est","code":"I","d1":"2027-01-18","d2":"2027-01-20","days":[],"geo":[[6.284,81.288,"Tissamaharama"]],"id":"lk09","nights":2,"order":90,"sleep":"","status":"idee","title":"Tissamaharama","transport":"Bus","transportNote":"","via":"4 h · par Wellawaya","viaMode":"bus","why":"Safari. Udawalawe plutôt que Yala : éléphants garantis et beaucoup moins de jeeps.\n\nYala bloc 1 a les léopards mais aussi les embouteillages de 4×4. VARIANTE nature : troquer ces 2 nuits contre Sinharaja, forêt primaire UNESCO avec guide obligatoire — humide et sangsues garanties en janvier, mais sans foule."},{"alert":"","base":"Côte sud","code":"J","d1":"2027-01-20","d2":"2027-01-22","days":[],"geo":[[5.948,80.459,"Mirissa"]],"id":"lk10","nights":2,"order":100,"sleep":"","status":"idee","title":"Mirissa / Weligama","transport":"Bus","transportNote":"","via":"bus côtier","viaMode":"bus","why":"Baleines bleues au départ de 6 h, mer calme en janvier, la meilleure saison. Coconut Tree Hill, Secret Beach, surf débutant à Weligama, et snorkel au lagon de Polhena près de Matara — fond de 1-2 m protégé par une barrière de récif, tortues fréquentes.\n\nMéfiez-vous des courants dans les passes du récif à marée haute."},{"alert":"","base":"Côte sud","code":"K","d1":"2027-01-22","d2":"2027-01-24","days":[],"geo":[[6.01,80.249,"Unawatuna"]],"id":"lk11","nights":2,"order":110,"sleep":"","status":"idee","title":"Unawatuna / Galle","transport":"Bus","transportNote":"","via":"40 min","viaMode":"bus","why":"Le fort de Galle, remparts au coucher, marché. Jungle Beach et le récif de Rumassala, à la nage ou en tuk-tuk plus 10 min de marche — le matin, avant que le vent se lève.\n\nEt si vous voulez le meilleur snorkel du pays, Hikkaduwa Coral Sanctuary est à 40 min : récif protégé très peu profond, tortues vertes qui broutent au bord, visibilité 10-18 m."}],"color":"#1F87A0","d1":"2027-01-03","d2":"2027-01-24","flag":"🇱🇰","name":"Sri Lanka","nights":21,"order":6,"practical":[{"k":"Saison — la ligne de partage","v":"Côte sud (Mirissa, Weligama, Unawatuna, Tangalle) : pleine haute saison, ciel clair, mer plate, les conditions les plus calmes de l'année, et saison des baleines bleues depuis Mirissa. Côte ouest (Hikkaduwa, Kalpitiya) : sèche, Bar Reef en pleine saison.\n\nTriangle culturel : quelques averses la première semaine puis ça s'assèche. Hill country : frais et brumeux le matin, nuits à 5-10 °C à Nuwara Eliya.\n\nCôte EST (Trincomalee, Pigeon Island, Arugam Bay) : **ENCORE SOUS MOUSSON**, visibilité sous-marine inférieure à 5 m, opérateurs fermés — c'est l'erreur classique des itinéraires copiés-collés."},{"k":"⚠️ ETA — à faire avant le départ, sans faute","v":"Depuis le 15/10/2025, l'ETA à l'arrivée N'EXISTE PLUS : aucune délivrance au comptoir de l'aéroport. Elle est GRATUITE pour les Français depuis le 25/05/2026, 30 jours, sur eta.gov.lk et nulle part ailleurs — les intermédiaires facturent 50 à 100 USD une prestation gratuite.\n\nMAIS le régime de gratuité a été annoncé pour un an avec une revue à 6 mois, qui tombe vers novembre 2026 : REVÉRIFIEZ eta.gov.lk en décembre. Si la gratuité tombe, l'ETA repasse à 50 USD."},{"k":"⚠️ Billet de sortie — votre point noir","v":"C'est le seul trou du dossier : vous n'aurez aucun billet après le Sri Lanka, et l'exigence de billet retour y est écrite noir sur blanc, avec justificatifs de ressources. Le risque de refus d'embarquement sur le vol vers Colombo est sérieux.\n\nSolution la plus fiable : un vrai billet Colombo → Chennai, Trivandrum ou Malé (50-110 € par personne), ou directement Colombo → Europe en aller simple, ce qui règle aussi votre retour. Un billet loué type onwardticket est un filet de sécurité acceptable, pas un plan principal ici.\n\nÀ proscrire absolument : les dummy tickets PDF sans PNR réel, c'est de la falsification."},{"k":"Trains — la vraie difficulté logistique","v":"Kandy ↔ Ella / Nanu Oya : les places réservées s'ouvrent EXACTEMENT 30 jours avant, à 8h30 heure de Colombo, sur seatreservation.slr.lk — et partent en quelques minutes en janvier. Créez le compte à l'avance et mettez une alarme.\n\nPlan B : la 3e classe non réservée se prend le jour même, montez à Kandy même (terminus) pour avoir une place. Plan C : les wagons privés ExpoRail et Rajadhani, attelés aux mêmes trains, se réservent plus facilement.\n\nAttention aux faux billets réservés vendus par des rabatteurs à la gare de Kandy."},{"k":"Transports","v":"Bus CTB rouges et privés partout, sans réservation, s'arrêtent partout. Les express climatisés sur l'autoroute E01 (Colombo-Galle-Matara) sont rapides et confortables.\n\nTuk-tuk : app PickMe, tarif au compteur. Scooter ou tuk-tuk en location : permis international ET permis temporaire sri-lankais obligatoires — sans les deux, l'assurance ne couvre rien.\n\nRetards de 1 à 2 h courants sur les trains de montagne : ne planifiez jamais un vol le jour d'un long trajet ferroviaire."},{"k":"Le jour du départ","v":"L'accès à l'aéroport depuis le sud est le maillon faible du pays. Depuis Galle, bus express de l'autoroute E01, 3 h à 3 h 30 jusqu'à Colombo puis navette.\n\nComptez 6 h de marge avant le vol."},{"k":"Sécurité","v":"Vigilance renforcée sur tout le pays. Mines et UXO dans le Nord et l'Est : restez sur les axes, évitez forêts et bâtiments abandonnés.\n\nVols de plage par des motards, vols dans trains et bus. Harcèlement de rue et agressions sexuelles documentés : évitez les déplacements nocturnes isolés.\n\nNoyades : même par mer d'huile, la côte sud a de vrais courants d'arrachement à Unawatuna et Mirissa — entrez là où il y a des locaux, avec un gilet fourni par l'opérateur."},{"k":"Santé","v":"Paludisme éradiqué depuis 2016, aucune prophylaxie. En revanche janvier est post-mousson, donc PIC DE DENGUE : le moustique Aedes pique le jour, répulsif en journée et pas seulement le soir.\n\nEn cas de fièvre : paracétamol uniquement, jamais d'aspirine ni d'ibuprofène, et consultation."},{"k":"Snorkeling sans certification","v":"• Hikkaduwa Coral Sanctuary (Côte ouest) — Le meilleur choix sur vos dates. Récif protégé très peu profond, à quelques mètres du bord, tortues vertes qui broutent au bord.\n\nVisibilité 10-18 m dans le sanctuaire, eau 28-30 °C, pas de combinaison.\n\n• Polhena Beach (Matara) — Lagon protégé par une barrière de récif, fond de 1-2 m, tortues fréquentes. Depuis la plage.\n\nMéfiez-vous des courants dans les passes du récif à marée haute.\n\n• Jungle Beach / Rumassala (Unawatuna) — Récif rocheux et corallien, poissons-papillons. À la nage depuis Jungle Beach.\n\nLe matin, avant que le vent se lève.\n\n• Bar Reef Marine Sanctuary (Kalpitiya) — Le plus grand récif du pays, saison décembre-avril, plus des dauphins spinner par centaines. Le spot sérieux de janvier — mais il faut un détour de 2-3 nuits au nord de Colombo, à insérer en début ou fin de séjour.\n• À proscrire en janvier (Côte est) — Pigeon Island, Nilaveli, Trincomalee, Batticaloa : la mousson du nord-est y donne une visibilité inférieure à 5 m et les opérateurs sont fermés."},{"k":"Les spots à ne pas rater","v":"• Lipton's Seat (Haputale) — 7 km de montée à travers les plantations Dambatenne, départ 5h30. La même mer de nuages qu'à Horton Plains, gratuite et vide.\n• Meemure (Knuckles) — Village isolé sans réseau, cerné par les parois de Lakegala. Homestays, culture Vedda.\n\nBase pour les Knuckles sans les groupes.\n\n• Pidurangala (Sigiriya) — Le rocher d'en face. Meilleure vue sur Sigiriya que Sigiriya elle-même, et bien moins cher.\n\nAu lever.\n\n• Baleines bleues (Mirissa) — Départ 6 h, saison novembre-avril, mer la plus calme de l'année en janvier. Choisissez un opérateur qui respecte les distances d'approche.\n• Udawalawe (Sud) — Éléphants garantis et beaucoup moins de jeeps qu'à Yala. Le bon choix pour un safari qui ne ressemble pas à un embouteillage.\n• Péninsule de Jaffna & île de Delft (Nord) — HORS ITINÉRAIRE mais janvier y est sec et venteux, zéro routard. Train de nuit depuis Colombo, temple Nallur Kandaswamy, et les poneys sauvages de Delft descendus des chevaux portugais."}],"tagline":"Janvier, fin de la mousson du nord-est : le sud et l'ouest sont parfaits, l'est est à proscrire. La règle est aussi simple que ça.","id":"lk","_m":1789344000000}],"bookings":[{"cat":"transport","crit":true,"detail":"La vente s'est ouverte hier, le 12 septembre. C'est le billet le plus urgent du voyage : lundi 12 octobre est Sports Day, dernier jour d'un week-end de trois jours, juste après le festival de Takayama et au début des couleurs d'automne.\n\nLes trains de l'après-midi et du soir se vident de leurs places en 24 à 48 h. Sur eki-net (JR East), pas smartEX.","done":false,"due":"2026-09-13","id":"b01","order":0,"tags":["japon","trains"],"title":"Shinkansen Nagano → Tokyo du 12/10","url":"https://www.eki-net.com/en/jreast-train-reservation/Top/Index","when":"avant","_m":1789344000000},{"cat":"transport","crit":true,"detail":"Tout le reste en dépend — le vol, les hôtels de fin, les billets d'événements. Rappel de fait : le 15 octobre est un JEUDI, le samedi c'est le 17.\n\nTrois options. (A) Jeudi 15, le plan actuel.\n\n(B) Vendredi 16 : d'après les données Expedia 2026, le vendredi est le jour de départ statistiquement le moins cher, environ 8 % sous le dimanche qui est le plus cher — une nuit de plus, un peu de budget en moins. (C) Lundi 19 ou mardi 20, et c'est mon avis : le Kawagoe Matsuri tombe les samedi 17 et dimanche 18, patrimoine UNESCO, 29 chars monumentaux, affrontements nocturnes de chars aux lanternes, à 30 min d'Ikebukuro — vous seriez à côté sans le voir.\n\nEt la Climax Series de baseball se joue du 14 au 20, potentiellement au Tokyo Dome. À éviter absolument : partir le samedi 17 ou le dimanche 18.","done":false,"due":"2026-09-15","id":"b55","order":5,"tags":["japon","vols","decision"],"title":"TRANCHER : combien de nuits à Tokyo et quel jour partir","url":"","when":"avant","_m":1789344000000},{"cat":"transport","crit":true,"detail":"Décision structurante, parce qu'elle déplace deux nuits et change la réservation des hébergements du bloc Fuji.\n\n**Mon avis après réexamen : oui, deux nuits, axe Nishi-Izu puis Shuzenji.** Vos arguments d'origine étaient exacts sur le bambou, le wasabi et le village thermal — trois doublons réels. Mais votre voyage japonais ne contient pas un mètre de côte, et Izu apporte trois choses uniques : la Nishi-Izu Skyline (la plus belle route de l'itinéraire), la côte de Jōgasaki (dix kilomètres de sentier sur falaises de lave), et le poisson de côte.\n\n**Les deux nuits se prennent sur Tokyo** (4 au début au lieu de 5, 2 à la fin au lieu de 3). Jamais sur Kyoto, jamais sur les Alpes, et surtout pas en touchant au festival de Takayama qui est une date fixe.\n\n!! Si vous tranchez oui, il faut aussi reprendre : les nuits de Kawaguchiko, la date de restitution de la voiture, et les candidats hébergement (Musōan Biwa à Toi et Arai Ryokan à Shuzenji deviennent pertinents ; les deux adresses de Hakone perdent leur nuit).\n\nFiche complète dans l'onglet À savoir du Japon.","done":false,"due":"2026-09-16","id":"b56","order":6,"tags":["japon","decision","izu"],"title":"Trancher : Izu ou pas","url":"","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Le permis international français N'EST PAS reconnu au Japon. Il faut une traduction officielle en japonais.\n\nLe JAF est passé 100 % en ligne, ne peut pas être saisi depuis l'étranger, et vous n'aurez que deux jours ouvrés à Tokyo (24 et 25/09) à cause de la Silver Week.\n\n**ALADDIN**, également agréé, délivre en 5 000 ¥ le lendemain ouvré avec une option d'urgence en 1 heure. Envoyez aujourd'hui un mail à info@aladdin.or.jp avec les scans couleur recto-verso des deux permis, vos numéros de passeport, la date d'entrée (21/09) et la phrase : « we must pick up a rental car in Shinjuku on Sat 26 Sept, can we pre-file now and collect on Thu 24?\n\n». Sans ça, les deux locations tombent.","done":false,"due":"2026-09-13","id":"b02","order":10,"tags":["japon","permis","voiture"],"title":"Écrire à ALADDIN pour la traduction des permis","url":"https://aladdin.or.jp/en/","when":"avant","_m":1789344000000},{"cat":"transport","crit":true,"detail":"Six jours, et c'est la location indispensable : sans elle, pas de Gokayama, pas de Togakushi, et surtout pas de nuit à Hirayu pendant le festival. Toyota Rent a Car EN DIRECT (pas via Booking).\n\nRestitution le lundi 12/10, Sports Day, sur l'axe le plus demandé de l'année : réservez maintenant. Exigez à la réservation : carte ETC (~330 ¥, impossible à obtenir autrement pour un touriste), option NOC/Anshin (sans elle, 20 000 à 50 000 ¥ de pénalité en cas de sinistre même sans faute), GPS anglais.\n\nFaites tourner le simulateur de frais d'aller simple : si ça dépasse 20 000 ¥, deux locations aller-retour avec jonction en Shinkansen reviennent moins cher.","done":false,"due":"2026-09-14","id":"b03","order":20,"tags":["japon","voiture"],"title":"Voiture 2 — Kanazawa → Nagano, 06 au 12/10","url":"https://rent.toyota.co.jp/eng/service/oneway/simulation.aspx","when":"avant","_m":1789344000000},{"cat":"loge","crit":true,"detail":"Priorité numéro un côté hébergement. Takayama est complète depuis un an à cause du festival ; Hirayu, à 40 min de route, est votre solution — et elle part vite aussi.\n\nPassez par l'association des ryokan de Hirayu et TÉLÉPHONEZ plutôt que de passer par une plateforme : les ryokan gardent souvent du stock hors ligne. Repli : Shin-Hirayu, Fukuji, Shinhotaka, Tochio, ou Gero Onsen à 1 h.","done":false,"due":"2026-09-14","id":"b04","order":30,"tags":["japon","festival","hebergement"],"title":"Hirayu Onsen — nuits du 08 et 09/10","url":"https://www.hirayuonsen.or.jp/stay.php","when":"avant","_m":1789344000000},{"cat":"loge","crit":true,"detail":"La réservation la plus difficile du voyage : une vingtaine de maisons, 3 à 5 chambres chacune. Bonne nouvelle, le 6 est un mardi ordinaire, hors week-end et hors festival — la meilleure configuration possible.\n\nLe système officiel de l'office de tourisme n'ouvre qu'à 3 mois, mais les paiements échoués remettent des chambres en vente au bout d'une heure : du stock réapparaît en continu. Essayez le site officiel, puis Jalan, puis téléphonez directement (Koemon, Kanjiya, Yosobe).\n\nPlan B équivalent et bien plus facile : une minshuku à Ainokura, qui est sur votre route.","done":false,"due":"2026-09-14","id":"b05","order":40,"tags":["japon","hebergement"],"title":"Minshuku gassho-zukuri à Shirakawa-gō — 06/10","url":"https://shirakawa-go.gr.jp/en/stay/","when":"avant","_m":1789344000000},{"cat":"loge","crit":true,"detail":"Le lien que vous m'avez envoyé. Je n'ai pas pu ouvrir la page — Airbnb bloque la lecture automatique — donc deux points à vérifier vous-mêmes.\n\n**LE QUARTIER** : avec un atterrissage en fin d'après-midi et cinq nuits de décalage horaire, visez Asakusa, Kuramae, Ueno ou Nihonbashi. Shinjuku et Shibuya vous coûteraient une correspondance de métro chaque soir.\n\n**LES DATES** : la Silver Week du 19 au 23 septembre sature tout et fait monter les tarifs, vérifiez que les cinq nuits sont bien disponibles d'un coup. Si c'est bon, c'est le choix le plus simple : un seul lieu, zéro déménagement, et une cuisine pour les petits-déjeuners à 5 h quand le décalage vous réveille.","done":false,"due":"2026-09-15","id":"b46","order":46,"tags":["japon","hebergement"],"title":"Valider l'Airbnb de Tokyo","url":"https://www.airbnb.com/properties/1715243366420197541","when":"avant","_m":1789344000000},{"cat":"loge","crit":true,"detail":"Vous atterrissez le premier jour de la Silver Week (19-23/09, cinq jours fériés). Visez Asakusa ou Kuramae : meilleur rapport prix-charme, calme le soir, idéal pour le décalage.\n\n55-75 € la double. Dormy Inn Asakusa à ~80 € vaut le surcoût (grand bain onsen sur le toit, ramen offert le soir).","done":false,"due":"2026-09-14","id":"b06","order":50,"tags":["japon","hebergement"],"title":"Hôtels de Tokyo — 21 au 26/09, cinq nuits","url":"","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"La seule tâche avec un délai biologique incompressible. Hépatite A et typhoïde : une injection, efficaces en 15 jours, donc couvertes avant l'Indonésie.\n\nRage : deux doses à J0 et J7, la seconde se fait à Tokyo — fortement recommandée pour Bali, la Thaïlande, le Laos et le Sri Lanka, elle évite les immunoglobulines souvent introuvables sur place. Encéphalite japonaise : schéma accéléré J0 + J7, co-administrable avec la rage.\n\nInstitut Pasteur, Air France Vaccinations, Bichat, Pitié — beaucoup prennent en urgence sous 48 h.","done":false,"due":"2026-09-14","id":"b07","order":60,"tags":["sante","vaccins"],"title":"Rendez-vous en centre de vaccinations internationales","url":"https://www.pasteur.fr/fr/centre-medical","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Benchmark déjà fait, il reste à signer : 15 minutes, attestation immédiate, aucun délai d'instruction. Chapka Cap Aventure (0 € de franchise médicale, RC 4,5 M€, conçu pour 3-24 mois) ou ACS Globe Partner si budget serré.\n\nCochez l'option deux-roues si vous comptez louer un scooter en Asie du Sud-Est — sans elle, un accident n'est couvert ni par l'assurance ni par le loueur. Et récupérez l'attestation EN ANGLAIS : le Laos l'exige à l'entrée.","done":false,"due":"2026-09-15","id":"b08","order":70,"tags":["assurance"],"title":"Souscrire l'assurance voyage","url":"","when":"avant","_m":1789344000000},{"cat":"transport","crit":true,"detail":"Ne prenez pas quatre jours. La voiture n'est PAS utile à Hakone : le Hakone Free Pass couvre le train Odakyu, le petit train Tozan, le funiculaire, le téléphérique, le bateau du lac Ashi et les bus, toute la boucle est conçue autour, et le parking d'Owakudani est saturé avant 10 h.\n\nElle est indispensable pour le tour des cinq lacs du Fuji et pour la route Mishima-Turnpike. DONC : rendez-la à Odawara le soir du J8 et faites Hakone au Free Pass le J9.\n\nEt surtout ne la rendez pas à Tokyo — Odawara est déjà sur la ligne du Shinkansen, remonter à Tokyo ajouterait 80 km à rebours pour gagner cinq minutes de train.\n\n**VARIANTE POUR ÉCONOMISER ENCORE UN JOUR** : bus direct Shinjuku → Kawaguchiko le matin du J6 (1 h 45, ~2 000 ¥) et location sur place à la gare de Kawaguchiko, où Toyota a une agence — vous arrivez au lac vers 10 h au lieu de midi et vous ne payez que deux ou trois jours. Dans tous les cas : carte ETC et option NOC/Anshin demandées à la réservation.","done":false,"due":"2026-09-15","id":"b09","order":90,"tags":["japon","voiture"],"title":"Voiture 1 — la version allégée","url":"https://rent.toyota.co.jp/eng/","when":"avant","_m":1789344000000},{"cat":"loge","crit":true,"detail":"La nuit signature. Rakuten Travel ou Jalan, filtre « vue Mont Fuji + onsen ».\n\n**AVANT DE RÉSERVER**, comparez deux options : une nuit en demi-pension à 180-220 € puis un business hotel le 27 (ce qui impose un déménagement au milieu du bloc, au moment où vous voulez être dehors à l'aube), OU deux nuits dans le même ryokan en formule sudomari (sans dîner, nettement moins chère) avec un seul kaiseki payé à part. La seconde option coûte souvent pareil et vous évite de refaire les sacs.","done":false,"due":"2026-09-15","id":"b10","order":90,"tags":["japon","hebergement"],"title":"Ryokan vue Fuji à Kawaguchiko — 26/09","url":"","when":"avant","_m":1789344000000},{"cat":"loge","crit":true,"detail":"Le point dur du budget japonais : 85-110 € la double début octobre. Karasuma / Shijo (central, sur les deux lignes de métro) ou Kyoto Station.\n\nMitsui Garden Sanjo, Daiwa Roynet Shijo Karasuma, Dormy Inn Premium Ekimae. C'est ici qu'une guesthouse ferait la plus grosse économie du séjour si le budget dérape.","done":false,"due":"2026-09-16","id":"b12","order":110,"tags":["japon","hebergement"],"title":"Hôtels de Kyoto — 29/09 au 04/10, cinq nuits","url":"","when":"avant","_m":1789344000000},{"cat":"transport","crit":true,"detail":"À faire dès que la date est tranchée, et de toute façon avant de partir : c'est votre preuve de sortie du Japon, exigée au comptoir à Roissy le 20 septembre. Un aller simple vers Tokyo déclenche une question quasi certaine.\n\nUn seul vol direct vers Bali : Garuda GA881, Narita → Denpasar, quotidien, départ 11 h, 7 h 30 de vol — rien depuis Haneda. Jakarta est bien mieux desservi, six vols par jour (ANA et Garuda depuis Haneda, JAL et ANA depuis Narita), et « Jakarta + un vol intérieur vers Denpasar » revient souvent moins cher avec beaucoup plus de choix d'horaires.\n\nAucun jour n'est à proscrire mi-octobre. Si la date bouge encore, prenez un billet modifiable plutôt que rien.","done":false,"due":"2026-09-17","id":"b11","order":115,"tags":["vols","indonesie"],"title":"Réserver le vol Japon → Indonésie","url":"","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Airalo Asialink, 100 Go / 180 jours : la validité de six mois est ce qui compte, pas le volume. Mettez une marque DIFFÉRENTE sur le second téléphone (Ubigi ou Saily) : si un opérateur partenaire tombe dans un pays, l'autre fait hotspot.\n\nInstallez à la maison en wifi, ligne désactivée — le compteur ne démarre qu'à la première connexion. Un QR eSIM ne se scanne QU'UNE FOIS.\n\nVérifiez aussi que les deux téléphones sont désimlockés : le déverrouillage est gratuit mais prend jusqu'à 10 jours ouvrés.","done":false,"due":"2026-09-16","id":"b13","order":120,"tags":["esim"],"title":"eSIM installées, profils désactivés","url":"https://www.airalo.com/asia-esim","when":"avant","_m":1789344000000},{"cat":"billet","crit":false,"detail":"Vous ne voulez pas un billet de tournoi cher, et il y a mieux.\n\n• LE JUNGYO (tournée régionale) : une journée complète de 8h30 à 14h30 avec DEUX HEURES D'ENTRAÎNEMENT PUBLIC de 9 h à 11 h, les combats, le sumo comique, les chants, et l'entrée cérémonielle des yokozu ntement nocturne des chars face à face, orchestres qui se défient à la lumière des lanternes. Un million de visiteurs, 30 min de Ikebukuro par la Tobu Tojo ou de Shinjuku par la Seibu Shinjuku, trains supplémentaires prévus.\n\nC'est gratuit et il n'y a pas de billet à prendre — mais l'hébergement de ces nuits-là, oui.","done":false,"due":"2026-09-25","id":"b28","order":123,"tags":["japon","festival"],"title":"Kawagoe Matsuri — seulement si vous prolongez","url":"https://kawagoematsuri.jp/","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Le seul vrai trou du dossier. Vos six premières frontières s'auto-résolvent — chaque vol prouve la sortie du pays précédent — mais après le Sri Lanka vous n'avez rien, et l'exigence de billet retour y est écrite noir sur blanc.\n\nRisque sérieux de refus d'embarquement sur le vol vers Colombo. Solution la plus propre : Colombo → Europe en aller simple, ce qui règle aussi votre retour.\n\nSinon Colombo → Chennai, Trivandrum ou Malé pour 50-110 €. Un billet loué est un filet, pas un plan.\n\nJamais de dummy ticket PDF sans PNR : c'est de la falsification.","done":false,"due":"2026-09-18","id":"b14","order":130,"tags":["vols","sri-lanka","frontiere"],"title":"Régler la sortie du Sri Lanka","url":"","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Depuis octobre 2025, l'ETA à l'arrivée n'existe plus : aucune délivrance au comptoir de Colombo. Gratuite pour les Français depuis mai 2026, 30 jours, obtention en quelques heures — sur eta.gov.lk UNIQUEMENT, les intermédiaires facturent 50 à 100 USD une prestation gratuite.\n\nÀ revérifier en décembre : le régime de gratuité fait l'objet d'une revue à six mois vers novembre.","done":false,"due":"2026-09-17","id":"b15","order":140,"tags":["visa","sri-lanka"],"title":"ETA Sri Lanka","url":"https://www.eta.gov.lk/slvisa/","when":"avant","_m":1789344000000},{"cat":"admin","crit":true,"detail":"Optionnel sur le papier, utile en pratique : les Joint Ki
